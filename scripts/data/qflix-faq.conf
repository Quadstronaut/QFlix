# QFlix FAQ + Tutorial · static page, public (no htpasswd).
#
# Deploy:
#   scp scripts/data/qflix-faq.html        $SEEDBOX:~/www/qflix-faq/index.html
#   scp scripts/data/qflix-faq.conf        $SEEDBOX:~/.apps/nginx/proxy.d/qflix-faq.conf
#   ssh $SEEDBOX 'app-nginx restart'
#
# The outer Ultra.cc nginx proxies all paths to this user-nginx on port 17040
# (see ~/.apps/nginx/sites-enabled/default). The default `location /` requires
# htpasswd; opting out for /faq is via `auth_basic off` below — same pattern as
# listmonk.conf and tautulli.conf.

location ^~ /faq {
    auth_basic off;

    alias /home/quadstronaut/www/qflix-faq;
    index index.html;
    try_files $uri $uri/ /faq/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

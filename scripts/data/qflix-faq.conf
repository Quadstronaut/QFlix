# QFlix FAQ + Tutorial · static page, public (no htpasswd).
#
# Deploy:
#   scp scripts/data/qflix-faq.html        $SEEDBOX:~/www/qflix-faq/index.html
#   scp scripts/data/qflix-faq.conf        $SEEDBOX:~/.apps/nginx/proxy.d/qflix-faq.conf
#   ssh $SEEDBOX 'app-nginx restart'
#
# The outer Ultra.cc nginx proxies all paths to this user-nginx on port 17040
# (see ~/.apps/nginx/sites-enabled/default). The default `location /` requires
# htpasswd; opting out for /faq is via `auth_basic off` below — same pattern as
# listmonk.conf and tautulli.conf.

# ---------------------------------------------------------------------------
# WHY the access_log / error_log pair below (added 2026-08-19)
#
# Failure it ends: the ONE server block that serves this slot
# (~/.apps/nginx/sites-available/default, listen 17040) carries, at SERVER
# level, `access_log off; error_log /dev/null;`. Those beat the http-level
# `access_log logs/access.log;` in nginx.conf:25 and inherit into every
# location that does not declare its own. Result, verified on the box
# 2026-08-19: logs/access.log was 0 bytes with an mtime of 2026-05-08
# (provisioning day) and every /faq request since May left no trace anywhere.
# No way to answer "did the FAQ 404", "when did the scanner start", or "is
# anyone actually reading this page".
#
# The dashboard block (scripts/qflix-dash/qflix-dash.nginx.conf.tmpl) fixed
# `location /` the same way on the same day, and explicitly handed /faq and
# /images to their own files because `location ^~ ...` prefix blocks are
# separate and keep inheriting the server-level `off`. This is that handoff.
#
# Why not fix the two panel lines instead: sites-available/default is
# Ultra.cc PANEL-TEMPLATED. The panel rewrites it, so hand-editing it is the
# same class of mistake as hand-editing the panel-templated
# qbittorrent.service -- it survives until the next panel write, then the
# logs go dark again with nothing in git to explain why. This fragment is
# QFlix-owned, so the override belongs here. nginx resolves access_log at the
# innermost level that declares it, so this cleanly beats the server-level
# `off` without touching a panel line.
#
# `main` is the http-level log_format declared at nginx.conf:28 -- confirmed
# present in the RUNNING config on the box 2026-08-19, and the same name the
# dash block resolves to. It is chosen over the built-in `combined` because
# it carries $http_x_forwarded_for, which is the real client IP behind the
# Ultra.cc front proxy that terminates 443 and forwards to 17040; `combined`
# would log the proxy's address for every request. It is pinned literally
# here (not templated) because this file is deployed by a plain scp, so a
# future panel edit that drops log_format `main` from nginx.conf would fail
# `nginx -t` -- which is exactly why nginx -t MUST pass before any reload.
#
# Paths are relative to the nginx prefix, matching the panel's own style:
# nginx runs as `/usr/sbin/nginx -p /home/quadstronaut/.apps/nginx/ -c
# nginx.conf`, so `logs/x` resolves to ~/.apps/nginx/logs/x. Rotation for
# those files is covered by scripts/configure/250-logrotate-install.sh
# (the /home/quadstronaut/.apps/nginx/logs/*.log stanza, copytruncate).
# ---------------------------------------------------------------------------
location ^~ /faq {
    auth_basic off;

    # Overrides this server block's `access_log off; error_log /dev/null;`.
    # Do not "fix" those two panel-owned lines instead -- see the header.
    access_log  logs/qflix-faq.access.log main;
    error_log   logs/qflix-faq.error.log warn;

    alias /home/quadstronaut/www/qflix-faq;
    index index.html;
    try_files $uri $uri/ /faq/index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}

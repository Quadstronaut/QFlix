# scripts/data/qflix-images.conf
# QFlix self-hosted brand assets · public, no htpasswd, hardened.
#
# Listmonk's media uploader is restricted (size caps, no clean public URLs),
# so we host newsletter brand assets (Q.png, future images) here and reference
# them by absolute URL in the template.
#
# Deploy via scripts/configure/60-www-images.sh (idempotent).

# ---------------------------------------------------------------------------
# WHY the access_log / error_log pair below (added 2026-08-19)
#
# Failure it ends: the ONE server block serving this slot
# (~/.apps/nginx/sites-available/default, listen 17040) sets, at SERVER level,
# `access_log off; error_log /dev/null;`. That beats the http-level
# `access_log logs/access.log;` in nginx.conf:25 and inherits into every
# location that does not declare its own. Verified on the box 2026-08-19:
# logs/access.log was 0 bytes, mtime 2026-05-08 (provisioning day). So every
# hit on /images/ since May was invisible -- including the ones this block
# was hardened FOR. The extension allowlist, the 405 on non-GET, and the
# `error_page 403 404 =404 /images/_blank.png` mask all exist to blunt
# probing, and none of them could be observed: a scanner walking
# /images/../etc/passwd and a member's mail client fetching Q.png produced
# identical evidence, namely none.
#
# The dashboard block (scripts/qflix-dash/qflix-dash.nginx.conf.tmpl) fixed
# `location /` the same way on the same day and handed /faq and /images/ to
# their own files, because `location ^~ ...` prefix blocks are separate and
# keep inheriting the server-level `off`. This is that handoff.
#
# Why not fix the two panel lines instead: sites-available/default is
# Ultra.cc PANEL-TEMPLATED and gets rewritten, so hand-editing it is the same
# class of mistake as hand-editing the panel-templated qbittorrent.service.
# This fragment is QFlix-owned, so the override belongs here.
#
# Declared on the OUTER location so it also covers the nested allowlist
# location and the masked 404 path -- nginx inherits access_log/error_log
# downward, and the miss traffic is the half worth seeing.
#
# `main` is the http-level log_format at nginx.conf:28 -- confirmed present in
# the RUNNING config on the box 2026-08-19, same name the dash block resolves
# to. Chosen over built-in `combined` because it carries
# $http_x_forwarded_for, the real client IP behind the Ultra.cc front proxy
# that terminates 443 and forwards to 17040. Pinned literally (this file ships
# by plain scp, not templating), so a future panel edit dropping log_format
# `main` would fail `nginx -t` -- which is why nginx -t MUST pass before any
# reload.
#
# Paths are relative to the nginx prefix (`nginx -p
# /home/quadstronaut/.apps/nginx/`), so `logs/x` is ~/.apps/nginx/logs/x.
# Rotation is covered by scripts/configure/250-logrotate-install.sh
# (the /home/quadstronaut/.apps/nginx/logs/*.log stanza, copytruncate).
# ---------------------------------------------------------------------------
location ^~ /images/ {
    auth_basic off;
    autoindex off;

    # Overrides this server block's `access_log off; error_log /dev/null;`.
    # Do not "fix" those two panel-owned lines instead -- see the header.
    access_log  logs/qflix-images.access.log main;
    error_log   logs/qflix-images.error.log warn;

    alias /home/quadstronaut/www/images/;

    # Mask 403/404 responses with the 1×1 transparent PNG, but PRESERVE the
    # 404 status code (=404) so probes can't distinguish hit/miss by body
    # alone. Scoped inside this location so other apps' error pages aren't
    # affected.
    error_page 403 404 =404 /images/_blank.png;

    # Allowlist image extensions only. Anything else falls through to the
    # outer `return 404` below (which then triggers error_page above).
    location ~ ^/images/.+\.(png|jpg|jpeg|webp|gif|ico)$ {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }

        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Anything that doesn't match the allowlist (e.g. /images/, /images/foo.txt,
    # /images/.htaccess, /images/../etc/passwd): 404 via the masked error page.
    return 404;
}

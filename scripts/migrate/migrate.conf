# scripts/migrate/migrate.conf -- path constants + policy for the box-2 migration.
#
# Sourced by _common.sh. NO HOSTS, NO SECRETS, NO APP LISTS here: hosts come
# from arguments (or gitignored secrets/), and every per-app table comes from
# manifest/apps.yaml through migrate_manifest.py. What stays here is layout
# (where things live under $HOME on a box) and the few policy names that are
# not apps (the comms jobs I-1 holds, the gate unit I-5 swaps).
#
# All paths are relative to the box user's $HOME and identical on both boxes:
# the installers keep the ~/.apps/<slug> layout (spec 5.1).

# --- media (30-sync-media.sh, 00-preflight.sh, 40 media spot-check) ---------
MEDIA_ROOT_REL="media"
# The libraries 00-preflight sizes and 40-validate-green samples.
MEDIA_LIBRARIES=("TV Shows" "Movies" "Anime" "Anime Movies")
# Newsletter poster cache served by nginx; moves with the media.
NEWSLETTER_POSTERS_REL="www/images/newsletter"

# --- I-1: member-facing comms jobs, held on green until cutover -------------
# manifest/jobs.yaml KEYS, resolved to a timer unit or a crontab script by
# `migrate_manifest.py comms`. An unknown key fails the run.
COMMS_JOBS=(qflix-newsletter cron-listmonk-sync)
# The maint daemon pages Discord directly through this secret (lib/notify.py),
# not only through Kuma. A muted side has it parked as <name>.held.
DISCORD_WEBHOOK_SECRET="discord-webhook.url"
# Marker prefix for a crontab line held by the migration (idempotent toggle).
CRON_HOLD_TAG="#qflix-migrate-held# "

# --- I-5: the entitlement gate ----------------------------------------------
GATE_UNIT="manitoba-maint-entitlement.service"
GATE_DROPIN_REL=".config/systemd/user/${GATE_UNIT}.d/execute.conf"
MEMBERS_REL="secrets/members.yaml"

# --- 35-sync-appdata: master-era state the stale branch missed --------------
# "<home-relative dir>|<comma-separated rsync excludes>[|<dest dir on green>]".
# Sqlite files inside are snapshotted with VACUUM INTO, never copied live.
#   .opt/maint   reaper orphan state, entitlement state, notify.log +
#                notify-fail.log, regrab/remux ledgers, window-log. Excludes
#                are the files 240 deploys or the box owns (manifest copies,
#                pusher runtime state, the webhook port) and swap/.
#   swap         blue's UCC swap state (listen-set.before, soak, rollback
#                window) is HISTORY on box 2: it describes Ultra containers.
#                It lands BESIDE green's live swap dir; copied into it, green's
#                listen-set leg would diff against blue's container listeners.
#   kometa       Kometa config (plex url/token are re-linked for P1, see README)
#   tdarr        server DB2 (includes the flows) + configs. The ffmpeg threadcap
#                shim is NOT copied: 50-tdarr-install.sh re-applies it on green
#                and 40-validate-green asserts it.
#   vlogs        VictoriaLogs data (90-day retention)
STATE_TREES=(
  ".opt/maint|apps.yaml,jobs.yaml,rea-noise-classes.yaml,maintenance.port,state.json,_stage,swap"
  ".opt/maint/swap||.opt/maint/swap.from-blue"
  ".apps/kometa/config|logs"
  ".apps/tdarr/server/Tdarr/DB2|"
  ".apps/tdarr/configs|"
  ".apps/vlogs/data|"
)
# Excluded from every sqlite-tree app copy (cache, logs, binaries, backups).
APP_TREE_EXCLUDES="bin,venv,.venv,logs,Backups,backups,MediaCover,cache,Cache,*.pid,*.lock"
# qBittorrent profile (panel user unit on Ultra keeps it in the XDG dirs).
QBIT_PROFILE_DIRS=(".config/qBittorrent" ".local/share/qBittorrent")

# --- postgres (A13 shape: globals + -Fc) ------------------------------------
PG_USER="quadstronaut"
PG_DATABASES=(listmonk)
# Blue (UCC postgres) password source; green's native postgres reads
# ~/secrets/postgres.password (written by its 3NN native installer).
BLUE_PG_PASSWORD_CMD='base64 -d ~/.apps/postgres/.encoded.dat | head -c 24'

# --- local evidence (gitignored: secrets/ is untracked) ---------------------
MIGRATE_STATE_REL="secrets/migrate"

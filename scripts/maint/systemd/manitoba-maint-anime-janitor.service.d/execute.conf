# ARMED drop-in for the anime-library janitor. The base unit ships DRY-RUN
# (safe default); this drop-in adds --execute so the daily run actually re-homes
# confirmed non-anime out of the anime libraries. Council-hardened execute path
# (containment, import-verify, created-vs-adopted rollback, run-lock) + Phase-0
# live-validated 2026-07-25 (correctly migrated the live-action Cowboy Bebop
# (2021) out of the Anime library). --max-pct 80 is tuned for the small anime
# library (a 1-of-2 correction is 50% and must not trip); the classifier already
# self-protects against a metadata outage (missing originalLanguage -> flag,
# never auto-move). Remove this file to revert to dry-run.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 %h/scripts/maint/qflix-anime-janitor.py --execute --max-pct 80

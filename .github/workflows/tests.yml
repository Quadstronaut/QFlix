name: tests

# Runs the pure-Python unit suite on every PR and every push to master.
# tests/run.sh is self-contained: it builds tests/.venv, installs
# pytest/pyyaml/requests/jinja2, and runs tests/unit/ (no SSH, no secrets).
# Gate this job in branch protection (required_status_checks: "pytest") so a
# red suite blocks merge — the gap that let 17 failing tests sit on master.
#
# The `pwsh` job (added 2026-07-29, Phase 0 of the Convergent Audit Regime)
# closes the OTHER gap: the PowerShell suite that guards the LLM alerting layer
# ran in ZERO CI. Defect class C-10 asserts, from manifest/audit-scope.yaml,
# that every tracked test file is executed by a live job here — delete a job
# below and `qflix-audit` exits 1 naming the orphaned tests.

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: bash tests/run.sh -q

  audit:
    # The Convergent Audit Regime, actually RUN.
    #
    # Without this step the regime is a guard that is committed but never
    # scheduled -- the precise failure mode it was built to enumerate (C-01
    # timer-without-deadman, C-10 test-not-in-CI). The audit named that class in
    # its own manifests while not running anywhere itself, which would have been
    # a fitting way to ship it.
    #
    # qflix-audit.py exits 1 on any ENFORCED finding and 0 when only advisory
    # ones remain, so this fails the build exactly when a defect class the repo
    # has committed to holding is violated. Zero findings is explicitly NOT the
    # deliverable -- docs/audit-residual-risk.md says so in its first paragraph.
    # The deliverable is DETERMINISM: same commit -> same report_digest, so
    # "will it find something new?" becomes "did the digest change?"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the boundary is `git ls-files`; a shallow clone lies
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install audit deps
        run: python -m pip install --quiet pyyaml
      - name: Convergent audit (fails on ENFORCED findings)
        env:
          PYTHONPATH: scripts/maint
        run: python scripts/maint/qflix-audit.py
      - name: Assert the report digest is reproducible
        env:
          PYTHONPATH: scripts/maint
        run: |
          set -euo pipefail
          a=$(python scripts/maint/qflix-audit.py | grep -oE 'digest=[0-9a-f]+' | head -1)
          b=$(python scripts/maint/qflix-audit.py | grep -oE 'digest=[0-9a-f]+' | head -1)
          echo "run1 $a"
          echo "run2 $b"
          if [ "$a" != "$b" ]; then
            echo "::error::audit is non-deterministic at a fixed commit — the regime's core guarantee is broken"
            exit 1
          fi

  pwsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: REA policy-seam tests (always run)
        shell: pwsh
        run: ./tests/local-llm/test-rea-noise-classes.ps1

      - name: S2 backup tests (always run)
        shell: pwsh
        # Subject is scripts/local-llm/backup-untracked.ps1, which IS tracked —
        # so unlike the REA suite below, every structural block really runs here.
        # Its one LIVE block (verify the real B:\BAKS mirror) skips loudly on a
        # runner with no such volume and says so in the output.
        run: ./tests/local-llm/test-backup-untracked.ps1
      - name: REA suite (subject is an audit-scope S2 member)
        shell: pwsh
        run: |
          # tests/local-llm/test-qflix-rea.ps1 dot-sources
          # scripts/local-llm/qflix-rea.ps1, which .gitignore:55 keeps out of
          # git (operator-local tooling, public repo). On a hosted runner the
          # subject is absent, so its 85 Test-Case blocks CANNOT run here.
          #
          # This is registered residual R4 — read it as a limit, not a pass.
          # The skip is LOUD, and the job still executes the file wherever the
          # subject exists (workstation / self-hosted runner), which is the
          # only place those assertions mean anything.
          $subject = 'scripts/local-llm/qflix-rea.ps1'
          if (Test-Path $subject) {
            ./tests/local-llm/test-qflix-rea.ps1
          } else {
            Write-Host "SKIP tests/local-llm/test-qflix-rea.ps1"
            Write-Host "     subject $subject is untracked by design (audit-scope S2)."
            Write-Host "     85 Test-Case blocks did NOT run on this runner. Residual R4."
          }

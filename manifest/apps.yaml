defaults:
  health_timeout_s: 5
  recovery_attempts: 3
  recovery_backoff_s: [10, 30, 60]
  lifecycle_timeout_s: 60
  kuma_recheck_delay_s: 90

# Monitors in our shared Kuma instance that belong to other operator-owned
# projects. They count toward live_count but never toward drift, and the
# smoke test excludes them from the all-up count.
kuma_external_monitors:
  - "Quadstronix"
  - "Quadstronix Node 1"
  - "Quadstronix Node 2"

apps:

  # --- UCC apps (managed by Ultra.cc app-<slug> commands) ---

  sonarr:
    class: ucc
    ucc_slug: sonarr
    kuma_monitor: "Sonarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: sonarr.key
      port_secret: sonarr.port
      urlbase_secret: sonarr.urlbase
      expect_status: 200

  sonarr2:
    class: ucc
    ucc_slug: sonarr2
    kuma_monitor: "Sonarr Anime"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: sonarr2.key
      port_secret: sonarr2.port
      urlbase_secret: sonarr2.urlbase
      expect_status: 200

  radarr:
    class: ucc
    ucc_slug: radarr
    kuma_monitor: "Radarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: radarr.key
      port_secret: radarr.port
      urlbase_secret: radarr.urlbase
      expect_status: 200

  radarr2:
    class: ucc
    ucc_slug: radarr2
    kuma_monitor: "Radarr 2"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: radarr2.key
      port_secret: radarr2.port
      urlbase_secret: radarr2.urlbase
      expect_status: 200

  prowlarr:
    class: ucc
    ucc_slug: prowlarr
    kuma_monitor: "Prowlarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v1/system/status"
      auth_header: "X-Api-Key"
      auth_secret: prowlarr.key
      port_secret: prowlarr.port
      urlbase_secret: prowlarr.urlbase
      expect_status: 200

  bazarr:
    class: ucc
    ucc_slug: bazarr
    kuma_monitor: "Bazarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/system/status"
      auth_header: "X-Api-Key"
      auth_secret: bazarr.key
      port_secret: bazarr.port
      urlbase_secret: bazarr.urlbase
      expect_status: 200

  bazarr2:
    # Second Bazarr instance for the anime *arr pair (Sonarr2 + Radarr2).
    # Bazarr's hardcoded one-Sonarr/one-Radarr limit forces this. Ultra.cc
    # has no `app-bazarr2`, so it's a bare-Python install under
    # ~/.apps/bazarr2/ managed by a user systemd unit.
    class: systemd
    unit: bazarr2.service
    kuma_monitor: "Bazarr 2"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/system/status"
      auth_header: "X-Api-Key"
      auth_secret: bazarr2.key
      port_secret: bazarr2.port
      urlbase_secret: bazarr2.urlbase
      expect_status: 200

  qbittorrent:
    class: ucc
    ucc_slug: qbittorrent
    kuma_monitor: "qBittorrent"
    health:
      kind: http_root
      port_secret: qbittorrent.port
      expect_status: 200

  plex:
    # Plex is the canonical media server (per project_plex-primary-jellyfin-trial).
    # /identity returns 200 + a MediaContainer XML without auth — perfect liveness probe.
    class: ucc
    ucc_slug: plex
    kuma_monitor: "Plex"
    health:
      kind: http_root
      port_secret: plex.port
      path_override: "/identity"
      expect_status: 200

  seerr:
    class: ucc
    ucc_slug: seerr
    kuma_monitor: "Seerr"
    health:
      kind: http_api
      path_template: "/api/v1/status"
      auth_header: "X-Api-Key"
      auth_secret: seerr.key
      port_secret: seerr.port
      expect_status: 200

  tautulli:
    class: ucc
    ucc_slug: tautulli
    kuma_monitor: "Tautulli"
    health:
      kind: http_root
      port_secret: tautulli.port
      expect_status: 200

  audiobookshelf:
    class: ucc
    ucc_slug: audiobookshelf
    kuma_monitor: "Audiobookshelf"
    health:
      kind: http_root
      port_secret: audiobookshelf.port
      path_override: "/healthcheck"
      expect_status: 200

  kavita:
    class: ucc
    ucc_slug: kavita
    kuma_monitor: "Kavita"
    health:
      kind: http_api
      path_template: "/api/health"
      auth_header: "Authorization"
      auth_secret: kavita.key
      port_secret: kavita.port
      expect_status: 200

  komga:
    class: ucc
    ucc_slug: komga
    kuma_monitor: "Komga"
    health:
      kind: http_root
      port_secret: komga.port
      path_override: "/komga/"
      expect_status: 200

  calibre-web:
    class: ucc
    ucc_slug: calibre-web
    kuma_monitor: "Calibre-Web"
    health:
      kind: http_root
      port_secret: calibre-web.port
      expect_status: 200

  homarr:
    class: ucc
    ucc_slug: homarr
    kuma_monitor: "Homarr"
    health:
      kind: http_root
      port_secret: homarr.port
      expect_status: 200

  flaresolverr:
    # Binds only on the Docker bridge gateway (172.17.0.1:17011), not host
    # loopback — hostname override below routes the probe accordingly.
    class: ucc
    ucc_slug: flaresolverr
    kuma_monitor: "FlareSolverr"
    health:
      kind: http_root
      hostname: "172.17.0.1"
      port_secret: flaresolverr.port
      expect_status: 200

  maintainerr:
    class: ucc
    ucc_slug: maintainerr
    kuma_monitor: "Maintainerr"
    health:
      kind: http_api
      path_template: "/api/settings"
      auth_header: "X-Api-Key"
      auth_secret: maintainerr.key
      port_secret: maintainerr.port
      expect_status: 200
      basic_auth_user: "quadstronaut"
      basic_auth_secret: "htpasswd.password"

  unpackerr:
    # Auto-extracts completed archives from qBittorrent for the *arr stack.
    # Runs as a Docker-wrapped UCC app (`/app/unpackerr -c /config/unpackerr.conf`).
    # No HTTP surface and no user systemd unit (UCC runs it under supervisord);
    # liveness is asserted by smoke-test.sh section 8 (`ps -ef | grep /app/unpackerr`).
    # process_pattern probe matches `/app/unpackerr` in `ps -ef`; the pusher
    # pushes UP/DOWN to Kuma monitor "Unpackerr" every 60s.
    class: ucc
    ucc_slug: unpackerr
    kuma_monitor: "Unpackerr"
    health:
      kind: process_pattern
      pattern: "/app/unpackerr"

  # --- systemd apps (managed by systemctl --user) ---

  postgres:
    # Database backend for Listmonk. UCC runs Postgres under supervisord;
    # process_pattern matches the checkpointer subprocess (only present when
    # Postgres is healthy and accepting writes).
    class: ucc
    ucc_slug: postgres
    kuma_monitor: "Postgres"
    health:
      kind: process_pattern
      pattern: "postgres: checkpointer"


  listmonk:
    class: systemd
    unit: listmonk.service
    kuma_monitor: "Listmonk"
    health:
      kind: http_root
      port_secret: listmonk.port
      expect_status: 200
    upgrade:
      kind: tarball_swap
      url_template: "https://github.com/knadh/listmonk/releases/download/v{version}/listmonk_v{version}_linux_amd64.tar.gz"
      target_path: "~/.apps/listmonk/bin/listmonk"
      post_steps:
        - "~/.apps/listmonk/bin/listmonk --install --idempotent --yes"

  tdarr-server:
    class: systemd
    unit: tdarr-server.service
    kuma_monitor: "Tdarr"
    health:
      kind: http_api
      path_template: "/api/v2/status"
      port_source: "json_file:~/.apps/tdarr/configs/Tdarr_Server_Config.json:serverPort"
      expect_status: 200
    upgrade:
      kind: zip_swap
      url_template: "https://storage.tdarr.io/versions/{version}/linux_x64/Tdarr_Server.zip"
      target_dir: "~/.apps/tdarr/Tdarr_Server"
      version_pin:
        source: versions.env
        key: TDARR_VERSION
        max: "2.17.01"
        max_reason: "GLIBC 2.34 required, host has 2.31"

  tdarr-node:
    class: systemd
    unit: tdarr-node.service
    kuma_monitor: "Tdarr Node"
    health:
      kind: systemd_only
      expect: active
    upgrade:
      kind: zip_swap
      url_template: "https://storage.tdarr.io/versions/{version}/linux_x64/Tdarr_Node.zip"
      target_dir: "~/.apps/tdarr/Tdarr_Node"
      version_pin:
        source: versions.env
        key: TDARR_VERSION
        max: "2.17.01"
        max_reason: "GLIBC 2.34 required, host has 2.31"

  # --- cron apps (timer-driven, no lifecycle start/stop) ---

  recyclarr:
    class: cron
    # unit is the .service (not the .timer) so health probe reads the last
    # invocation's Result via systemd_oneshot. The .timer remains the scheduler.
    unit: recyclarr.service
    kuma_monitor: "Recyclarr"
    health:
      kind: systemd_oneshot
    upgrade:
      kind: tarball_swap
      url_template: "https://github.com/recyclarr/recyclarr/releases/download/{version}/recyclarr-linux-x64.tar.xz"
      target_path: "~/.apps/recyclarr/bin/recyclarr"

  qflix-newsletter:
    # Weekly Plex digest. Triggered by qflix-newsletter.timer (Mon 08:00),
    # which fires the qflix-newsletter.service oneshot. Replaces Conjurr +
    # Newsletterr (retired 2026-05-10). Source lives in scripts/qflix-newsletter/.
    class: cron
    unit: qflix-newsletter.service
    kuma_monitor: "Qflix Newsletter"
    health:
      kind: systemd_oneshot

  buildarr:
    # Manages all 4 *arr instances (sonarr, sonarr2, radarr, radarr2) via
    # declarative YAML, fired by buildarr.timer Mon-Sun 04:30. Probe is
    # systemd_oneshot — reads the .service ExecMainStatus, so a buildarr
    # failure surfaces in Kuma/Discord immediately rather than being masked
    # by the timer's perpetual "active" state.
    #
    # buildarr-sonarr 0.6.4 + buildarr-radarr 0.2.6 are not natively compatible
    # with Sonarr v4 / Radarr v6 — see scripts/configure/60-buildarr-patches.sh
    # and scripts/patches/buildarr-*.patch for the 7 in-venv edits that bridge
    # the gap. When upstream catches up the operator can `pip install -U
    # buildarr buildarr-sonarr buildarr-radarr` and retire the patches (the
    # script's header documents the removal path).
    class: cron
    unit: buildarr.service
    kuma_monitor: "Buildarr"
    health:
      kind: systemd_oneshot

  upgradinatorr:
    # Re-searches stale *arr grabs across sonarr/sonarr2/radarr/radarr2.
    # Runs weekly Sun 06:04 via upgradinatorr.timer. ExecStart fans out per app.
    class: cron
    unit: upgradinatorr.service
    kuma_monitor: "Upgradinatorr"
    health:
      kind: systemd_oneshot

  bazarr2-sync:
    # Hourly drift check: pin bazarr2's running version to bazarr-1's by
    # fetching the matching morpheus65535/bazarr tag, re-applying the
    # waitress threads=100→4 patch, refreshing deps, and restarting
    # bazarr2.service. systemd_oneshot probes the .service's Result so a
    # sync failure surfaces in Kuma/Discord even though the .timer stays
    # green between fires.
    class: cron
    unit: bazarr2-sync.service
    kuma_monitor: "Bazarr 2 Sync"
    health:
      kind: systemd_oneshot

  kometa:
    class: cron
    unit: kometa.service
    kuma_monitor: "Kometa"
    health:
      kind: systemd_oneshot
    upgrade:
      kind: git_checkout
      repo_path: "~/.apps/kometa/repo"
      post_steps:
        - "cd ~/.apps/kometa/repo && .venv/bin/pip install -r requirements.txt"

  # --- library apps (no service, no lifecycle) ---

  python-plexapi:
    class: library
    unit: null
    kuma_monitor: "PlexAPI"
    health:
      kind: import_check
      venv_python: "~/.apps/python-plexapi/venv/bin/python"
      module: "plexapi"
    upgrade:
      kind: pip_install
      venv_python: "~/.apps/python-plexapi/venv/bin/python"
      package: "plexapi"
  qflix-missing-search:
    class: cron
    unit: qflix-missing-search.service
    kuma_monitor: "Qflix Missing Search"
    health:
      kind: systemd_oneshot
      unit: qflix-missing-search.service


canaries:
  movie:
    kuma_monitor: "Canary Movie"
    script: "scripts/canaries/movie.sh"
    schedule: "hourly"
  anime:
    kuma_monitor: "Canary Anime"
    script: "scripts/canaries/anime.sh"
    schedule: "hourly"
  deletion:
    kuma_monitor: "Canary Deletion"
    script: "scripts/canaries/deletion.sh"
    schedule: "daily-0430"
  mobile-ux:
    kuma_monitor: "Canary Mobile-UX"
    script: "scripts/canaries/mobile-ux.sh"
    schedule: "every-15min"

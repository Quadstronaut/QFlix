defaults:
  health_timeout_s: 5
  recovery_attempts: 3
  recovery_backoff_s: [10, 30, 60]
  lifecycle_timeout_s: 60
  kuma_recheck_delay_s: 90

# Monitors in our shared Kuma instance that belong to other operator-owned
# projects. They count toward live_count but never toward drift, and the
# smoke test excludes them from the all-up count.
kuma_external_monitors:
  # Quadstronix / Quadstronix Node 1 / Quadstronix Node 2 were REMOVED from Kuma
  # by the operator 2026-07-16 (both node DNS names had gone stale — resolved to
  # the same unreachable IP, 100% packet loss). Dropped from this list 2026-07-18
  # to match live reality (the 2026-07-16 doc sync updated inventory.md's prose
  # but missed this manifest list, leaving test_doc_counts red since then).
  #
  # "QFlix Collect (workstation)" MOVED OUT 2026-07-29: it migrated off the
  # Windows scheduled task onto the box itself 2026-07-09 (qflix-collect.py +
  # qflix-collect.timer, self-pushing via KUMA_PUSH_KEY — see memory
  # collect-migrated-to-box). It is no longer an unauditable external app; it
  # now lives in lib.kuma.STANDALONE_SELF_PUSH_MONITORS alongside the other
  # self-pushing janitors so drift audit + bootstrap cover it. See that dict
  # for why the monitor's literal (now cosmetically stale) name is kept.

apps:

  # --- UCC apps (managed by Ultra.cc app-<slug> commands) ---

  sonarr:
    class: ucc
    ucc_slug: sonarr
    kuma_monitor: "Sonarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: sonarr.key
      port_secret: sonarr.port
      urlbase_secret: sonarr.urlbase
      expect_status: 200

  sonarr2:
    class: ucc
    ucc_slug: sonarr2
    kuma_monitor: "Sonarr Anime"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: sonarr2.key
      port_secret: sonarr2.port
      urlbase_secret: sonarr2.urlbase
      expect_status: 200

  radarr:
    class: ucc
    ucc_slug: radarr
    kuma_monitor: "Radarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: radarr.key
      port_secret: radarr.port
      urlbase_secret: radarr.urlbase
      expect_status: 200

  radarr2:
    class: ucc
    ucc_slug: radarr2
    kuma_monitor: "Radarr 2"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: radarr2.key
      port_secret: radarr2.port
      urlbase_secret: radarr2.urlbase
      expect_status: 200

  prowlarr:
    class: ucc
    ucc_slug: prowlarr
    kuma_monitor: "Prowlarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v1/system/status"
      auth_header: "X-Api-Key"
      auth_secret: prowlarr.key
      port_secret: prowlarr.port
      urlbase_secret: prowlarr.urlbase
      expect_status: 200

  bazarr:
    class: ucc
    ucc_slug: bazarr
    kuma_monitor: "Bazarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/system/status"
      auth_header: "X-Api-Key"
      auth_secret: bazarr.key
      port_secret: bazarr.port
      urlbase_secret: bazarr.urlbase
      expect_status: 200

  bazarr2:
    # Second Bazarr instance for the anime *arr pair (Sonarr2 + Radarr2).
    # Bazarr's hardcoded one-Sonarr/one-Radarr limit forces this. Ultra.cc
    # has no `app-bazarr2`, so it's a bare-Python install under
    # ~/.apps/bazarr2/ managed by a user systemd unit.
    class: systemd
    unit: bazarr2.service
    kuma_monitor: "Bazarr 2"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/system/status"
      auth_header: "X-Api-Key"
      auth_secret: bazarr2.key
      port_secret: bazarr2.port
      urlbase_secret: bazarr2.urlbase
      expect_status: 200

  qbittorrent:
    class: ucc
    ucc_slug: qbittorrent
    kuma_monitor: "qBittorrent"
    # qBit binds its WebUI (port 17041) exactly ONCE at startup and never
    # retries; a boot-time port squatter can make it lose that race and run
    # WebUI-less (2026-07-08 incident, see memory qbit-webui-boot-bind-race).
    # Widen this app's recovery backoff so the 3-attempt loop spans the boot-
    # settle window and its `restart` catches the freed port on the FIRST
    # outage — instead of exhausting attempts while the port is still contended
    # and falling back on the permanent-failure re-arm (~15min). Mirrors the
    # victorialogs slow-boot fix. (lib/recovery.py reads raw before defaults.)
    recovery_backoff_s: [30, 90, 180]
    health:
      kind: http_root
      port_secret: qbittorrent.port
      expect_status: 200

  plex:
    # Plex is the canonical media server (per project_plex-primary-jellyfin-trial).
    # /identity returns 200 + a MediaContainer XML without auth — perfect liveness probe.
    class: ucc
    ucc_slug: plex
    kuma_monitor: "Plex"
    health:
      kind: http_root
      port_secret: plex.port
      path_override: "/identity"
      expect_status: 200

  seerr:
    class: ucc
    ucc_slug: seerr
    kuma_monitor: "Seerr"
    health:
      kind: http_api
      path_template: "/api/v1/status"
      auth_header: "X-Api-Key"
      auth_secret: seerr.key
      port_secret: seerr.port
      expect_status: 200

  tautulli:
    class: ucc
    ucc_slug: tautulli
    kuma_monitor: "Tautulli"
    health:
      kind: http_root
      port_secret: tautulli.port
      expect_status: 200

  audiobookshelf:
    class: ucc
    ucc_slug: audiobookshelf
    kuma_monitor: "Audiobookshelf"
    health:
      kind: http_root
      port_secret: audiobookshelf.port
      path_override: "/healthcheck"
      expect_status: 200

  kavita:
    class: ucc
    ucc_slug: kavita
    kuma_monitor: "Kavita"
    health:
      kind: http_api
      path_template: "/api/health"
      auth_header: "Authorization"
      auth_secret: kavita.key
      port_secret: kavita.port
      expect_status: 200

  komga:
    class: ucc
    ucc_slug: komga
    kuma_monitor: "Komga"
    health:
      kind: http_root
      port_secret: komga.port
      path_override: "/komga/"
      expect_status: 200

  calibre-web:
    class: ucc
    ucc_slug: calibre-web
    kuma_monitor: "Calibre-Web"
    health:
      kind: http_root
      port_secret: calibre-web.port
      expect_status: 200

  # homarr: DECOMMISSIONED 2026-07-13 — fully uninstalled (app-homarr +
  # app-homarr-upstream), replaced as the public root by qflix-dash on
  # 2026-06-27. Kept limping as a "QFlix has moved" notice board until it
  # started a 31-alert restart-storm (auto-heal exhausted 3 restarts, paged on
  # every permanent-failure re-arm). Removed from manifest + Kuma monitor #39
  # deleted + both UCC slots uninstalled + homarr.{host,port} secrets purged.
  # Retired scripts: scripts/configure/{34-nginx-root-to-homarr.sh,
  # 35-homarr-seed-boards.py,46-homarr-add-comms.py,61-homarr-qflix-theme.py},
  # scripts/qflix-dash/homarr-moved-notice.py. The old homarr-upstream-<host>
  # subdomain is now dead (uninstall kills the outer-nginx route — expected).

  qflix-dash:
    class: systemd
    unit: qflix-dash.service
    kuma_monitor: "QFlix Dashboard"
    # SvelteKit board that replaced Homarr at the public root 2026-06-27.
    # adapter-node on loopback; NODE_OPTIONS=--disable-wasm-trap-handler required
    # (see node-ultracc-wasm-fix). /healthz is a plain 200 liveness route.
    health:
      kind: http_root
      port_secret: qflix-dash.port
      path_override: /healthz
      expect_status: 200

  flaresolverr:
    # Binds only on the Docker bridge gateway (172.17.0.1:17011), not host
    # loopback — hostname override below routes the probe accordingly.
    class: ucc
    ucc_slug: flaresolverr
    kuma_monitor: "FlareSolverr"
    health:
      kind: http_root
      hostname: "172.17.0.1"
      port_secret: flaresolverr.port
      expect_status: 200

  sabnzbd:
    # Usenet download client (added 2026-06-22 usenet buildout). Binds host
    # loopback 127.0.0.1:17007 and serves its UI under urlbase /sabnzbd/. The
    # http_root probe follows redirects, so the /sabnzbd/ -> form-login redirect
    # resolves to a FINAL 200 (SAB uses a form login, not HTTP 401), making
    # expect_status: 200 a deterministic up-signal. Root "/" would risk a 404
    # against the urlbase. No sabnzbd.key secret exists, so this is an
    # unauthenticated liveness probe — deliberately no auth_header/auth_secret.
    class: ucc
    ucc_slug: sabnzbd
    kuma_monitor: "SABnzbd"
    health:
      kind: http_root
      port_secret: sabnzbd.port
      path_override: "/sabnzbd/"
      expect_status: 200

  # maintainerr: DECOMMISSIONED 2026-06-20 — its Plex autodelete was unfixable
  # (docs/maintainerr-plex-id-resolution-bug.md); replaced by scripts/maint/
  # qflix-reaper.py (self-pushes the "QFlix Reaper" Kuma monitor). App stopped,
  # its 3 Kuma monitors deleted, the deletion + rule-sanity canaries retired.

  unpackerr:
    # Auto-extracts completed archives from qBittorrent for the *arr stack.
    # Runs as a Docker-wrapped UCC app. No HTTP surface and no user systemd
    # unit; liveness is a host-visible process check (smoke-test.sh section 8).
    # NOTE (2026-05-25): after the Ultra.cc May-2026 server migration the app
    # was reinstalled onto the upstream golift image, whose entrypoint binary
    # is `/unpackerr` (bare) — NOT the old Ultra.cc `/app/unpackerr` path. The
    # probe pattern `/unpackerr` matches both layouts (the old path ends in it),
    # so it survives a future image swap either way. The pusher pushes UP/DOWN
    # to Kuma monitor "Unpackerr" every 60s.
    class: ucc
    ucc_slug: unpackerr
    kuma_monitor: "Unpackerr"
    health:
      kind: process_pattern
      pattern: "/unpackerr"

  # --- systemd apps (managed by systemctl --user) ---

  postgres:
    # Database backend for Listmonk. UCC runs Postgres under supervisord;
    # process_pattern matches the checkpointer subprocess (only present when
    # Postgres is healthy and accepting writes).
    class: ucc
    ucc_slug: postgres
    kuma_monitor: "Postgres"
    health:
      kind: process_pattern
      pattern: "postgres: checkpointer"


  listmonk:
    class: systemd
    unit: listmonk.service
    kuma_monitor: "Listmonk"
    health:
      kind: http_root
      port_secret: listmonk.port
      expect_status: 200
    upgrade:
      kind: tarball_swap
      url_template: "https://github.com/knadh/listmonk/releases/download/v{version}/listmonk_v{version}_linux_amd64.tar.gz"
      target_path: "~/.apps/listmonk/bin/listmonk"
      post_steps:
        - "~/.apps/listmonk/bin/listmonk --install --idempotent --yes"

  tdarr-server:
    class: systemd
    unit: tdarr-server.service
    kuma_monitor: "Tdarr"
    health:
      kind: http_api
      path_template: "/api/v2/status"
      port_source: "json_file:~/.apps/tdarr/configs/Tdarr_Server_Config.json:serverPort"
      expect_status: 200
    upgrade:
      kind: zip_swap
      url_template: "https://storage.tdarr.io/versions/{version}/linux_x64/Tdarr_Server.zip"
      target_dir: "~/.apps/tdarr/Tdarr_Server"
      version_pin:
        source: versions.env
        key: TDARR_VERSION
        max: "2.17.01"
        max_reason: "GLIBC 2.34 required, host has 2.31"

  tdarr-node:
    class: systemd
    unit: tdarr-node.service
    kuma_monitor: "Tdarr Node"
    # Fair-use quiet hours: tdarr-node-pause.timer STOPS this unit 18:00-23:00
    # UTC (scripts/configure/50c-tdarr-quiet-hours.sh). Declaring the window
    # here tells the pusher the unit is intentionally down — it pushes UP
    # (Kuma green, "[paused…]") and skips probe + auto-heal instead of reviving
    # it ~2min into the pause every day (the false-recovery bug, 2026-06-12).
    # Keep in sync with 50c's OnCalendar AND heartbeat-tdarr-node.sh's guard.
    pause_window:
      start_hour_utc: 18
      end_hour_utc: 23
    health:
      kind: systemd_only
      expect: active
    upgrade:
      kind: zip_swap
      url_template: "https://storage.tdarr.io/versions/{version}/linux_x64/Tdarr_Node.zip"
      target_dir: "~/.apps/tdarr/Tdarr_Node"
      version_pin:
        source: versions.env
        key: TDARR_VERSION
        max: "2.17.01"
        max_reason: "GLIBC 2.34 required, host has 2.31"

  # --- cron apps (timer-driven, no lifecycle start/stop) ---

  recyclarr:
    class: cron
    # unit is the .service (not the .timer) so health probe reads the last
    # invocation's Result via systemd_oneshot. The .timer remains the scheduler.
    unit: recyclarr.service
    kuma_monitor: "Recyclarr"
    health:
      kind: systemd_oneshot
    upgrade:
      kind: tarball_swap
      url_template: "https://github.com/recyclarr/recyclarr/releases/download/{version}/recyclarr-linux-x64.tar.xz"
      target_path: "~/.apps/recyclarr/bin/recyclarr"

  qflix-newsletter:
    # Weekly Plex digest. Triggered by qflix-newsletter.timer (Mon 08:00),
    # which fires the qflix-newsletter.service oneshot. Replaces Conjurr +
    # Newsletterr (retired 2026-05-10). Source lives in scripts/qflix-newsletter/.
    class: cron
    unit: qflix-newsletter.service
    kuma_monitor: "Qflix Newsletter"
    health:
      kind: systemd_oneshot

  buildarr:
    # Manages all 4 *arr instances (sonarr, sonarr2, radarr, radarr2) via
    # declarative YAML, fired by buildarr.timer Mon-Sun 04:30. Probe is
    # systemd_oneshot — reads the .service ExecMainStatus, so a buildarr
    # failure surfaces in Kuma/Discord immediately rather than being masked
    # by the timer's perpetual "active" state.
    #
    # buildarr-sonarr 0.6.4 + buildarr-radarr 0.2.6 are not natively compatible
    # with Sonarr v4 / Radarr v6 — see scripts/configure/60-buildarr-patches.sh
    # and scripts/patches/buildarr-*.patch for the 7 in-venv edits that bridge
    # the gap. When upstream catches up the operator can `pip install -U
    # buildarr buildarr-sonarr buildarr-radarr` and retire the patches (the
    # script's header documents the removal path).
    class: cron
    unit: buildarr.service
    kuma_monitor: "Buildarr"
    health:
      kind: systemd_oneshot

  upgradinatorr:
    # Re-searches stale *arr grabs across sonarr/sonarr2/radarr/radarr2.
    # Runs weekly Sun 06:04 via upgradinatorr.timer. ExecStart fans out per app.
    class: cron
    unit: upgradinatorr.service
    kuma_monitor: "Upgradinatorr"
    health:
      kind: systemd_oneshot

  bazarr2-sync:
    # Hourly drift check: pin bazarr2's running version to bazarr-1's by
    # fetching the matching morpheus65535/bazarr tag, re-applying the
    # waitress threads=100→4 patch, refreshing deps, and restarting
    # bazarr2.service. systemd_oneshot probes the .service's Result so a
    # sync failure surfaces in Kuma/Discord even though the .timer stays
    # green between fires.
    class: cron
    unit: bazarr2-sync.service
    kuma_monitor: "Bazarr 2 Sync"
    health:
      kind: systemd_oneshot

  kometa:
    class: cron
    unit: kometa.service
    kuma_monitor: "Kometa"
    health:
      kind: systemd_oneshot
    upgrade:
      kind: git_checkout
      repo_path: "~/.apps/kometa/repo"
      post_steps:
        - "cd ~/.apps/kometa/repo && .venv/bin/pip install -r requirements.txt"

  # --- library apps (no service, no lifecycle) ---

  python-plexapi:
    class: library
    unit: null
    kuma_monitor: "PlexAPI"
    health:
      kind: import_check
      venv_python: "~/.apps/python-plexapi/venv/bin/python"
      module: "plexapi"
    upgrade:
      kind: pip_install
      venv_python: "~/.apps/python-plexapi/venv/bin/python"
      package: "plexapi"
  qflix-missing-search:
    class: cron
    unit: qflix-missing-search.service
    kuma_monitor: "Qflix Missing Search"
    health:
      kind: systemd_oneshot
      unit: qflix-missing-search.service

  qflix-quality-fallback:
    # Two-stage quality loosening for movies stuck in the missing sweep
    # (day 5 -> HDTV tier, day 10 -> SD retail, day 15 -> park + alert).
    # TV is park-only in v2 (day-15 unmonitor; no loosen — Sonarr profiles are
    # per-series). Daily 07:30 UTC, 30 min after qflix-missing-search.
    class: cron
    unit: qflix-quality-fallback.service
    kuma_monitor: "Qflix Quality Fallback"
    health:
      kind: systemd_oneshot
      unit: qflix-quality-fallback.service

  qflix-specials-policy:
    # Standalone Season-0 specials janitor: keeps S00 unmonitored across
    # sonarr/sonarr2 (specials rarely have standalone releases -> perpetual
    # false-missing that burns indexer queries + alert noise). Deliberately NOT
    # folded into qflix-quality-fallback — own module/timer/monitor so it stays
    # compartmentalized + independently tunable as QFlix migrates to larger
    # servers (spec 2026-07-18-tv-fallback-v2-design.md). Daily 06:00 UTC, ahead
    # of the 07:00 missing sweep so specials are unmonitored before any search
    # wastes queries on them.
    class: cron
    unit: qflix-specials-policy.service
    kuma_monitor: "Qflix Specials Policy"
    health:
      kind: systemd_oneshot
      unit: qflix-specials-policy.service

  victorialogs:
    # Log aggregator. Single static Go binary (VictoriaLogs), on-disk index
    # at ~/.apps/vlogs/data with 90d retention. Bound loopback-only on the
    # port stored in secrets/vlogs.port. Migrated from workstation to seedbox
    # 2026-05-14 because workstation-resident ingest violated the autonomy
    # mandate (logs went un-captured whenever the PC was off).
    class: systemd
    unit: victorialogs.service
    kuma_monitor: "VictoriaLogs"
    # Opening 86 daily partitions on the contended shared disk takes ~48s on a
    # clean boot and >150s after unclean-shutdown debris cleanup — past the
    # default [10,30,60]s probe window (~100s), which would false-fire
    # "could not be started after 3 attempts". Widen this app's recovery
    # backoff so the loop waits long enough to see the boot complete.
    # (2026-06-26 incident follow-up; lib/recovery.py reads raw before defaults.)
    recovery_backoff_s: [30, 90, 180]
    health:
      kind: http_root
      port_secret: vlogs.port
      path_override: "/health"
      expect_status: 200

  qflix-vlogs-ingest:
    # Timer-driven oneshot that pulls all managed app logs into vlogs every
    # 5 min. Imports scripts/mcp/logs.py in-process and POSTs JSON-line
    # batches to local 127.0.0.1:<vlogs.port>/insert/jsonline.
    class: cron
    unit: qflix-vlogs-ingest.service
    kuma_monitor: "Qflix VLogs Ingest"
    health:
      kind: systemd_oneshot


canaries:
  movie:
    kuma_monitor: "Canary Movie"
    script: "scripts/canaries/movie.sh"
    schedule: "hourly"
  anime:
    kuma_monitor: "Canary Anime"
    script: "scripts/canaries/anime.sh"
    schedule: "hourly"
  # deletion: RETIRED 2026-06-20 with Maintainerr (verified its 60-day rules).
  # qflix-reaper has its own observability; Maintainerr no longer runs.
  mobile-ux:
    kuma_monitor: "Canary Mobile-UX"
    script: "scripts/canaries/mobile-ux.sh"
    schedule: "every-15min"
  vlogs-stall:
    # Detect VictoriaLogs server down or zero-ingest-in-15-min (timer broken).
    # Mirror of qbit-stall pattern — exits 0 on flowing, exits 1 on stall.
    kuma_monitor: "Canary VLogs Stall"
    script: "scripts/canaries/vlogs-stall.sh"
    schedule: "every-15min"
  qbit-stall:
    # Detect a wedged libtorrent engine (dl_info_speed=0 for ≥5min while
    # queuedDL > N). qBit's WebAPI stays responsive even when the engine
    # deadlocks under heavy queue churn — only fix discovered is a
    # systemctl --user restart qbittorrent.service. Same 15-min cadence
    # as vlogs-stall so a stall is detected within ~15min of the script's
    # internal 5-min threshold elapsing.
    kuma_monitor: "Canary qBit Stall"
    script: "scripts/canaries/qbit-stall.sh"
    schedule: "every-15min"
  sab-stall:
    # Usenet twin of qbit-stall (gap closed 2026-07-19): SABnzbd's process +
    # web UI stay up (app monitor green) while every queued job sits at
    # 0 KB/s — expired Frugal block account, dead server creds, provider
    # outage. Fires when queue speed ~0 for ≥10min with active slots
    # waiting, or when a slot-level Paused job is pinned ≥24h (wedged SAB
    # queue object — the 2026-07-19 class; queue-level paused is NOT a
    # stall, the status doc already warns on that).
    kuma_monitor: "Canary SAB Stall"
    script: "scripts/canaries/sab-stall.sh"
    schedule: "every-15min"
  kometa-libraries:
    # Config-drift detector: every kometa-configured library must exist on
    # the live Plex server. Catches the May-2026 incident class where Plex
    # libraries were renamed (Pirate Movies → QFlix - Movies) and kometa
    # silently failed every run until next operator review.
    kuma_monitor: "Canary Kometa Libraries"
    script: "scripts/canaries/kometa-libraries.sh"
    schedule: "hourly"
  stale-log-watchdog:
    # Detects timer-driven apps whose log file has stopped advancing past
    # the expected cadence (kometa daily, recyclarr weekly, buildarr
    # daily). Complements qflix-vlogs-ingest's dormant-skip: the ingester
    # quietly drops dormant logs from the index; this canary loudly fails
    # when a log is dormant LONGER than its schedule allows — the exact
    # failure mode that hid the recyclarr v8 migration bug behind 6 days
    # of stale errors.
    kuma_monitor: "Canary Stale-Log Watchdog"
    script: "scripts/canaries/stale-log-watchdog.sh"
    schedule: "hourly"
  kometa-deploy-drift:
    # Detects drift between the deployed kometa config.yml and what the
    # install script (scripts/configure/55-kometa-install.sh) would
    # render. Catches operator hand-edits and install-script-vs-deployed
    # divergence. Complements kometa-libraries (semantic Plex check) on
    # the textual install-script side.
    kuma_monitor: "Canary Kometa Deploy-Drift"
    script: "scripts/canaries/kometa-deploy-drift.sh"
    schedule: "daily-0430"
  prowlarr-indexer-health:
    # Detects two recurring patterns surfaced by the 2026-05-09 and
    # 2026-05-16 audits that nothing previously alerted on:
    #   - prowlarr-429-cascade : >threshold (default 25) HTTP 429s from
    #     the *arr stack in a 20-min window — single upstream indexer
    #     disable rippling across sonarr/sonarr2/radarr/radarr2
    #   - indexer-rss-stale : Prowlarr health endpoint reports chronic
    #     indexer-down warnings (matches the nekoBT-since-2026-05-12
    #     case from WARN.md)
    # Detect-and-notify only. The FlareSolverr canary already handles
    # listener-failure restarts upstream of this.
    #
    # WINDOW RETUNED 10m -> 20m ON 2026-08-03. The timer is OnCalendar=*:0/15
    # with RandomizedDelaySec=60, so consecutive runs land up to 17m apart and a
    # 10m lookback left >=5 minutes of every cycle unobserved. On 2026-08-02 the
    # Knaben 403->500->backoff->429 chain produced 10-minute buckets of
    # 234/177/126/108/86/79 lines and this canary stayed exit 0 through all of
    # them. The count is LOG LINES, not events: one failed grab emits ~10
    # matching stack-trace records, so 25 is ~2-3 real failures. Both numbers are
    # pinned against this file and the real timer by
    # tests/unit/test_prowlarr_indexer_health_tuning.py, which exists because
    # the threshold previously read 25 here and in the script header while the
    # code said 40 — the two-policy-surface defect, three surfaces deep.
    #
    # NOT IN SCOPE HERE, deliberately: both probes are LOG- and HEALTH-derived,
    # and Prowlarr /api/v1/health is [] for config faults. Indexer-sync
    # integrity and the broken proxy download path are the prowlarr-app-sync
    # canary's concern, per the compartmentalize design law.
    kuma_monitor: "Canary Prowlarr Indexer Health"
    script: "scripts/canaries/prowlarr-indexer-health.sh"
    schedule: "every-15min"
  prowlarr-app-sync:
    # Config-drift detector for the Prowlarr -> *arr handoff. Both probes are
    # invisible to prowlarr-indexer-health.sh above, and NOT because it is
    # mistuned — because Prowlarr's /api/v1/health is `[]` for both faults, so
    # its numerator is structurally zero. A permanent, deterministic,
    # operator-fixable fault must not sit behind a burst threshold that is green
    # 99% of the time; that is exactly how fault (a) below hid for ten weeks.
    #   - prowlarr-appsync-missing : an indexer Prowlarr INTENDS to sync
    #     (enabled + tag-intersect + category-intersect) is absent from that
    #     *arr. LimeTorrents has been missing from Radarr since at least
    #     2026-05-22 — Prowlarr re-POSTs it every 6 h, Radarr's add-time RSS
    #     validation returns 400 because the bundled `limetorrents` Cardigann
    #     definition maps every /latest100 row to 8000/5000 and none to 2000,
    #     and Prowlarr gives up. Radarr /health was [] the whole time.
    #   - prowlarr-appsync-magnet-pref-off : a diagnosed indexer (Knaben, Tokyo
    #     Toshokan) still has preferMagnetUrl=false, so the *arr prefers a proxy
    #     downloadUrl that 403s -> 500 -> Prowlarr's own 15-min failure backoff
    #     -> 429 -> Radarr logs "API Grab Limit reached" (a mislabel: no grab
    #     limit is configured anywhere) and the grab silently fails.
    # Every intentional exclusion is COUNTED and NAMED (skip_disabled /
    # skip_notag / skip_nocat / orphan) so a regression shows up as a MOVE
    # between buckets rather than an absence.
    # Detect-and-notify only; the fix is a Prowlarr UI checkbox. Runbook:
    # docs/prowlarr-indexer-remediation-2026-08-03.md.
    # EXPECT IT RED ON ARRIVAL until step 1 of that runbook is applied — that is
    # the acceptance test for the remediation, not a canary bug.
    kuma_monitor: "Canary Prowlarr App Sync"
    script: "scripts/canaries/prowlarr-app-sync.sh"
    schedule: "hourly"
  hardlink-integrity:
    # Sample the 20 most-recently-modified video files across Movies + TV
    # Shows + Anime and assert linkcount >= 2 (= the *arr import used
    # hardlink mode, the qBit seed is still referenceable).
    #
    # Detects: "Use Hard Links" config flipped off in a *arr, filesystem
    # boundary changes (e.g. mount layout drift), or copy-mode regression.
    # A break here doubles storage on every new grab — invisible in *arr
    # and Plex logs until disk fills weeks later.
    #
    # Wider net than smoke #5 (5 Movies samples) and runs every 30 min.
    kuma_monitor: "Canary Hardlink Integrity"
    script: "scripts/canaries/hardlink-integrity.sh"
    schedule: "every-30min"
  plex-transcoder:
    # Every 10 min, exercise Plex's /transcode/sessions and /:/prefs
    # endpoints. Catches transcoder daemon stalls before customers hit
    # "Conversion failed" — main /identity stays 200 OK during this
    # fault, so the existing Plex monitor would stay green for hours
    # while every playback that needs a transcode (60% of recent
    # sessions per Tautulli) silently buffers or dies.
    kuma_monitor: "Canary Plex Transcoder"
    script: "scripts/canaries/plex-transcoder.sh"
    schedule: "every-10min"
  newsletter-digest:
    # Detects a stale/absent "Behind the scenes" digest blurb at Monday
    # send time — exactly the silent-fallback condition
    # changelog.py's fetch_override()/_is_fresh() degrade through without
    # ever raising (INFO-only log, always falls back to the deterministic
    # commit recap). Nothing watched the newsletter-digest branch before
    # this canary; the 2026-07-06 miss (routine fired per last_fired_at,
    # produced no commit) went unnoticed until manually checked.
    #
    # The qflix-digest cloud routine (trig_01ARibSXarcy5ddQdDXiV3Dp) is
    # DESIGNED to publish something every Monday 14:00 UTC (even a brief
    # "quiet week" blurb per its SKILL.md) — so a missing/stale blurb at
    # send time is a real failure worth surfacing, per operator intent.
    #
    # Freshness is enforced ONLY inside the Monday 14:15-24:00 UTC send
    # window (script-internal gate; QFLIX_DIGEST_CANARY_FORCE_WINDOW=1
    # overrides for tests) so the newsletter's own _is_fresh() +4.0-day
    # upper bound — which makes a correctly-published Monday blurb read
    # STALE by the following weekend — never produces a false alarm.
    # schedule "weekly-mon-send" pairs with cli.py's
    # _CANARY_INTERVAL_MIN["weekly-mon-send"]=10080 so `status --json`
    # doesn't mislabel the between-Mondays idle period as stale.
    kuma_monitor: "Canary Newsletter Digest"
    script: "scripts/canaries/newsletter-digest-stale.sh"
    schedule: "weekly-mon-send"
  # maintainerr-rule-sanity: RETIRED 2026-06-20 with Maintainerr. It guarded
  # against Maintainerr rule corruption (threshold/keepFor=0 mass-delete); with
  # Maintainerr gone the risk is gone. qflix-reaper's own safety caps (max-items
  # / max-pct, abort-before-mutation) are the equivalent runaway guard.
  quota:
    # Ultra.cc per-user disk quota with autonomous reclaim. Three levels:
    #   80% WARN     → annotate Kuma msg; stay UP
    #   90% CRITICAL → fire `python3 ~/scripts/maint/qflix-reaper.py --execute
    #                  --json` autonomously (Maintainerr was decommissioned
    #                  2026-06-26 — see scripts/canaries/quota.sh:73; the
    #                  reaper's own max-items/max-pct caps + run-lock are the
    #                  safety envelope) and push DOWN
    #   98% FAIL     → operator intervention; DOWN with explicit msg
    # The 2026-05-21 incident took ~30+ minutes of operator triage to
    # diagnose quota exhaustion masked as "apps won't load"; this canary
    # turns that into a known failure mode with a 15-min detection window.
    kuma_monitor: "Canary Quota"
    script: "scripts/canaries/quota.sh"
    schedule: "every-15min"
  tautulli-plex-link:
    # Assert the Plex address Tautulli is CONFIGURED to use is a live Plex,
    # not just that Tautulli's own web port answers. Closes the gap behind the
    # 2026-05-20 incident: the UCC kernel migration re-IP'd Plex, Tautulli's
    # pinned pms_url broke, and it stormed `Connection refused` for 3 days while
    # its web port stayed green — so the app monitor never alerted. Probes
    # Tautulli's configured pms_ip:port for /identity; fails within ~15min if
    # Tautulli is pointed at a dead/old address. Pairs with the durable gateway
    # pin in scripts/configure/50-tautulli-pms-url-fix.sh.
    kuma_monitor: "Canary Tautulli-Plex Link"
    script: "scripts/canaries/tautulli-plex-link.sh"
    schedule: "every-15min"
  thread-ceiling:
    # Track the user's task count (processes + threads) against RLIMIT_NPROC
    # (ulimit -u = 2000 on this shared box). A Go app defaulting GOMAXPROCS to
    # the host's 128 cores spawns hundreds of threads and can hit
    # pthread_create EAGAIN near the ceiling — the crash-loop class from the
    # 2026-06-26 VictoriaLogs incident (memory seedbox-thread-cap-gomaxprocs).
    # Invisible until an app dies, so watch the headroom: 70% WARN (annotate,
    # stay up), 85% FAIL (down — a runaway producer needs a GOMAXPROCS cap or
    # restart; an autonomous kill is unsafe). Baseline at the 2026-07-27 audit
    # that added this canary was ~1026/2000 (51%).
    kuma_monitor: "Canary Thread Ceiling"
    script: "scripts/canaries/thread-ceiling.sh"
    schedule: "every-15min"
  tdarr-scanner:
    # Tdarr logs four scanner self-tests at server start (FFprobe, Exiftool,
    # Mediainfo, CCExtractor). Mediainfo has been dead for as long as the logs
    # go back — WebAssembly OOM, 858 hits across 2026-07-24..28 — and REA never
    # surfaced it because the tdarr source tailed .err files that are ~90%
    # express stack-trace noise. Both halves fixed 2026-07-28; this is the
    # durable half.
    #
    # Mediainfo is UNFIXABLE at our layer (verified, do not retry — full
    # reasoning in the script header): the slot's ulimit -v 10GB cannot host
    # Node's ~8GB wasm trap-guard reservation, and the documented cure
    # NODE_OPTIONS=--disable-wasm-trap-handler is rejected outright by Tdarr's
    # bundled Node 18 runtime ("not allowed in NODE_OPTIONS") — deploying it
    # crash-looped tdarr-server and was rolled back. Impact is bounded: FFprobe
    # and Exiftool carry the pipeline and scans complete normally.
    #
    # So this canary reds only on REGRESSION — FFprobe or Exiftool going down
    # (pipeline-blocking) or the server not running. The known-down pair stays
    # green-with-WARN rather than parking a permanent red over an accepted
    # condition, which is the exact noise the 2026-07-28 REA work removed. If
    # Mediainfo ever recovers it says so and asks to be dropped from the
    # baseline, so a later relapse reds properly. Hourly: the self-test only
    # re-runs on restart, so this state cannot change faster than that.
    kuma_monitor: "Canary Tdarr Scanner"
    script: "scripts/canaries/tdarr-scanner.sh"
    schedule: "hourly"
  tdarr-healthcheck:
    # Tdarr's health-check pipeline was 100% dead from 2026-05-21 to 2026-07-28:
    # 2,866 failures over 54 days, 0 successes ever, healthCheckScore 0.000 —
    # and nothing alerted for 68 days. The libraries carried Tdarr's stock
    # handbrakescan=true, so every check spawned `HandBrakeCLI --scan`, and
    # HandBrakeCLI does not exist on this rootless slot (spawn ENOENT).
    #
    # It hid because the failure is ORTHOGONAL to transcoding: transcodes use the
    # bundled ffmpeg-static and were succeeding throughout (1,168 successes over
    # the same window), so units, dashboard, Kuma and the scanner canary all read
    # healthy. Nothing watched the one number that was wrong. Fixed by switching
    # every library to ffmpegscan; this canary is the durable half.
    #
    # Two predicates so a ratio (lagging) is not the only guard:
    #   engine sanity — resolve the configured engine's binary per library;
    #     a missing binary or no engine at all FAILs on the first tick, before
    #     a single file is mis-verdicted. This is the exact 2026-05-21 bug.
    #   error ratio  — of COMPLETED checks, 20% WARN / 50% FAIL, judged only
    #     after 20 completed so a fresh library can't trip on noise.
    # Stays UP (indeterminate, not a fault) when tdarr-server is down — the
    # tdarr-scanner canary owns that red and two reds for one cause is noise.
    kuma_monitor: "Canary Tdarr Healthcheck"
    script: "scripts/canaries/tdarr-healthcheck.sh"
    schedule: "hourly"
  ucc-gate-stuck:
    # Watch the UCC maintenance-gate DETECTOR, not the apps it gates.
    #
    # lib/ucc.py detect() has a probe-error branch that holds the prior
    # `active` flag and only increments consecutive_error. Before the
    # 2026-07-29 fix that counter had NO upper bound, and a live instance was
    # found stuck at consecutive_error=128 (~10.6h at the 5-min detect
    # cadence). lib/suppression.py reads that same frozen flag on EVERY
    # webhook down-event, so a probe that merely could not reach the host had
    # silently disabled auto-recovery for every ucc-class app, fleet-wide,
    # with nothing watching. The fix caps the hold at 3 cycles and fails OPEN.
    #
    # This is the second, independent leg of that fix (design law: every
    # concern gets its own module/timer/check). It does NOT re-test
    # suppression behaviour — it reads ~/.opt/maint/ucc-window.json directly,
    # deliberately not importing lib.ucc, so it keeps working even if a future
    # bug makes that module unimportable or its status() misbehave.
    #
    # Two predicates, both past what the in-code cap already handles:
    #   consecutive_error > 12 (~1h) — the cap stops the SUPPRESSION damage at
    #     15 min, but a probe still erroring an hour later means the detection
    #     pipeline itself is dark (SSH broken, app-manager renamed, misconfigured
    #     secrets/ucc.probe_app). Fail-open fires one Discord edge, not a
    #     repeating page, so nothing else would surface it.
    #   active continuously true >= 6h — defense in depth against a DIFFERENT
    #     bug class (a future regression in the gated/clear branches, which the
    #     probe-error cap does not cover) freezing the gate on. Real UCC
    #     maintenance runs minutes to a few hours; the QFlix-owned window is a
    #     bounded 4h Monday slot.
    # A MISSING state file is NOT a failure: it means no window was ever
    # recorded. Timer liveness is a separate concern and a separate canary.
    kuma_monitor: "Canary UCC Gate Stuck"
    script: "scripts/canaries/ucc-gate-stuck.sh"
    schedule: "every-15min"
  timer-liveness:
    # The GENERIC dead-man for every scheduled job, driven off manifest/jobs.yaml.
    #
    # manifest/jobs.yaml carried four entries adjudicated `open_gap: true` -- a
    # job that can stop with nothing noticing. Their own written reasons say it:
    # manitoba-maint-window ("if BOTH the window and the watchdog fail to start,
    # nothing pages"), manitoba-maint-window-watchdog ("a watcher with no watcher
    # -- THE TURTLE PROBLEM"), manitoba-maint-arr-audit ("a permanently-failing
    # unit is indistinguishable from a clean week") and
    # manitoba-maint-flaresolverr-canary ("the ONLY signal is the absence of
    # Discord messages nobody was expecting anyway").
    #
    # One monitor per gap was the wrong shape: four more monitors, four more push
    # tokens, four more things that can be born mute or born tokenless (both
    # happened on 2026-07-30), and nothing for the NEXT timer somebody adds. This
    # watches liveness generically instead, so a new job is covered the moment it
    # is declared in the ledger.
    #
    # It terminates the turtle chain where it can legitimately end: Kuma. This
    # canary PUSHES, so if it stops, Kuma flips it DOWN on a missed heartbeat --
    # the dead-man dead-mans itself, visibly, on the public status page.
    #
    # Predicates are cadence-INDEPENDENT on purpose. Encoding each timer's
    # interval would copy its OnCalendar into a second policy surface, and two
    # surfaces drifting apart is this repo's recurring defect. systemd already
    # knows the schedule; it is asked about health instead: LOADED (declared but
    # never installed -- sab-stall, tdarr-scanner and tdarr-healthcheck all
    # shipped that way), ACTIVE (will never fire again), NEXT (active but nothing
    # scheduled). A failed last run is reported as a WARN, not a FAIL, because a
    # canary legitimately exits non-zero to report ITS subject down and that is
    # already someone else's monitor.
    kuma_monitor: "Canary Timer Liveness"
    script: "scripts/canaries/timer-liveness.sh"
    schedule: "every-15min"

  deploy-drift:
    # Assert that what RUNS on the box is what is in git.
    #
    # The source audit reads ~/.opt/qflix-src (a checkout). The box runs
    # ~/scripts. Nothing compared them, so every "0 findings" was a claim about
    # source that may or may not resemble the executing code -- council entries
    # 12 and 15. Measured 2026-07-31: 8 deployed files stale, oldest ~3 months,
    # git ahead in every case, plus 2 decommission leftovers still on disk that
    # inventory.md already recorded as "deleted".
    #
    # The one that mattered: post-import/prune-text-libraries.sh runs DAILY at
    # 04:00 from crontab and the deployed copy predated the fix that logs
    # Notifiarr delivery failures -- on the box it still had `|| true`, so an
    # outage on prune day silently dropped the digest. Weeks in git, never
    # deployed. No monitor could have shown this: nothing was down.
    #
    # Deployed-but-absent-from-git is checked too, and is the sharper direction:
    # it is either an unfinished decommission or code running with no source of
    # truth. Files in git but not deployed are NOT flagged (not everything ships).
    #
    # Hourly, not every-15min: it fetches from origin and hashes ~100 files, and
    # drift is a slow failure -- an hour of exposure on a condition that has
    # persisted for months is not the risk worth paying for.
    kuma_monitor: "Canary Deploy Drift"
    script: "scripts/canaries/deploy-drift.sh"
    schedule: "hourly"

  dash-asset-integrity:
    # Assert that the SERVED dashboard shell can actually hydrate - not that
    # the root answers 200.
    #
    # On 2026-07-29 the public dashboard served a DEAD app shell for ~22h with
    # every monitor green. build/ on the box was rewritten at 01:33 and
    # 03:31-03:32; the node process (PID 15178) had been running since
    # 2026-07-08 21:14 and was never restarted. SvelteKit adapter-node serves
    # static assets through sirv, which snapshots its file manifest ONCE at
    # process start, so files created after boot are invisible to it: 6 of the
    # 10 /_app/immutable/* modules the shell referenced returned 404 even
    # though every file was on disk at mode 644 (app.CGGeqWLt.js, 2830 bytes,
    # present -> HTTP 404). sirv also precomputes Content-Length/ETag/
    # Last-Modified at boot, so a file rewritten in place kept advertising its
    # OLD byte count while streaming the new bytes - browsers took
    # net::ERR_CONTENT_LENGTH_MISMATCH on the HTML document itself and
    # navigation never reached domcontentloaded (60s timeout). Net effect: zero
    # hydration. No Support modal, no live refresh, no client-side nav.
    # Warm-cache clients kept working off the stale-but-consistent June-28
    # shell, which is why it looked fine to some people and dead to others.
    #
    # Three things watched this surface and all three were structurally blind:
    #   - qflix-dash's app monitor probes http_root with path_override /healthz
    #     expecting 200 (see the qflix-dash app entry above). The stale
    #     in-memory server answers /healthz forever, so the pusher's probe
    #     never failed, lib/recovery.py trigger_async never ran, and "QFlix
    #     Dashboard" stayed green the whole time.
    #   - scripts/canaries/mobile-ux.sh:29 and scripts/smoke-test.sh:120 only
    #     grep the body for "data-qflix-dash". That marker lives in the
    #     server-RENDERED shell, so it survives a total hydration failure.
    #   - scripts/configure/90-qflix-dash-install.sh shipped the new build over
    #     the live process with `enable --now`, which STARTS a stopped unit but
    #     does NOT restart a running one, then "verified" via /healthz and
    #     /api/status - both answered happily by the stale process, so the
    #     installer reported success while leaving the dead shell serving.
    #     Both of those are fixed in the same change; this canary is the
    #     durable half, because the next stale-manifest cause will not
    #     necessarily be the installer.
    #
    # Two independent predicates, because the two symptoms are separable:
    #   asset resolvability - extract EVERY /_app/immutable/* reference out of
    #     the served HTML and require all of them to return 200. This is the
    #     exact invariant that was violated: an app shell may only reference
    #     assets the RUNNING server can serve. Any 404 is a hard FAIL. Nothing
    #     cheaper implies it - the file being present on disk is precisely what
    #     made this look healthy from every other angle.
    #   content-length agreement - compare the document's advertised
    #     Content-Length against the bytes actually delivered. A SEPARATE
    #     predicate, not implied by the 404 sweep: sirv DID index these paths at
    #     boot, so a file rewritten in place at the same path still returns 200
    #     while advertising a stale length. The 404 leg can be entirely clean
    #     while browsers still refuse to parse the document. Unlike the 404 leg
    #     this one is CORROBORATED by an immediate re-probe before it is
    #     believed: a stale sirv stat tuple lies identically forever, but one
    #     cycling nginx worker also produces a single truncated response, and
    #     restarting a healthy dashboard over wire noise would spend the 24h
    #     self-heal budget on nothing.
    #   body actually delivered - a 200 whose body never arrives at all (headers
    #     then stall) is its own failure bucket, because `received` is never a
    #     number there and it would otherwise satisfy neither predicate and be
    #     silently counted as a healthy probe.
    #
    # Self-heal is narrow on purpose. A 404 whose file EXISTS on disk under
    # ~/.apps/qflix-dash/build/client/ is diagnostic of a stale in-process sirv
    # manifest and of nothing else, and the only repair is
    # `systemctl --user restart qflix-dash`. A 404 whose file is genuinely
    # ABSENT is a broken or partial deploy - a restart cannot help, so that
    # branch alerts and does NOT restart (the same refuse-on-wrong-signature
    # logic as scripts/maint/flaresolverr-canary.py); so does a stalled body.
    # The restart is capped at one per 24h by a durable epoch latch that is
    # RESERVED (written atomically and read back) BEFORE the restart is issued
    # and RELEASED on every path that turns out not to have issued it: if the
    # latch cannot be persisted, the 1-per-24h guarantee does not exist and the
    # restart is refused rather than issued unbounded. It is suppressed inside
    # the Monday 11:00-15:00 UTC maintenance window (lockfile OR wall-clock,
    # both legs, as in qflix-torrent-janitor.py), refused when the unit itself
    # entered active less than two timer ticks ago, and re-fetches afterwards so
    # it never reports a heal it did not verify.
    #
    # Deliberately NOT covered: root reachability and mobile page weight, which
    # mobile-ux owns (one concern per canary, per the compartmentalize design
    # law), and the correctness of the app's DATA. This canary asks only
    # whether the bytes the shell asks for are the bytes the server will hand
    # over.
    kuma_monitor: "Canary Dash Asset Integrity"
    script: "scripts/canaries/dash-asset-integrity.sh"
    schedule: "every-15min"

  plex-unmatched:
    # Plex episodes stuck on a `local://` guid: the scanner created the episode
    # row seconds BEFORE the show/season got its remote agent match, and Plex
    # never revisited the stub. The member sees a correct-but-bare entry — no
    # synopsis, no agent artwork (just a frame-grab thumbnail), no air date.
    #
    # Measured live 2026-08-03: 30 episodes across 2 sections — three COMPLETE
    # first seasons (What We Do in the Shadows S1, Squid Game S1, Monster (2022)
    # S1) plus one stray anime file — the oldest 527 h old. Sibling seasons of
    # the same series matched fine, so this is a per-season race, not a bad
    # filename and not a missing *arr record (Sonarr has all four complete).
    #
    # ZERO prior coverage: `git grep -nE "local://|unmatched|fix.?match|guid"`
    # over scripts/ tests/ manifest/ returned nothing that inspects Plex match
    # state. qflix-reaper's "orphan" is a different concept entirely (a Plex
    # item with no backing *arr record, inside the DELETE path) and would never
    # see these — all 30 have complete Sonarr records.
    #
    # NOT self-healing: all 29 TV items were refreshed 15 days after add and are
    # still local://, and /library/metadata/{rk}/matches returns 0 candidates at
    # episode level. DETECTION ONLY — the sole working remedy is unmatch+rematch
    # at SERIES level, which recreates every episode row and discards
    # ratingKeys, watch state and Tautulli history. That stays an operator
    # decision with a named blast radius, not an automation.
    #
    # Grace window, not a raw count: a genuinely new import is legitimately
    # local:// for the seconds-to-minutes between scan and agent match, so
    # count>0 would flap on every Sonarr import. Alerts on items older than
    # PLEX_UNMATCHED_GRACE_HOURS (default 6) — two orders of magnitude below the
    # 76-527 h the real findings carry. Deliberately NOT a percentage: 1/63 in
    # the Anime library is a whole stuck season and any ratio floor hides it.
    # Sub-grace items are counted and printed, never silently dropped.
    #
    # Hourly: the defect is measured in days and each run pulls ~1 MB per show
    # library (382 episodes in 963 KB / 0.12 s measured), so a tighter cadence
    # buys nothing.
    kuma_monitor: "Canary Plex Unmatched"
    script: "scripts/canaries/plex-unmatched.sh"
    schedule: "hourly"

  rea-liveness:
    # The one QFlix component that does NOT run on the box: qflix-rea.ps1 (the
    # Random Error Audit) lives on the operator workstation, is gitignored, and
    # is therefore invisible even to deploy-drift. Every QFlix audit to date was
    # seedbox-scoped, so REA has NEVER been audited and nothing has ever watched
    # whether it still runs. Measured over its whole life (72 runs,
    # 2026-05-11..2026-08-03): 20 runs — 28% — failed with ZERO notification
    # anywhere (18 all_models_noop, 1 no_secrets, 1 ssh_fail).
    #
    # ASYMMETRY IS THE WHOLE POINT. The judgement runs HERE, on the box, against
    # a heartbeat REA writes over the SSH hop it already makes — so the alarm
    # never depends on REA being well enough to diagnose itself. A Kuma push
    # monitor was the obvious alternative and loses for exactly that reason: to
    # distinguish "ran and audited" from "ran, exited 0, audited nothing" REA
    # would have to WITHHOLD its own push, i.e. be healthy enough to correctly
    # report itself unhealthy. All 20 silent failures above would have been
    # GREEN under a push monitor.
    #
    # DEPLOY ORDERING IS LOAD-BEARING. Until the operator lands the writer half
    # in qflix-rea.ps1 (a two-line addition to the bash heredoc REA already
    # sends — see the script header and the track handoff), this canary exits 2
    # with STAGE=rea-heartbeat-absent, msg
    # "writer-not-wired-nothing-is-watching-rea". That is the TRUTH, loudly:
    # nothing watches REA today. It is NOT the 2026-07-29 class of a monitor
    # created with nothing pushing to it — the timer fires and pushes an
    # accurate, actionable reason every hour. Preferably land the writer first
    # and deploy into a green state.
    #
    # Threshold is measured, not guessed. REA is ONLOGON-triggered on a personal
    # PC, so 71 real inter-run gaps: max 275 h, p95 102 h. False fires over that
    # history — 72 h: 6, 168 h: 1, 336 h: 0. Default cap is 336 h, which makes
    # the AGE predicate slow (up to two weeks) and honest; the VERDICT predicate
    # is the fast one and reds the same hour REA records a failure. An
    # unrecognised outcome token fails CLOSED (exit 2), because a watchdog that
    # green-lights vocabulary it does not understand is not a watchdog.
    kuma_monitor: "Canary REA Liveness"
    script: "scripts/canaries/rea-liveness.sh"
    schedule: "hourly"

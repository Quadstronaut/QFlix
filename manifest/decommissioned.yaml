# manifest/decommissioned.yaml — retired components and where their names are
# still allowed to appear.
#
# Boundary for defect class C-08 (decommissioned-still-referenced): every
# git-tracked file, matched case-insensitively against every `name` below. A
# retired name in a HISTORY surface (changelog, transition log, incident log,
# inventory's struck-through rows) is correct and must stay. A retired name in
# EXECUTABLE code, a unit file, a manifest entry or a secrets key is a defect —
# it means a decommission left a live reference behind.
#
# `allow_paths` entries are adjudications, not conveniences: each carries a
# `reason`. An entry with no reason fails the meta-check (exit 2).

schema: 1

components:

  - id: maintainerr
    names: [maintainerr]
    retired: 2026-06-20
    fully_removed: 2026-06-26
    replaced_by: qflix-reaper
    why: >-
      Maintainerr's Plex delete path was broken (it resolved the wrong Plex id
      and silently deleted nothing). Replaced by scripts/maint/qflix-reaper.py.
      Decommission FULLY FINISHED 2026-06-26 (7d9990b): quota.sh repointed to
      the reaper, orphan refs + secrets purged, the fix-watch task removed, the
      app uninstalled.
    allow_paths:
      - path: scripts/ops/decommission-maintainerr-2026-06-20.py
        reason: >-
          The decommission tool itself. It exists to remove the component and
          must name it. Retained (not deleted) so the removal is reproducible
          and auditable; see docs/transition-log.md.
      - path: docs/maintainerr-plex-id-resolution-bug.md
        reason: >-
          The written post-mortem of the delete bug that caused the retirement.
          A history surface by definition.

  - id: homarr
    names: [homarr]
    retired: 2026-07-13
    fully_removed: 2026-07-13
    replaced_by: qflix-dash
    why: >-
      Mobile-hostile legacy dashboard. Replaced as public root by qflix-dash on
      2026-07-08; limped as a "QFlix has moved" notice until it started a
      31-alert restart storm and was uninstalled 2026-07-13 (Kuma monitor #39
      deleted with it). The mobile-ux canary was KEPT and now guards the dash.
    allow_paths: []

  - id: books-stack
    names: [kavita, komga, calibre-web, audiobookshelf]
    retired: 2026-08-16
    fully_removed: 2026-08-16
    replaced_by: null
    why: >-
      The four reader apps (Kavita, Komga, Calibre-Web, Audiobookshelf) were
      bulk-installed 2026-05-08 and never used. Every backing media directory
      was still empty at retirement (~/media/{Books,Audiobooks,Comics,Manga,
      Podcasts} = 4-8K apiece), so four services were being patched, probed,
      monitored and paged on for zero readers. Operator ordered the purge.
      Retired and fully removed the same day: manifest entries dropped and the
      pusher restarted FIRST (so no probe outlived the port -- the ordering
      Homarr got wrong in July, which cost a 31-alert storm), then the four
      Kuma monitors deleted, then `app-<name> uninstall` on each, then crontab
      /scripts/secrets/nginx-conf cleanup. Media files were left on disk.
      NOTE: `lib/ucc.py`'s maintenance-gate detector probed `app-kavita start`
      every 5 min; repointed kavita -> sonarr (secret `ucc.probe_app` plus
      `_DEFAULT_PROBE_APP`) BEFORE the uninstall, or the gate would have gone
      permanently probe-error and frozen every window-aware job behind it.
    allow_paths:
      - path: scripts/ops/decommission-books-2026-08-16.py
        reason: >-
          The decommission tool itself -- it deletes the four Kuma monitors and
          must name them to do so. Retained rather than deleted, on the
          maintainerr precedent, so the removal stays reproducible and
          auditable.
      - path: docs/secrets-convention.md
        reason: >-
          The secrets register carries a struck-through RETIRED row for the
          purged `komga.*` / `kavita.*` / `audiobookshelf.*` / `calibre-web.*`
          keys. A future operator finding one of those files on an old box
          needs the register to say it is dead, not to stay silent about it.
      - path: scripts/maint/lib/ucc.py
        reason: >-
          The probe-app default carries the kavita -> sonarr repoint in its
          comment. Naming the app it moved off is the whole point of the note:
          it tells the next reader WHY the default is not arbitrary and what
          breaks if it is repointed at something else uninstallable.
      - path: tests/unit/test_no_pii_in_repo.py
        reason: >-
          NOT a reference to our app. `audiobookshelf-username` is a whitelist
          LABEL in the PII guard's vendor carve-out: Ultra.cc's own vendored
          reference doc (docs/external/ultracc-reference.md, the Audiobookshelf
          section) quotes a generic example URL built from that placeholder.
          That file is third-party and deliberately unedited, so the label must
          keep matching or the PII guard would start reporting the vendor's
          placeholder as a leaked hostname. Deleting it would break a safety
          test to satisfy a hygiene one. (The literal example URL is not
          repeated here — this very ledger is scanned by that same guard.)

  - id: quadstronix
    names: [quadstronix]
    retired: 2026-07-16
    fully_removed: 2026-07-18
    replaced_by: null
    why: >-
      Quadstronix / Quadstronix Node 1 / Quadstronix Node 2 external Kuma
      monitors were removed by the operator 2026-07-16 (both node DNS names had
      gone stale — same unreachable IP, 100% packet loss) and dropped from
      manifest/apps.yaml:kuma_external_monitors on 2026-07-18. NOTE: the
      quadstronix BOXES are a different fleet that still exists; only the
      monitors were retired. C-08 therefore flags references in THIS repo's
      executable surfaces, not the fleet's existence.
    allow_paths: []

  - id: flaresolverr
    names: [flaresolverr]
    retired: 2026-10-11
    fully_removed: 2026-10-11
    replaced_by: null
    why: >-
      QFLX-26, operator decision 2026-10-11 ("get rid of flaresolverr for
      post-migration"). No native path (UCC divorce D-7: its bundled Chromium
      fails the slot's 10 GB address-space cap) and no use: of 23 Prowlarr
      indexers only 2 were tagged `cloudflare`, both disabled, with 0 queries /
      0 grabs in 30 days and 0 history records ever. Manifest entry dropped and
      the pusher restarted by the 240 deploy FIRST (the Homarr ordering), then
      the Prowlarr proxy + tags and the Kuma monitor removed by
      scripts/ops/decommission-flaresolverr-2026-10-11.py, then the UCC app
      uninstalled. Its canary, unsuppress watcher, native installer and the
      UCC-era install/configure scripts were deleted from git and the box.
    allow_paths:
      - path: scripts/ops/decommission-flaresolverr-2026-10-11.py
        reason: >-
          The decommission tool itself. It deletes the proxy and the monitor and
          must name them. Retained on the maintainerr/books precedent so the
          removal stays reproducible and auditable.
      - path: scripts/configure/240-maintenance-install.sh
        reason: >-
          Its retire block stops/disables the old units and rm's every deployed
          copy of the retired scripts by name. That cleanup is what keeps the
          box and deploy-drift honest on boxes provisioned before 2026-10-11.
      - path: manifest/apps.yaml
        reason: >-
          The comment block that replaced the app entry records the retirement,
          its evidence and the files it removed; the canary narratives that
          cite the old flaresolverr canary as history. No `flaresolverr:` key
          remains (pinned by tests/unit/test_native_app_manifest.py).
      - path: manifest/jobs.yaml
        reason: >-
          The adjudication preamble names the flaresolverr pair as the first
          thing the C-01 detector found by enumeration - history of the regime,
          annotated as retired.
      - path: CLAUDE.md
        reason: >-
          The operator runbook's Live-vs-Retired table. Naming it there is the
          retirement record.
      - path: manifest/rea-noise-classes.yaml
        reason: >-
          REA noise class prowlarr-flaresolverr-validation-transient. Pre-
          retirement Prowlarr log lines remain in retained logs/vlogs and must
          stay classified; the class goes inert as those age out. Removing it
          early would re-page old noise.
      - path: scripts/local-llm/qflix-rea.ps1
        reason: >-
          The self-syncing mirror of the REA noise class above (same reason).
      - path: tests/local-llm/test-qflix-rea.ps1
        reason: >-
          The REA test pinning that noise class (same reason).
      - path: tests/unit/**
        reason: >-
          Tests either pin the retirement (no manifest entry, no files) or use
          "flaresolverr" as an arbitrary fixture app name for generic
          suppression / pusher / bridge-probe logic, or cite the old canary as
          the provenance of a pattern. None loads FlareSolverr code.
      - path: scripts/maint/lib/audit/detectors/c01_timer_deadman.py
        reason: >-
          The detector docstring cites the original enumeration-boundary bug
          (the flaresolverr canary timer) as the class's discovery provenance.
      - path: scripts/configure/04*-prowlarr-*
        reason: >-
          Legacy one-shot Prowlarr bootstrap scripts (2026-05). Their proxy
          lookup already degrades to "added without proxy" when no FlareSolverr
          proxy exists, which is now the permanent state. Not deployed or
          scheduled.
      - path: scripts/configure/40-prowlarr-bulk-indexers.py
        reason: Same legacy 2026-05 Prowlarr bootstrap family as 04*; comment-only mentions.
      - path: scripts/data/prowlarr-indexers*.json
        reason: >-
          The legacy bootstrap's indexer catalog; `needs_flaresolverr` is the
          input key those 04* scripts read. Data, not a live reference.
      - path: scripts/configure/303-native-prowlarr-install.sh
        reason: Comment-only F-17 caller list; see 307 below.
      - path: scripts/configure/305-native-sonarr2-install.sh
        reason: Comment-only F-17 caller list; see 307 below.
      - path: scripts/configure/306-native-radarr-install.sh
        reason: Comment-only F-17 caller list; see 307 below.
      - path: scripts/configure/307-native-sonarr-install.sh
        reason: >-
          Comment-only: the F-17 list of bridge callers at the time the native
          installers were written. The installers are idempotent re-runnable
          proofs; churning them for a comment is not worth a re-proof.
      - path: scripts/maint/systemd/qflix-*-fwd.socket
        reason: >-
          Comment-only F-17 caller list (same as the installers). Editing a live
          socket unit for a comment would churn four deployed units.

# Surfaces where a retired name is history, not a live reference. These are the
# only places a decommissioned name may appear without a per-path adjudication.
allowed_context_paths:
  - path: CHANGELOG.md
    reason: The append-only change history. Removing a name here would falsify it.
  - path: docs/transition-log.md
    reason: The record of every decommission. Its entire purpose is naming them.
  - path: docs/incidents.md
    reason: Incident history; several incidents are ABOUT the retired components.
  - path: inventory.md
    reason: >-
      Carries struck-through (~~name~~) DECOMMISSIONED rows on purpose, so an
      operator reading the inventory learns what used to exist and why it went.
  - path: todo-after-claude.md
    reason: Dated operator worklist; entries reference the decommission work itself.
  - path: docs/arr-audit-2026-05-09.md
    reason: A dated audit FINDINGS document — a frozen historical snapshot.
  - path: docs/arr-audit-actions-2026-05-09.md
    reason: The action list from that same dated audit; frozen by definition.
  - path: docs/operator-deferred.md
    reason: Deferral register; entries are dated and reference retired components.
  - path: docs/councils/**
    reason: Council transcripts are immutable records of a decision at a date.
  - path: scripts/qflix-newsletter/cutover-2026-05-11.html
    reason: >-
      A frozen, already-sent newsletter issue. Editing a sent email's archived
      body would make the archive lie about what subscribers received.
  - path: docs/superpowers/**
    reason: >-
      Dated design specs and plans. A 2026-05 consolidation design that did not
      mention Maintainerr would be a forgery of what was actually decided then.
  - path: docs/external/**
    reason: >-
      Vendored third-party reference material. Not ours to edit, and editing it
      would break the point of keeping a verbatim copy.
  - path: .claude/council-ledger.jsonl
    reason: >-
      Append-only record of council decisions at a point in time. Immutable by
      construction.
  - path: manifest/decommissioned.yaml
    reason: >-
      This ledger. It has to name the components it retires; excluding itself is
      the only way the detector does not report its own input as a defect.
  - path: manifest/defect-classes.yaml
    reason: >-
      The taxonomy cites the measured C-08 baseline (maintainerr 19 files,
      homarr 9, quadstronix 3) as the class's discovery provenance.
  - path: scripts/maint/lib/audit/detectors/c08_decommissioned_refs.py
    reason: >-
      The detector for this very class. Its docstring cites the measured
      baseline so a future reader can tell whether the numbers moved.

# A line matching any of these is an allowed mention wherever it appears: the
# text itself declares the component retired, which is documentation, not a
# live reference. Deliberately narrow — "decommissioned"/"RETIRED"/"~~name~~"
# and nothing looser, so `subprocess.run(["app-homarr", ...])` can never hide
# behind a nearby comment.
allowed_line_patterns:
  - pattern: '(?i)\b(decommission(ed|ing)?|retired|removed|uninstalled|replaced by|no longer|legacy|purged)\b'
    reason: >-
      The line states the retirement as a fact. Comments and prose that say
      "X was decommissioned" are the correct way to keep institutional memory.
  - pattern: '~~'
    reason: Markdown strikethrough — the inventory's DECOMMISSIONED row marker.

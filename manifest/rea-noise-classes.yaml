# manifest/rea-noise-classes.yaml — the REA noise-suppression POLICY, in git.
#
# WHY THIS FILE EXISTS
# --------------------
# scripts/local-llm/qflix-rea.ps1 is gitignored (.gitignore:55 — operator-local
# workstation tooling, public repo). It carries TWO copies of the same policy:
#   1. $Script:NoiseFindingRules — the ENFORCEMENT table (deterministic regex).
#   2. Get-SystemPrompt's "NON-ACTIONABLE NOISE you must NEVER report" sentence
#      — the ADVISORY ask to the models.
# On 2026-07-29 three classes were named in the prompt with NO enforcement rule,
# so the prompt was asking rather than enforcing — the exact gap the rule table
# exists to close. Nothing could catch that, because neither copy was in git and
# no test compared them.
#
# This file is the SINGLE SOURCE both sides read. qflix-rea.ps1 loads it at
# start-up via scripts/local-llm/rea-noise-classes.ps1 (tracked); pytest
# asserts prompt-clause <-> rule-id bijection offline, in CI, with no ps1
# present. That is how defect class C-07 becomes CI-checkable without
# un-gitignoring a 56KB operator-local script.
#
# HONEST LIMIT: only the POLICY is guarded. A body edit to qflix-rea.ps1 that
# does not touch this policy is invisible to CI. Registered as residual R4 in
# docs/audit-residual-risk.md and as surface S2 in manifest/audit-scope.yaml.
#
# `rx` values are .NET regex as written in the ps1, byte-for-byte. They must
# also compile under Python's `re` (C-07 asserts it) — every construct in use
# (inline flags, \A, negative lookahead, non-capturing groups) is common to
# both engines. If a future rule needs a .NET-only construct, add
# `python_incompatible: true` and C-07 will skip the compile check for that one
# rule and record it as an explicit, named waiver instead of silently passing.

schema: 1
source_script: scripts/local-llm/qflix-rea.ps1
source_variable: "$Script:NoiseFindingRules"
prompt_function: Get-SystemPrompt
# The prompt sentence the clauses below are carved out of. C-07 splits the text
# between this marker and `prompt_stop_marker` on ';' and demands every segment
# be claimed by exactly one class.
prompt_start_marker: "NON-ACTIONABLE NOISE you must NEVER report"
prompt_stop_marker: "CONVERSELY"

classes:
  - id: plex-client-abort-stream-write
    title: Plex client-abort stream write
    rx: '(?i)(caught exception trying to stream file|protocol is shutdown \(ssl|ssl[-: ]?protocol[-: ]?shutdown)'
    field: null
    prompt_clause: "Plex client-abort stream writes"
    why: >-
      A viewer closed or seeked mid-stream and the TLS session went away while
      Plex was writing a chunk. Proven client-side: the identical error fires on
      PhotoTranscoder poster JPEGs, which have no transcode pipeline at all.
    added: 2026-07-28

  - id: plex-nat-pmp-upnp
    title: Plex NAT-PMP / UPnP port-mapping chatter
    rx: '(?i)(nat-?pmp|upnp)\b.*(not supported|unsupported|no gateway|failed)'
    field: null
    prompt_clause: "Plex NAT-PMP / UPnP / port-mapping"
    why: Upstream gateway does not support port mapping. External and cosmetic.
    added: 2026-07-28

  - id: tdarr-express-undefined-includes
    title: Tdarr express-route TypeError (reading 'includes')
    rx: '(?i)cannot read properties of undefined \(reading ''includes''\)'
    field: null
    prompt_clause: "tdarr unhandled express-route errors"
    why: >-
      Unhandled express route error in Tdarr_Server/srcug/api/servers.js.
      Upstream Tdarr bug, non-fatal: verified live 2026-07-28 with the server at
      NRestarts=0 and 20 days uptime while these were firing. This is the exact
      finding qwen3-coder:30b reported anyway on 2026-07-28, proving a prompt
      alone cannot hold a floor.
    added: 2026-07-28

  - id: tdarr-worker-not-a-function
    title: Tdarr worker<N> is not a function
    rx: '(?i)worker\d*\b.*is not a function'
    field: null
    prompt_clause: "tdarr unhandled express-route errors"
    why: Same upstream Tdarr express-route bug as tdarr-express-undefined-includes.
    added: 2026-07-28

  - id: tdarr-wasm-oom
    title: Tdarr Mediainfo probe WASM out-of-memory
    rx: '(?i)(webassembly\.instantiate\(\):\s*out of memory|wasm memory|wasm-memory-exhausted)'
    field: null
    prompt_clause: "WASM out-of-memory failure"
    why: >-
      Ruled PERMANENTLY UNFIXABLE 2026-07-28 — Tdarr's bundled Node rejects the
      only viable mitigation (--disable-wasm-trap-handler) and crash-loops the
      server if forced, and ulimit -v 10GB vs the WASM runtime's 8GB guard has
      no other lever on this box. Tracked by the tdarr-scanner Kuma canary, not
      by paging the operator on every occurrence.
    added: 2026-07-28

  - id: mediainfo-failure
    title: Error running MediaInfo
    rx: '(?i)error running mediainfo'
    field: null
    prompt_clause: "Error running MediaInfo"
    why: Direct consequence of tdarr-wasm-oom; same 2026-07-28 ruling applies.
    added: 2026-07-28

  - id: plex-post-reap-scan
    title: Plex "Failed to create parent iterator" after a reap
    rx: '(?i)failed to create parent iterator'
    field: null
    prompt_clause: "Failed to create parent iterator"
    why: >-
      Expected trailing edge of qflix-reaper's add-date retention deleting a
      whole series directory out from under a library scan (e.g. Fargo,
      arrId=225, reaped 2026-07-22). Plex noticing the directory it was about
      to scan is gone, not a fault. THE WINDOW IS 45 DAYS, NOT 60 - restated
      because the prose copies of this number have drifted before. Single
      source of truth is DEFAULT_THRESHOLD_DAYS in scripts/maint/qflix-reaper.py,
      moved 60 -> 45 by operator decision 2026-07-31; the on-box systemd
      drop-in carries only the arming flags and passes no --threshold-days, so
      that repo constant IS the live window (re-verified read-only against the
      box 2026-08-03). The four tracked prose copies that still said 60 were
      corrected 2026-08-03 and, where possible, made incapable of rotting
      again: the --threshold-days help string now interpolates %(default)s
      from the constant rather than restating it, and the reaper docstring,
      the systemd unit Description and the torrent-janitor docstring no longer
      name a number at all. The 60s that REMAIN in the tree are historical and
      correct: Maintainerr's own rule really was 60 days (scripts/configure/
      27b, manifest/apps.yaml) and the 2026-05-07 design spec records what was
      true when it was written.
    added: 2026-07-28

  - id: external-indexer-5xx-html
    title: Cloudflare / nginx error-page HTML relayed from an EXTERNAL indexer
    rx: '(?i)(cloudflare.{0,80}(ray id|error 5\d\d)|ray id:\s*[0-9a-f]{8,}|<center>nginx(?:/[\d.]+)?</center>)'
    field: null
    prompt_clause: "nginx error-page HTML returned to an *arr from an EXTERNAL indexer/proxy"
    why: >-
      Transient upstream hiccup on someone else's server, not a fault in our
      stack. Deliberately NOT a bare "5xx" or "error" term — that would also hit
      our own services' genuine 5xx responses.
    added: 2026-07-29

  - id: indexer-severity-field-echo
    title: Indexer response echoing its own "severity":"error" JSON field
    rx: '"severity"\s*:\s*"error"'
    field: null
    prompt_clause: 'indexer responses that merely echo a `"severity": "error"` JSON field'
    why: >-
      Part of the indexer's normal response schema. Scoped to the exact quoted
      JSON key:value shape so a genuine log line that mentions severity near the
      word error in prose still pages.
    added: 2026-07-29

  - id: bare-stack-continuation
    title: Bare stack-trace continuation fragment with no root error
    rx: '(?ims)\A(?!.*(?:^\s*[A-Za-z][\w.]*(?:Exception|Error)\b\s*:|Traceback \(most recent call last\)|\[ERROR\]|ERROR\s*[-:])).*(?:^\s*at\s+\S|end of inner exception stack trace)'
    field: excerpt
    prompt_clause: "bare stack-trace CONTINUATION fragments"
    why: >-
      .NET-style `   at Namespace.Class.Method()` frames and the boilerplate
      "End of inner exception stack trace" marker with NOTHING in the same
      excerpt that looks like a real exception header. Scoped to the EXCERPT
      field only: a model's own prose summary almost always contains the words
      error/exception regardless of the raw log, which would poison the
      negative lookahead into never firing.
    added: 2026-07-29

  - id: plex-client-profile-extra
    title: Plex ClientProfileExtra "missing or invalid type parameter"
    rx: '(?i)clientprofileextra:\s*missing or invalid type parameter'
    field: null
    prompt_clause: 'Plex "ClientProfileExtra: missing or invalid type parameter"'
    why: >-
      PMS logs this at ERROR level, ~5x per transcode-decision request, when a
      client profile-extra directive block carries a directive it cannot read.
      130 ERROR lines corpus-wide 2026-08-03, all under [Req#*/Transcode],
      against ZERO "Transcoder terminated" / "Transcode failed" / "Error opening"
      lines in the whole PMS log - playback is unaffected, so it is not an
      operator page. NOT unconditionally benign: log coverage is continuous
      Jun 29 - Aug 03 with no rotation gap, and the class was at ZERO for eleven
      consecutive days (Jul 22 - Aug 01) then 65 on Aug 02 and 45 on Aug 03
      against flat total log volume. That is an ONSET, and this table has no rate
      dimension, so the rate signal is carried OUTSIDE this rule - by the
      collector's "# collector-suppressed:" census line and by follow-up FU-1
      (an on-box class-rate canary). If a member reports a device that will not
      play, UN-SUPPRESS THIS CLASS FIRST. Scoped to the exact message so a
      different ClientProfileExtra failure still pages.
    added: 2026-08-03

  - id: plex-metadata-agent-pseudo-identifier
    title: Plex metadata-agent lookup on a PSEUDO-identifier (library / iva)
    rx: '(?i)unable to find metadata agent provider for identifier\s+\W?(?:library|iva)\b'
    field: null
    prompt_clause: "naming the PSEUDO-identifiers 'library' or 'iva'"
    why: >-
      MetadataAgentManager/getAgent resolving an identifier that is a SCOPE name,
      not an agent name. Proven, not assumed: identifier 'library' resolves to 4
      metadata_items rows all at library_section_id = -2 (Plex's synthetic
      PlayQueue pseudo-section), and 'iva' to 327 iva:-prefixed rows with NULL
      library_section_id (Plex Discover / online catalog). All four real
      libraries carry correct agents (2 QFlix - TV = tv.plex.agents.series,
      4 QFlix - Movies and 5 QFlix - Anime Movies = tv.plex.agents.movie,
      6 QFlix - Anime = tv.plex.agents.series), so no metadata is at risk.
      Both identifiers are enumerated EXPLICITLY rather than left unanchored: the
      same message naming a real provider (com.plexapp.agents.*, tv.plex.agents.*)
      is a genuine config break and MUST still page - verified this rx does not
      match those. 'iva' is included because keying on 'library' alone would have
      re-paged on the identical non-issue (it fired Jul 11 and Jul 21).
    added: 2026-08-03

  - id: arr-parsing-no-matching-title
    title: Sonarr/Radarr ParsingService "No matching series/movie <title>"
    rx: '(?i)\|Debug\|ParsingService\|No matching (?:series|movie)\b'
    field: null
    prompt_clause: 'Sonarr/Radarr ParsingService "No matching series"/"No matching movie"'
    why: >-
      STRUCTURAL, not obscurity: the *arr pulls an indexer's FULL recent RSS feed
      (206-522 items per sync) and filters locally, so every title outside a
      36-title library logs this at Debug. All 897 such lines in
      sonarr.debug.0.txt are level=Debug; ZERO are Error. The 2026-08-03 F3 alert
      reported one at severity=error. Cross-referenced all 36 library titles
      against the 197 distinct unmatched titles: ZERO real overlap (the single
      apparent hit was a substring collision), and the matcher demonstrably works
      - South Park and Stranger Things appear in the logs and NEVER in the
      unmatched list. So this is not a series-list or root-folder regression.
      Do NOT justify this rule as "shows nobody subscribes to": the top unmatched
      titles are One Piece, House of the Dragon and My Hero Academia, which are
      mainstream - the invariant is feed-size vs library-size, not popularity.
      Sonarr writes "No matching series <title>" and Radarr "No matching movie
      for titles '<title>'"; both shapes are covered, verified against live log
      lines 2026-08-03.
      ANCHORED TO LEVEL+LOGGER, not to the phrase. An earlier draft matched the
      bare phrase with a (?!folder|files) lookahead and field: null, which meant
      it ran against signature+summary+excerpt JOINED - so a model's PROSE merely
      containing "no matching series" suppressed the whole finding, including a
      genuine |Error|ImportApprovedEpisodes| disk-quota import failure (proven
      under .NET 2026-08-03). It also missed the plural "no matching series
      FOLDERS on disk" because the lookahead wrote folder\b with no s?. The
      "|Debug|ParsingService|" anchor costs ZERO real suppression and fixes both:
      measured read-only on the box 2026-08-03, 155130 of 155130 "No matching
      series" and 117585 of 117585 "No matching movie" lines carry exactly that
      level+logger, with ZERO occurrences at any other level or logger anywhere
      in the corpus. The genuine Error lines "no matching series FOLDER on disk"
      and "no matching series FILES were readable" carry a different logger and
      now cannot match at all, rather than relying on a lookahead.
    added: 2026-08-03

  - id: arr-release-rejected-unknown-title
    title: Sonarr/Radarr DownloadDecisionMaker "[Permanent] Unknown Series/Movie"
    rx: '(?i)\|Debug\|DownloadDecisionMaker\|.*\[Permanent\] Unknown (?:series|movie)\b'
    field: null
    prompt_clause: 'DownloadDecisionMaker "[Permanent] Unknown Series/Unknown Movie" rejections'
    why: >-
      The DownloadDecisionMaker half of the same by-design event - 29,146
      "[Permanent] Unknown Series" and 43,363 "[Permanent] Unknown Movie"
      rejections, all level=Debug. Anchored to "[Permanent] Unknown
      Series|Movie" and NOT to "[Permanent]" alone, so every other rejection
      reason (quality, size, custom format, "matches an alias for series with
      TVDB ID") still reaches a model. Shares prompt segment 10 with
      arr-parsing-no-matching-title - the same precedent as segment 4 (two tdarr
      express-route rules) and segment 6 (wasm-oom + mediainfo-failure).
      ANCHORED TO LEVEL+LOGGER for the same reason as its twin above: with
      field: null this rx runs against signature+summary+excerpt JOINED, so the
      bare "[Permanent] Unknown Series" phrase appearing in a model's PROSE was
      enough to suppress an unrelated genuine fault (proven under .NET with a
      real |Error|SeriesService|database is locked finding). Measured read-only
      2026-08-03: 101183 of 101183 "[Permanent] Unknown Series" and 117582 of
      117582 "[Permanent] Unknown Movie" lines carry "|Debug|DownloadDecisionMaker|",
      zero at any other level or logger, so the anchor costs no real suppression.
      The `.*` between logger and reason is deliberately NOT (?s) - it may not
      cross a newline, so a Debug rejection line pasted ABOVE an unrelated error
      line in the same excerpt does not drag the error down with it.
    added: 2026-08-03

  - id: arr-debug-only-excerpt
    title: Finding whose ONLY evidence is *arr Debug-level lines
    rx: '(?ims)\A(?!.*(?:\|\s*(?:Error|Fatal|Warn(?:ing)?|Critical)\s*\||ERROR\s*[-:]|\[ERROR\]|Traceback \(most recent call last\))).*\|Debug\|'
    field: excerpt
    prompt_clause: "any finding whose ONLY evidence is *arr Debug-level lines"
    why: >-
      STRUCTURAL backstop for the severity misclassification F3 exposed, not a
      phrase rule. REA takes `severity` verbatim from the model, and the prompt's
      standing "ignore unrelated debug lines" instruction was violated anyway by
      qwen2.5-coder:7b - a prompt cannot hold this floor. Fires only when the
      excerpt carries an *arr NLog |Debug| level token and NO error-level
      evidence anywhere in it, so it declines findings with no error-level
      evidence rather than silencing a log level.
      THE GUARD IS DELIBERATELY WIDER THAN *arr NLog. An earlier draft wrote the
      lookahead as \|(?:Error|Fatal|Warn)\| - unpadded, pipe-delimited, *arr-only
      - while the rule itself eats a finding of ANY format. Bazarr ships inside
      the SAME arr_logs section and writes PADDED tokens: `cat -A` on the box
      2026-08-03 gives "|ERROR   |" and "|WARNING |", neither of which satisfied
      that lookahead ("Warning" was not even in the alternation), so an excerpt
      pairing a genuine Bazarr ERROR with one *arr Debug line was silently eaten.
      Same for Plex's "ERROR - " and a Python "Traceback (most recent call
      last):". The alternation now covers padded pipe tokens, Warning, Critical,
      ERROR-dash/colon, [ERROR] and Traceback - the same header set
      bare-stack-continuation already uses. Widening a NEGATIVE lookahead can
      only ever suppress LESS, so this direction is fail-open by construction.
      Scoped to `excerpt` for the
      same reason as bare-stack-continuation: a model's prose summary almost
      always contains the word "error", which would poison the negative
      lookahead into never firing. After the arr_logs collector rebuild stops
      shipping Debug lines its live target is source #14 (vlogs), whose LogsQL
      term filter can still return a Debug line whose message text contains the
      word "error". MUST SHIP WITH THE COLLECTOR FIX - shipped alone it would eat
      100% of today's arr_logs findings and convert a visible false page into
      silence.
    added: 2026-08-03

  - id: plex-credits-detection-chatter
    title: Plex CreditsDetectionManager marker-scan retry chatter
    rx: '(?i)\[creditsdetectionmanager(?:\]|/).{0,80}?(?:incomplete marker attributes|bufferinglinereader: failed to read line|credits detection for item \d+ has failed too many times)'
    field: null
    prompt_clause: 'Plex CreditsDetectionManager marker-scan chatter'
    why: >-
      The credits/intro marker scanner reporting its own retryable read
      failures. Enrolled here 2026-08-03 to close a TWIN-SURFACE GAP, not
      because the class is new: the plex_errors collector had been dropping
      every line containing the bare substring "CreditsDetectionManager" since
      2026-07-25, uncounted and with NO rule in this file, while a comment in
      that collector asserted each of its exclusions "has a TWIN rule in
      manifest/rea-noise-classes.yaml". That assertion was false for this class
      and for plex-unknown-metadata-type-folder, and together they were 897 of
      the 1051 fresh ERROR lines dropped on 2026-08-03 - 86% of the section's
      suppression was invisible to CI, which is precisely the two-policy-surface
      failure this file exists to prevent.
      DELIBERATELY NARROWER THAN THE COLLECTOR GREP WAS. The bare subsystem name
      matched five distinct message shapes; this rx enumerates only the three
      benign high-volume ones (measured 2026-08-03: 85 "incomplete marker
      attributes", 85 "BufferingLineReader: failed to read line", 20 "credits
      detection for item N has failed too many times"). The other two -
      "Job failed: Scanner job failed" (4) and "Mis-matching media items
      detected" (6) - are NOT covered and still reach a model, because a failed
      scanner job is a plausible real fault and nothing proved otherwise. Any
      future ERROR naming this subsystem also still pages. Fail open.
    added: 2026-08-03

  - id: plex-unknown-metadata-type-folder
    title: 'Plex "Unknown metadata type: folder" browse reply'
    rx: '(?i)unknown metadata type:\s*folder\b'
    field: null
    prompt_clause: 'Plex "Unknown metadata type: folder" replies'
    why: >-
      A client asked the PMS HTTP API about a folder-type item, for which Plex
      has no metadata class, and PMS logged the miss at ERROR level. Uniform
      shape - every one of the 697 fresh occurrences measured 2026-08-03 is
      "[Req#<id>] Unknown metadata type: folder" under a request tag, i.e. a
      normal browse response rather than a state fault. Highest-volume single
      class in plex_errors: 66% of all fresh ERROR lines on its own, which is
      why the collector reclaims its bytes at the input as well.
      Enrolled here for the same twin-surface reason as
      plex-credits-detection-chatter - see that class's `why`. Anchored to the
      exact "folder" type so an "Unknown metadata type: <anything-else>" still
      pages.
    added: 2026-08-03

  - id: bazarr-github-release-check-ratelimit
    title: Bazarr update-check rate-limited by the GitHub API
    rx: '(?im)^(?=.*(?:trying to get releases from github|morpheus65535/bazarr/releases))(?=.*(?:rate.?limit|http error))'
    field: excerpt
    prompt_clause: 'Bazarr "Error trying to get releases from Github" GitHub API rate-limit failures'
    why: >-
      Bazarr's updater polls the unauthenticated GitHub releases API, which is
      limited to 60 requests/hour PER IP. This is an Ultra.cc SHARED seedbox, so
      that quota is consumed by every other tenant on the same address - two
      Bazarr instances checking hourly could not exhaust it alone. The failure
      is therefore external and not ours to fix from inside the stack.
      COSMETIC IS PROVEN, NOT ASSUMED: all three Bazarr processes run with
      `--no-update` (verified live 2026-08-06 - bazarr2's ExecStart, its running
      argv, and bazarr-1's containerised argv all carry the flag), so the
      release list is display-only and Bazarr could not self-update even with a
      complete response. It is also self-correcting rather than a wedge -
      releases.txt was refreshed successfully at 23:51 the same evening the
      403s fired, i.e. the poll succeeds again as soon as the shared quota
      rolls over.
      AUTHENTICATION IS NOT AVAILABLE AS A FIX, which is why this is suppressed
      rather than engineered away: app/check_update.py builds the URL inline and
      calls requests.get(url, allow_redirects=True, timeout=15) with NO headers
      argument, and there is no token config field or environment variable
      anywhere in the Bazarr tree. The only lever would be patching that call
      site, and bazarr2-sync.timer re-matches bazarr2 to bazarr-1's version
      hourly, so such a patch is reverted by design. (A GitHub PAT would still
      buy real headroom for QFlix's OWN api.github.com callers - the lifecycle
      resolver in Tuesday.md:73 - which is a separate, unrelated change.)
      RX RESHAPED 2026-08-13, v2 2026-08-14 (was: anchored to the full Bazarr
      releases URL). The URL anchor was structurally dead: the arr_logs
      collector's norm() rewrites every URL to <url> before any model sees it,
      cut -c1-220 amputates the single-line traceback long before the URL
      appears, and on the vlogs path - which DOES deliver the URL intact - the
      models truncate their excerpt at "rate limit exceeded" anyway. Measured
      live: this class paged on 2026-08-13 with the rule present.
      The rx is two required lookaheads - updater marker AND rate-limit token -
      with three constraints the first (2026-08-13) reshape lacked, each
      closing a false-suppression hole the adversarial review demonstrated:
      field=excerpt (a model summary speculating "possible rate limiting" must
      not complete the pair for a ConnectionError finding); (?m)^ without (?s)
      (both tokens must share ONE excerpt line, so a benign updater line
      cannot borrow the token from a real 429 fault elsewhere in the excerpt);
      and markers that are Bazarr's verbatim updater text ("trying to get
      releases from github") or the path-anchored slug (.../bazarr/releases) -
      not inventable prose, not the bare repo slug. So a 403 against
      morpheus65535/bazarr/issues, api.github.com/rate_limit, or any other
      GitHub endpoint - including QFlix's own release-resolver traffic, where
      a silent rate-limit really would degrade version checks - still pages.
      v3 (same day): token B widened to (rate.?limit|http error), because the
      arr_logs collector's cut -c1-220 amputates the traceback - and with it
      "rate limit exceeded", at byte ~464 post-norm - from the ONE physical
      line Bazarr logs, so an arr_logs-sourced excerpt could never satisfy a
      rate-limit-only token (measured live: the 00:50 UTC 403 shipped as a
      suppressor-proof excerpt). "Http error." is check_update.py's marker
      for requests HTTPError SPECIFICALLY (verified in deployed source:
      ConnectionError logs "Connection Error.", Timeout logs "Timeout
      Error.", bare RequestException logs neither) and it survives the
      220-char cut beside the updater marker. The network-fault shapes
      (Connection Error, Timeout) still lack both B tokens and still page:
      a persistent one of those is a network fault worth seeing. An HTTP 5xx
      release-check failure is now suppressed along with the 403 - equally
      external and equally cosmetic on a --no-update install.
    added: 2026-08-06

  - id: tdarr-handbrake-binary-test
    title: Tdarr node binary self-test failing on the absent HandBrakeCLI
    rx: '(?is)\A(?!.*binary test \d+:\s*(?!handbrakepath\b)\S+ not working\b).*binary test \d+:\s*handbrakepath not working\b'
    field: excerpt
    prompt_clause: 'Binary test N: handbrakePath not working'
    why: >-
      The Tdarr node re-tests its configured binaries at every start (daily
      01:00 UTC restart cycle - 111 occurrences in Tdarr_Node_Log.txt measured
      2026-08-16) and HandBrakeCLI is absent AND uninstallable on this slot:
      ruled 2026-07-28, the same day every library health check was forced to
      ffmpegscan because handbrakescan is 100% dead here by design (see the
      tdarr-healthcheck history - it ran silently broken for 68 days).
      Permanent and cosmetic: no flow, no transcode and no health check
      references HandBrake. Anchored to handbrakePath SPECIFICALLY - a
      "Binary test N: ffmpegPath not working" line means the binary every
      transcode actually uses is broken, which is a REAL fault and must still
      page; the \d+ keeps the test number free so Tdarr renumbering its test
      sequence cannot resurrect the class.
      EXCERPT-SCOPED WITH A SIBLING LOOKAHEAD (adversarial review 2026-08-16,
      first shape was a bare field-null phrase match): both binary tests fire
      from the SAME startup self-test with an identical line template, and
      the tdarr collector uniq-collapses them into the same section, so a
      real ffmpegPath failure is structurally guaranteed to sit NEXT TO the
      benign handbrake line - exactly when a model bundles both into one
      excerpt, which a field-null rule would then eat whole. The negative
      lookahead declines the match when ANY other "Binary test N: <binary>
      not working" shares the excerpt, and excerpt scoping keeps a model
      prose summary from completing the match for an unrelated fault. Same
      hazard class the arr-parsing/arr-debug rules already paid down.
    added: 2026-08-16

  - id: seerr-plex-scan-tvdbid-collision
    title: Seerr Plex-scan UNIQUE constraint on media.tvdbId (multi-guid anthology)
    rx: '(?is)\A(?!.*unique constraint failed:\s*(?!media\.tvdbid\b)\S+).*unique constraint failed:\s*media\.tvdbid\b'
    field: excerpt
    prompt_clause: 'UNIQUE constraint failed: media.tvdbId'
    why: >-
      Jellyseerr's Plex full scan processes each guid a Plex item carries; an
      anthology show matched by the TMDB agent can carry SEVERAL tmdb guids
      that all resolve to one tvdbId. Proven live 2026-08-16: Plex item 7693
      "Monster (2022)" carries tmdb 113988 + 138807 + 225634 and tvdb 389492;
      seerr media row id 47 (tmdbId 113988, tvdbId 389492, status 5 =
      available) already exists, so the scan's insert for the sibling tmdb
      guids fails the UNIQUE index once per full scan. Nothing is broken for
      members - the item is tracked and available - and there is no local
      lever: the guid set comes from Plex's TMDB agent and the insert is
      upstream Jellyseerr code. Anchored to the media.tvdbId column so any
      OTHER Seerr SQLITE_CONSTRAINT (a different column or table would be a
      genuine schema/data fault) still pages - and, same adversarial-review
      finding as the handbrake rule above, excerpt-scoped with a sibling
      negative lookahead so an excerpt that ALSO carries a constraint
      failure on a DIFFERENT column pages instead of being eaten together
      with the benign tvdbId line. Seerr reaches REA only through the vlogs
      source, whose 25-row batch can co-land multiple distinct constraint
      failures from one scan burst.
    added: 2026-08-16

  - id: calibre-web-pywsgi-probe-garbage
    title: calibre-web pywsgi ERROR lines from internet probes on the public port
    rx: '(?i)\{pywsgi\.py:\d+\}.*(invalid http (method|version)|expected get method|invalid request line)'
    field: null
    prompt_clause: 'Invalid HTTP method'
    why: >-
      calibre-web listens on a PUBLIC Ultra.cc slot port
      (169.150.251.170:42004) and gevent pywsgi logs one ERROR per malformed
      request - TLS ClientHello bytes and fuzzer garbage thrown at the
      plaintext socket by internet scanners, measured 2026-08-16 at ~1 line
      per 2 minutes from scanner IPs (e.g. 86.57.254.1 walking sequential
      source ports). External and cosmetic: the app is healthy and every
      route sits behind auth; there is nothing to fix on a port the platform
      exposes by design. Enrolled together with the app_extra collector
      widening that first made these lines reachable at all - suppression
      shipped WITH the coverage, so the new source never produced a standing
      false page. INPUT half is the counted app_extra drop (census line
      "# collector-suppressed: file=calibre-web.log ..."); this rule is the
      OUTPUT backstop, same two-surface contract as the plex_errors classes.
      Anchored to the brace-form "{pywsgi.py:N}" logger tag PLUS the exact
      garbage tokens, so a genuine calibre-web fault - a Python traceback, a
      database error, any other logger - matches neither and still pages.
    added: 2026-08-16

# Every ';'-delimited segment of the prompt's never-report sentence must be
# claimed here by >=1 class, and every class above must be claimed by exactly
# one segment. That two-way check is what would have caught the 2026-07-29 gap:
# a segment with no `classes:` entry means the prompt is asking without
# enforcing.
prompt_segments:
  - index: 0
    marker: 'Plex NAT-PMP / UPnP / port-mapping "not supported by gateway" messages'
    classes: [plex-nat-pmp-upnp]
  - index: 1
    marker: 'nginx error-page HTML returned to an *arr from an EXTERNAL indexer/proxy'
    classes: [external-indexer-5xx-html]
  - index: 2
    marker: 'indexer responses that merely echo a `"severity": "error"` JSON field'
    classes: [indexer-severity-field-echo]
  - index: 3
    marker: 'bare stack-trace CONTINUATION fragments'
    classes: [bare-stack-continuation]
  - index: 4
    marker: 'tdarr unhandled express-route errors'
    classes: [tdarr-express-undefined-includes, tdarr-worker-not-a-function]
  - index: 5
    marker: 'Plex client-abort stream writes'
    classes: [plex-client-abort-stream-write]
  - index: 6
    marker: "WASM out-of-memory failure"
    classes: [tdarr-wasm-oom, mediainfo-failure]
  - index: 7
    marker: 'Failed to create parent iterator'
    classes: [plex-post-reap-scan]
  - index: 8
    marker: 'Plex "ClientProfileExtra: missing or invalid type parameter" lines, which PMS logs at ERROR level once or more per transcode-decision request and which never accompany a failed transcode'
    classes: [plex-client-profile-extra]
  - index: 9
    marker: "Plex \"Unable to find metadata agent provider for identifier\" naming the PSEUDO-identifiers 'library' or 'iva', which are Plex resolving its own PlayQueue and Discover scopes"
    classes: [plex-metadata-agent-pseudo-identifier]
  - index: 10
    marker: 'Sonarr/Radarr ParsingService "No matching series"/"No matching movie" Debug lines and the paired DownloadDecisionMaker "[Permanent] Unknown Series/Unknown Movie" rejections'
    classes: [arr-parsing-no-matching-title, arr-release-rejected-unknown-title]
  - index: 11
    marker: 'any finding whose ONLY evidence is *arr Debug-level lines - an excerpt carrying a "|Debug|" NLog level token and no error-level token'
    classes: [arr-debug-only-excerpt]
  - index: 12
    marker: 'Plex CreditsDetectionManager marker-scan chatter'
    classes: [plex-credits-detection-chatter]
  - index: 13
    marker: 'Plex "Unknown metadata type: folder" replies'
    classes: [plex-unknown-metadata-type-folder]
  - index: 14
    marker: 'Bazarr "Error trying to get releases from Github" GitHub API rate-limit failures'
    classes: [bazarr-github-release-check-ratelimit]
  - index: 15
    marker: 'Tdarr node "Binary test N: handbrakePath not working" lines'
    classes: [tdarr-handbrake-binary-test]
  - index: 16
    marker: 'Seerr/Jellyseerr Plex-scan "UNIQUE constraint failed: media.tvdbId" lines'
    classes: [seerr-plex-scan-tvdbid-collision]
  - index: 17
    marker: 'calibre-web pywsgi "{pywsgi.py:N}" ERROR lines'
    classes: [calibre-web-pywsgi-probe-garbage]

# Deadman reasons, mirrored from $Script:DeadmanReasons. Kept here so C-09
# (silent-exit-on-missing-prerequisite) can enumerate REA's early-return paths
# from git without the ps1 present.
deadman_reasons:
  - tunnel_timeout
  - no_models
  - ssh_fail
  - blob_parse
  - all_models_noop

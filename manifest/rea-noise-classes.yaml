# manifest/rea-noise-classes.yaml — the REA noise-suppression POLICY, in git.
#
# WHY THIS FILE EXISTS
# --------------------
# scripts/local-llm/qflix-rea.ps1 is gitignored (.gitignore:55 — operator-local
# workstation tooling, public repo). It carries TWO copies of the same policy:
#   1. $Script:NoiseFindingRules — the ENFORCEMENT table (deterministic regex).
#   2. Get-SystemPrompt's "NON-ACTIONABLE NOISE you must NEVER report" sentence
#      — the ADVISORY ask to the models.
# On 2026-07-29 three classes were named in the prompt with NO enforcement rule,
# so the prompt was asking rather than enforcing — the exact gap the rule table
# exists to close. Nothing could catch that, because neither copy was in git and
# no test compared them.
#
# This file is the SINGLE SOURCE both sides read. qflix-rea.ps1 loads it at
# start-up via scripts/local-llm/rea-noise-classes.ps1 (tracked); pytest
# asserts prompt-clause <-> rule-id bijection offline, in CI, with no ps1
# present. That is how defect class C-07 becomes CI-checkable without
# un-gitignoring a 56KB operator-local script.
#
# HONEST LIMIT: only the POLICY is guarded. A body edit to qflix-rea.ps1 that
# does not touch this policy is invisible to CI. Registered as residual R4 in
# docs/audit-residual-risk.md and as surface S2 in manifest/audit-scope.yaml.
#
# `rx` values are .NET regex as written in the ps1, byte-for-byte. They must
# also compile under Python's `re` (C-07 asserts it) — every construct in use
# (inline flags, \A, negative lookahead, non-capturing groups) is common to
# both engines. If a future rule needs a .NET-only construct, add
# `python_incompatible: true` and C-07 will skip the compile check for that one
# rule and record it as an explicit, named waiver instead of silently passing.

schema: 1
source_script: scripts/local-llm/qflix-rea.ps1
source_variable: "$Script:NoiseFindingRules"
prompt_function: Get-SystemPrompt
# The prompt sentence the clauses below are carved out of. C-07 splits the text
# between this marker and `prompt_stop_marker` on ';' and demands every segment
# be claimed by exactly one class.
prompt_start_marker: "NON-ACTIONABLE NOISE you must NEVER report"
prompt_stop_marker: "CONVERSELY"

classes:
  - id: plex-client-abort-stream-write
    title: Plex client-abort stream write
    rx: '(?i)(caught exception trying to stream file|protocol is shutdown \(ssl|ssl[-: ]?protocol[-: ]?shutdown)'
    field: null
    prompt_clause: "Plex client-abort stream writes"
    why: >-
      A viewer closed or seeked mid-stream and the TLS session went away while
      Plex was writing a chunk. Proven client-side: the identical error fires on
      PhotoTranscoder poster JPEGs, which have no transcode pipeline at all.
    added: 2026-07-28

  - id: plex-nat-pmp-upnp
    title: Plex NAT-PMP / UPnP port-mapping chatter
    rx: '(?i)(nat-?pmp|upnp)\b.*(not supported|unsupported|no gateway|failed)'
    field: null
    prompt_clause: "Plex NAT-PMP / UPnP / port-mapping"
    why: Upstream gateway does not support port mapping. External and cosmetic.
    added: 2026-07-28

  - id: tdarr-express-undefined-includes
    title: Tdarr express-route TypeError (reading 'includes')
    rx: '(?i)cannot read properties of undefined \(reading ''includes''\)'
    field: null
    prompt_clause: "tdarr unhandled express-route errors"
    why: >-
      Unhandled express route error in Tdarr_Server/srcug/api/servers.js.
      Upstream Tdarr bug, non-fatal: verified live 2026-07-28 with the server at
      NRestarts=0 and 20 days uptime while these were firing. This is the exact
      finding qwen3-coder:30b reported anyway on 2026-07-28, proving a prompt
      alone cannot hold a floor.
    added: 2026-07-28

  - id: tdarr-worker-not-a-function
    title: Tdarr worker<N> is not a function
    rx: '(?i)worker\d*\b.*is not a function'
    field: null
    prompt_clause: "tdarr unhandled express-route errors"
    why: Same upstream Tdarr express-route bug as tdarr-express-undefined-includes.
    added: 2026-07-28

  - id: tdarr-wasm-oom
    title: Tdarr Mediainfo probe WASM out-of-memory
    rx: '(?i)(webassembly\.instantiate\(\):\s*out of memory|wasm memory|wasm-memory-exhausted)'
    field: null
    prompt_clause: "WASM out-of-memory failure"
    why: >-
      Ruled PERMANENTLY UNFIXABLE 2026-07-28 — Tdarr's bundled Node rejects the
      only viable mitigation (--disable-wasm-trap-handler) and crash-loops the
      server if forced, and ulimit -v 10GB vs the WASM runtime's 8GB guard has
      no other lever on this box. Tracked by the tdarr-scanner Kuma canary, not
      by paging the operator on every occurrence.
    added: 2026-07-28

  - id: mediainfo-failure
    title: Error running MediaInfo
    rx: '(?i)error running mediainfo'
    field: null
    prompt_clause: "Error running MediaInfo"
    why: Direct consequence of tdarr-wasm-oom; same 2026-07-28 ruling applies.
    added: 2026-07-28

  - id: tdarr-mediainfo-result-fragment
    title: Tdarr_Server MediaInfo child-process stderr/result JSON fragments
    rx: '(?im)tdarr_server - (stderr:\s*\{\s*$|\{ result: ''error'', error: \{\} \})'
    field: excerpt
    prompt_clause: "Error running MediaInfo"
    why: >-
      The THIRD face of the tdarr-wasm-oom event, paged 2026-08-16 once the
      rest of the tdarr section went quiet: Tdarr_Server logs the dead
      MediaInfo child process stderr as a JSON object, which the collector's
      per-line [ERROR] grep splits into a bare "stderr:  {" opener line and a
      "result: error, error: empty" fragment line - measured in lockstep with
      the "Error running MediaInfo" lines from the same runs (6/2/2 counts,
      same dates), never independently. Same 2026-07-28 permanently-unfixable
      ruling, same tdarr-scanner canary ownership. Excerpt-scoped and
      anchored to Tdarr_Server plus the exact EMPTY shapes: a stderr line
      carrying content after the brace, or a result object with a non-empty
      error payload, matches neither alternative and still pages.
    added: 2026-08-16

  - id: plex-post-reap-scan
    title: Plex "Failed to create parent iterator" after a reap
    rx: '(?i)failed to create parent iterator'
    field: null
    prompt_clause: "Failed to create parent iterator"
    why: >-
      Expected trailing edge of qflix-reaper's add-date retention deleting a
      whole series directory out from under a library scan (e.g. Fargo,
      arrId=225, reaped 2026-07-22). Plex noticing the directory it was about
      to scan is gone, not a fault. THE WINDOW IS 45 DAYS, NOT 60 - restated
      because the prose copies of this number have drifted before. Single
      source of truth is DEFAULT_THRESHOLD_DAYS in scripts/maint/qflix-reaper.py,
      moved 60 -> 45 by operator decision 2026-07-31; the on-box systemd
      drop-in carries only the arming flags and passes no --threshold-days, so
      that repo constant IS the live window (re-verified read-only against the
      box 2026-08-03). The four tracked prose copies that still said 60 were
      corrected 2026-08-03 and, where possible, made incapable of rotting
      again: the --threshold-days help string now interpolates %(default)s
      from the constant rather than restating it, and the reaper docstring,
      the systemd unit Description and the torrent-janitor docstring no longer
      name a number at all. The 60s that REMAIN in the tree are historical and
      correct: Maintainerr's own rule really was 60 days (scripts/configure/
      27b, manifest/apps.yaml) and the 2026-05-07 design spec records what was
      true when it was written.
    added: 2026-07-28

  - id: external-indexer-5xx-html
    title: Cloudflare / nginx error-page HTML relayed from an EXTERNAL indexer
    rx: '(?im)(cloudflare.{0,80}(ray id|error 5\d\d)|ray id:\s*[0-9a-f]{8,}|<center>nginx(?:/[\d.]+)?</center>|^\s*error code:\s*52\d\b)'
    field: null
    prompt_clause: "nginx error-page HTML returned to an *arr from an EXTERNAL indexer/proxy"
    why: >-
      Transient upstream hiccup on someone else's server, not a fault in our
      stack. Deliberately NOT a bare "5xx" or "error" term — that would also hit
      our own services' genuine 5xx responses.
      WIDENED 2026-08-18 to Cloudflare's BARE error body. Cloudflare serves a
      minimal page whose entire content is the single line "error code: 522",
      with no ray id and no "cloudflare" token anywhere in it — so all three
      original alternatives missed it, and prowlarr's 522s from Tokyo Toshokan
      paged even though this class's own prompt clause already says "Cloudflare
      5xx (52x)" in so many words. That is exactly the
      prompt-asks-but-rule-does-not-enforce shape this file exists to catch,
      found in the live 2026-08-17 REA run. The new alternative is LINE-ANCHORED
      because every log line our own stack emits carries a timestamp or level
      token first, so a bare body line can only be a relayed third-party
      response.
    added: 2026-07-29

  - id: indexer-severity-field-echo
    title: Indexer response echoing its own "severity":"error" JSON field
    rx: '"severity"\s*:\s*"error"'
    field: null
    prompt_clause: 'indexer responses that merely echo a `"severity": "error"` JSON field'
    why: >-
      Part of the indexer's normal response schema. Scoped to the exact quoted
      JSON key:value shape so a genuine log line that mentions severity near the
      word error in prose still pages.
    added: 2026-07-29

  - id: bare-stack-continuation
    title: Bare stack-trace continuation fragment with no root error
    rx: '(?ims)\A(?!.*(?:^\s*[A-Za-z][\w.]*(?:Exception|Error)\b\s*:|Traceback \(most recent call last\)|\[ERROR\]|ERROR\s*[-:])).*(?:^\s*at\s+\S|end of inner exception stack trace)'
    field: excerpt
    prompt_clause: "bare stack-trace CONTINUATION fragments"
    why: >-
      .NET-style `   at Namespace.Class.Method()` frames and the boilerplate
      "End of inner exception stack trace" marker with NOTHING in the same
      excerpt that looks like a real exception header. Scoped to the EXCERPT
      field only: a model's own prose summary almost always contains the words
      error/exception regardless of the raw log, which would poison the
      negative lookahead into never firing.
    added: 2026-07-29

  - id: plex-client-profile-extra
    title: Plex ClientProfileExtra "missing or invalid type parameter"
    rx: '(?i)clientprofileextra:\s*missing or invalid type parameter'
    field: null
    prompt_clause: 'Plex "ClientProfileExtra: missing or invalid type parameter"'
    why: >-
      PMS logs this at ERROR level, ~5x per transcode-decision request, when a
      client profile-extra directive block carries a directive it cannot read.
      130 ERROR lines corpus-wide 2026-08-03, all under [Req#*/Transcode],
      against ZERO "Transcoder terminated" / "Transcode failed" / "Error opening"
      lines in the whole PMS log - playback is unaffected, so it is not an
      operator page. NOT unconditionally benign: log coverage is continuous
      Jun 29 - Aug 03 with no rotation gap, and the class was at ZERO for eleven
      consecutive days (Jul 22 - Aug 01) then 65 on Aug 02 and 45 on Aug 03
      against flat total log volume. That is an ONSET, and this table has no rate
      dimension, so the rate signal is carried OUTSIDE this rule - by the
      collector's "# collector-suppressed:" census line and by follow-up FU-1
      (an on-box class-rate canary). If a member reports a device that will not
      play, UN-SUPPRESS THIS CLASS FIRST. Scoped to the exact message so a
      different ClientProfileExtra failure still pages.
    added: 2026-08-03

  - id: plex-metadata-agent-pseudo-identifier
    title: Plex metadata-agent lookup on a PSEUDO-identifier (library / iva)
    rx: '(?i)unable to find metadata agent provider for identifier\s+\W?(?:library|iva)\b'
    field: null
    prompt_clause: "naming the PSEUDO-identifiers 'library' or 'iva'"
    why: >-
      MetadataAgentManager/getAgent resolving an identifier that is a SCOPE name,
      not an agent name. Proven, not assumed: identifier 'library' resolves to 4
      metadata_items rows all at library_section_id = -2 (Plex's synthetic
      PlayQueue pseudo-section), and 'iva' to 327 iva:-prefixed rows with NULL
      library_section_id (Plex Discover / online catalog). All four real
      libraries carry correct agents (2 QFlix - TV = tv.plex.agents.series,
      4 QFlix - Movies and 5 QFlix - Anime Movies = tv.plex.agents.movie,
      6 QFlix - Anime = tv.plex.agents.series), so no metadata is at risk.
      Both identifiers are enumerated EXPLICITLY rather than left unanchored: the
      same message naming a real provider (com.plexapp.agents.*, tv.plex.agents.*)
      is a genuine config break and MUST still page - verified this rx does not
      match those. 'iva' is included because keying on 'library' alone would have
      re-paged on the identical non-issue (it fired Jul 11 and Jul 21).
    added: 2026-08-03

  - id: arr-parsing-no-matching-title
    title: Sonarr/Radarr ParsingService "No matching series/movie <title>"
    rx: '(?i)\|Debug\|ParsingService\|No matching (?:series|movie)\b'
    field: null
    prompt_clause: 'Sonarr/Radarr ParsingService "No matching series"/"No matching movie"'
    why: >-
      STRUCTURAL, not obscurity: the *arr pulls an indexer's FULL recent RSS feed
      (206-522 items per sync) and filters locally, so every title outside a
      36-title library logs this at Debug. All 897 such lines in
      sonarr.debug.0.txt are level=Debug; ZERO are Error. The 2026-08-03 F3 alert
      reported one at severity=error. Cross-referenced all 36 library titles
      against the 197 distinct unmatched titles: ZERO real overlap (the single
      apparent hit was a substring collision), and the matcher demonstrably works
      - South Park and Stranger Things appear in the logs and NEVER in the
      unmatched list. So this is not a series-list or root-folder regression.
      Do NOT justify this rule as "shows nobody subscribes to": the top unmatched
      titles are One Piece, House of the Dragon and My Hero Academia, which are
      mainstream - the invariant is feed-size vs library-size, not popularity.
      Sonarr writes "No matching series <title>" and Radarr "No matching movie
      for titles '<title>'"; both shapes are covered, verified against live log
      lines 2026-08-03.
      ANCHORED TO LEVEL+LOGGER, not to the phrase. An earlier draft matched the
      bare phrase with a (?!folder|files) lookahead and field: null, which meant
      it ran against signature+summary+excerpt JOINED - so a model's PROSE merely
      containing "no matching series" suppressed the whole finding, including a
      genuine |Error|ImportApprovedEpisodes| disk-quota import failure (proven
      under .NET 2026-08-03). It also missed the plural "no matching series
      FOLDERS on disk" because the lookahead wrote folder\b with no s?. The
      "|Debug|ParsingService|" anchor costs ZERO real suppression and fixes both:
      measured read-only on the box 2026-08-03, 155130 of 155130 "No matching
      series" and 117585 of 117585 "No matching movie" lines carry exactly that
      level+logger, with ZERO occurrences at any other level or logger anywhere
      in the corpus. The genuine Error lines "no matching series FOLDER on disk"
      and "no matching series FILES were readable" carry a different logger and
      now cannot match at all, rather than relying on a lookahead.
    added: 2026-08-03

  - id: arr-release-rejected-unknown-title
    title: Sonarr/Radarr DownloadDecisionMaker "[Permanent] Unknown Series/Movie"
    rx: '(?i)\|Debug\|DownloadDecisionMaker\|.*\[Permanent\] Unknown (?:series|movie)\b'
    field: null
    prompt_clause: 'DownloadDecisionMaker "[Permanent] Unknown Series/Unknown Movie" rejections'
    why: >-
      The DownloadDecisionMaker half of the same by-design event - 29,146
      "[Permanent] Unknown Series" and 43,363 "[Permanent] Unknown Movie"
      rejections, all level=Debug. Anchored to "[Permanent] Unknown
      Series|Movie" and NOT to "[Permanent]" alone, so every other rejection
      reason (quality, size, custom format, "matches an alias for series with
      TVDB ID") still reaches a model. Shares prompt segment 10 with
      arr-parsing-no-matching-title - the same precedent as segment 4 (two tdarr
      express-route rules) and segment 6 (wasm-oom + mediainfo-failure).
      ANCHORED TO LEVEL+LOGGER for the same reason as its twin above: with
      field: null this rx runs against signature+summary+excerpt JOINED, so the
      bare "[Permanent] Unknown Series" phrase appearing in a model's PROSE was
      enough to suppress an unrelated genuine fault (proven under .NET with a
      real |Error|SeriesService|database is locked finding). Measured read-only
      2026-08-03: 101183 of 101183 "[Permanent] Unknown Series" and 117582 of
      117582 "[Permanent] Unknown Movie" lines carry "|Debug|DownloadDecisionMaker|",
      zero at any other level or logger, so the anchor costs no real suppression.
      The `.*` between logger and reason is deliberately NOT (?s) - it may not
      cross a newline, so a Debug rejection line pasted ABOVE an unrelated error
      line in the same excerpt does not drag the error down with it.
    added: 2026-08-03

  - id: arr-debug-only-excerpt
    title: Finding whose ONLY evidence is *arr Debug-level lines
    rx: '(?ims)\A(?!.*(?:\|\s*(?:Error|Fatal|Warn(?:ing)?|Critical)\s*\||ERROR\s*[-:]|\[ERROR\]|Traceback \(most recent call last\))).*\|Debug\|'
    field: excerpt
    prompt_clause: "any finding whose ONLY evidence is *arr Debug-level lines"
    why: >-
      STRUCTURAL backstop for the severity misclassification F3 exposed, not a
      phrase rule. REA takes `severity` verbatim from the model, and the prompt's
      standing "ignore unrelated debug lines" instruction was violated anyway by
      qwen2.5-coder:7b - a prompt cannot hold this floor. Fires only when the
      excerpt carries an *arr NLog |Debug| level token and NO error-level
      evidence anywhere in it, so it declines findings with no error-level
      evidence rather than silencing a log level.
      THE GUARD IS DELIBERATELY WIDER THAN *arr NLog. An earlier draft wrote the
      lookahead as \|(?:Error|Fatal|Warn)\| - unpadded, pipe-delimited, *arr-only
      - while the rule itself eats a finding of ANY format. Bazarr ships inside
      the SAME arr_logs section and writes PADDED tokens: `cat -A` on the box
      2026-08-03 gives "|ERROR   |" and "|WARNING |", neither of which satisfied
      that lookahead ("Warning" was not even in the alternation), so an excerpt
      pairing a genuine Bazarr ERROR with one *arr Debug line was silently eaten.
      Same for Plex's "ERROR - " and a Python "Traceback (most recent call
      last):". The alternation now covers padded pipe tokens, Warning, Critical,
      ERROR-dash/colon, [ERROR] and Traceback - the same header set
      bare-stack-continuation already uses. Widening a NEGATIVE lookahead can
      only ever suppress LESS, so this direction is fail-open by construction.
      Scoped to `excerpt` for the
      same reason as bare-stack-continuation: a model's prose summary almost
      always contains the word "error", which would poison the negative
      lookahead into never firing. After the arr_logs collector rebuild stops
      shipping Debug lines its live target is source #14 (vlogs), whose LogsQL
      term filter can still return a Debug line whose message text contains the
      word "error". MUST SHIP WITH THE COLLECTOR FIX - shipped alone it would eat
      100% of today's arr_logs findings and convert a visible false page into
      silence.
    added: 2026-08-03

  - id: plex-credits-detection-chatter
    title: Plex CreditsDetectionManager marker-scan retry chatter
    rx: '(?i)\[creditsdetectionmanager(?:\]|/).{0,80}?(?:incomplete marker attributes|bufferinglinereader: failed to read line|credits detection for item \d+ has failed too many times)'
    field: null
    prompt_clause: 'Plex CreditsDetectionManager marker-scan chatter'
    why: >-
      The credits/intro marker scanner reporting its own retryable read
      failures. Enrolled here 2026-08-03 to close a TWIN-SURFACE GAP, not
      because the class is new: the plex_errors collector had been dropping
      every line containing the bare substring "CreditsDetectionManager" since
      2026-07-25, uncounted and with NO rule in this file, while a comment in
      that collector asserted each of its exclusions "has a TWIN rule in
      manifest/rea-noise-classes.yaml". That assertion was false for this class
      and for plex-unknown-metadata-type-folder, and together they were 897 of
      the 1051 fresh ERROR lines dropped on 2026-08-03 - 86% of the section's
      suppression was invisible to CI, which is precisely the two-policy-surface
      failure this file exists to prevent.
      DELIBERATELY NARROWER THAN THE COLLECTOR GREP WAS. The bare subsystem name
      matched five distinct message shapes; this rx enumerates only the three
      benign high-volume ones (measured 2026-08-03: 85 "incomplete marker
      attributes", 85 "BufferingLineReader: failed to read line", 20 "credits
      detection for item N has failed too many times"). The other two -
      "Job failed: Scanner job failed" (4) and "Mis-matching media items
      detected" (6) - are NOT covered and still reach a model, because a failed
      scanner job is a plausible real fault and nothing proved otherwise. Any
      future ERROR naming this subsystem also still pages. Fail open.
      2026-08-27 AMENDMENT: one Job-failed VARIANT has since cleared the proof
      bar and moved to its own class (plex-credits-job-video-missing, below);
      Scanner job failed and Mis-matching media items still page, exactly as
      written here.
    added: 2026-08-03

  - id: plex-credits-job-video-missing
    title: 'Plex CreditsDetectionManager "Job failed: Video does not exist"'
    rx: '(?i)\[creditsdetectionmanager\]\s*job failed:\s*video does not exist'
    field: null
    prompt_clause: 'Plex CreditsDetectionManager "Job failed: Video does not exist" lines'
    why: >-
      A credits-marker job whose video was deleted or replaced out from under
      a scan already in flight. Paged the operator 2026-08-27 04:07; a
      dedicated investigation proved the class benign at the sibling-class
      proof bar: ALL 51 occurrences across 3+ weeks of rotated PMS logs and 6
      independent shows co-occur within seconds with a "No such file or
      directory" / "Failed to create parent iterator" scan line for the SAME
      title. ~29% are qflix-reaper retention deletes (the alerted instance:
      reaper deleted the two shows 9-20 SECONDS before the line, and the Plex
      DB read-only shows both items cleanly gone, no orphan); the rest are an
      *arr import/upgrade replacing an episode file mid-scan. No item ever
      repeats across days, nothing wedges, every affected show is either
      fully purged or healthy with valid files today. A marker job on a file
      that no longer exists cannot matter to a member. DELIBERATELY NOT
      anchored to the reaper hour - that would suppress only the 29% and keep
      paging the equally benign replace-race majority - and DELIBERATELY NOT
      a bare "Job failed": "Job failed: Scanner job failed" and "Mis-matching
      media items detected" remain unproven and still page per the sibling
      class above. NOTE FOR FUTURE RULES: PMS log timestamps are UTC, not
      box-local CEST - a rule keyed to a CEST offset misfires by two hours
      (measured against date -u during the investigation).
    added: 2026-08-27

  - id: plex-unknown-metadata-type-folder
    title: 'Plex "Unknown metadata type: folder" browse reply'
    rx: '(?i)unknown metadata type:\s*folder\b'
    field: null
    prompt_clause: 'Plex "Unknown metadata type: folder" replies'
    why: >-
      A client asked the PMS HTTP API about a folder-type item, for which Plex
      has no metadata class, and PMS logged the miss at ERROR level. Uniform
      shape - every one of the 697 fresh occurrences measured 2026-08-03 is
      "[Req#<id>] Unknown metadata type: folder" under a request tag, i.e. a
      normal browse response rather than a state fault. Highest-volume single
      class in plex_errors: 66% of all fresh ERROR lines on its own, which is
      why the collector reclaims its bytes at the input as well.
      Enrolled here for the same twin-surface reason as
      plex-credits-detection-chatter - see that class's `why`. Anchored to the
      exact "folder" type so an "Unknown metadata type: <anything-else>" still
      pages.
    added: 2026-08-03

  - id: bazarr-github-release-check-ratelimit
    title: Bazarr update-check rate-limited by the GitHub API
    rx: '(?im)^(?=.*(?:trying to get releases from github|morpheus65535/bazarr/releases))(?=.*(?:rate.?limit|http error))'
    field: excerpt
    prompt_clause: 'Bazarr "Error trying to get releases from Github" GitHub API rate-limit failures'
    why: >-
      Bazarr's updater polls the unauthenticated GitHub releases API, which is
      limited to 60 requests/hour PER IP. This is an Ultra.cc SHARED seedbox, so
      that quota is consumed by every other tenant on the same address - two
      Bazarr instances checking hourly could not exhaust it alone. The failure
      is therefore external and not ours to fix from inside the stack.
      COSMETIC IS PROVEN, NOT ASSUMED: all three Bazarr processes run with
      `--no-update` (verified live 2026-08-06 - bazarr2's ExecStart, its running
      argv, and bazarr-1's containerised argv all carry the flag), so the
      release list is display-only and Bazarr could not self-update even with a
      complete response. It is also self-correcting rather than a wedge -
      releases.txt was refreshed successfully at 23:51 the same evening the
      403s fired, i.e. the poll succeeds again as soon as the shared quota
      rolls over.
      AUTHENTICATION IS NOT AVAILABLE AS A FIX, which is why this is suppressed
      rather than engineered away: app/check_update.py builds the URL inline and
      calls requests.get(url, allow_redirects=True, timeout=15) with NO headers
      argument, and there is no token config field or environment variable
      anywhere in the Bazarr tree. The only lever would be patching that call
      site, and bazarr2-sync.timer re-matches bazarr2 to bazarr-1's version
      hourly, so such a patch is reverted by design. (A GitHub PAT would still
      buy real headroom for QFlix's OWN api.github.com callers - the lifecycle
      resolver in Tuesday.md:73 - which is a separate, unrelated change.)
      RX RESHAPED 2026-08-13, v2 2026-08-14 (was: anchored to the full Bazarr
      releases URL). The URL anchor was structurally dead: the arr_logs
      collector's norm() rewrites every URL to <url> before any model sees it,
      cut -c1-220 amputates the single-line traceback long before the URL
      appears, and on the vlogs path - which DOES deliver the URL intact - the
      models truncate their excerpt at "rate limit exceeded" anyway. Measured
      live: this class paged on 2026-08-13 with the rule present.
      The rx is two required lookaheads - updater marker AND rate-limit token -
      with three constraints the first (2026-08-13) reshape lacked, each
      closing a false-suppression hole the adversarial review demonstrated:
      field=excerpt (a model summary speculating "possible rate limiting" must
      not complete the pair for a ConnectionError finding); (?m)^ without (?s)
      (both tokens must share ONE excerpt line, so a benign updater line
      cannot borrow the token from a real 429 fault elsewhere in the excerpt);
      and markers that are Bazarr's verbatim updater text ("trying to get
      releases from github") or the path-anchored slug (.../bazarr/releases) -
      not inventable prose, not the bare repo slug. So a 403 against
      morpheus65535/bazarr/issues, api.github.com/rate_limit, or any other
      GitHub endpoint - including QFlix's own release-resolver traffic, where
      a silent rate-limit really would degrade version checks - still pages.
      v3 (same day): token B widened to (rate.?limit|http error), because the
      arr_logs collector's cut -c1-220 amputates the traceback - and with it
      "rate limit exceeded", at byte ~464 post-norm - from the ONE physical
      line Bazarr logs, so an arr_logs-sourced excerpt could never satisfy a
      rate-limit-only token (measured live: the 00:50 UTC 403 shipped as a
      suppressor-proof excerpt). "Http error." is check_update.py's marker
      for requests HTTPError SPECIFICALLY (verified in deployed source:
      ConnectionError logs "Connection Error.", Timeout logs "Timeout
      Error.", bare RequestException logs neither) and it survives the
      220-char cut beside the updater marker. The network-fault shapes
      (Connection Error, Timeout) still lack both B tokens and still page:
      a persistent one of those is a network fault worth seeing. An HTTP 5xx
      release-check failure is now suppressed along with the 403 - equally
      external and equally cosmetic on a --no-update install.
    added: 2026-08-06

  - id: tdarr-handbrake-binary-test
    title: Tdarr node binary self-test failing on the absent HandBrakeCLI
    rx: '(?is)\A(?!.*binary test \d+:\s*(?!handbrakepath\b)\S+ not working\b).*binary test \d+:\s*handbrakepath not working\b'
    field: excerpt
    prompt_clause: 'Binary test N: handbrakePath not working'
    why: >-
      The Tdarr node re-tests its configured binaries at every start (daily
      01:00 UTC restart cycle - 111 occurrences in Tdarr_Node_Log.txt measured
      2026-08-16) and HandBrakeCLI is absent AND uninstallable on this slot:
      ruled 2026-07-28, the same day every library health check was forced to
      ffmpegscan because handbrakescan is 100% dead here by design (see the
      tdarr-healthcheck history - it ran silently broken for 68 days).
      Permanent and cosmetic: no flow, no transcode and no health check
      references HandBrake. Anchored to handbrakePath SPECIFICALLY - a
      "Binary test N: ffmpegPath not working" line means the binary every
      transcode actually uses is broken, which is a REAL fault and must still
      page; the \d+ keeps the test number free so Tdarr renumbering its test
      sequence cannot resurrect the class.
      EXCERPT-SCOPED WITH A SIBLING LOOKAHEAD (adversarial review 2026-08-16,
      first shape was a bare field-null phrase match): both binary tests fire
      from the SAME startup self-test with an identical line template, and
      the tdarr collector uniq-collapses them into the same section, so a
      real ffmpegPath failure is structurally guaranteed to sit NEXT TO the
      benign handbrake line - exactly when a model bundles both into one
      excerpt, which a field-null rule would then eat whole. The negative
      lookahead declines the match when ANY other "Binary test N: <binary>
      not working" shares the excerpt, and excerpt scoping keeps a model
      prose summary from completing the match for an unrelated fault. Same
      hazard class the arr-parsing/arr-debug rules already paid down.
    added: 2026-08-16

  - id: seerr-plex-scan-tvdbid-collision
    title: Seerr Plex-scan UNIQUE constraint on media.tvdbId (multi-guid anthology)
    rx: '(?is)\A(?!.*unique constraint failed:\s*(?!media\.tvdbid\b)\S+).*unique constraint failed:\s*media\.tvdbid\b'
    field: excerpt
    prompt_clause: 'UNIQUE constraint failed: media.tvdbId'
    why: >-
      Jellyseerr's Plex full scan processes each guid a Plex item carries; an
      anthology show matched by the TMDB agent can carry SEVERAL tmdb guids
      that all resolve to one tvdbId. Proven live 2026-08-16: Plex item 7693
      "Monster (2022)" carries tmdb 113988 + 138807 + 225634 and tvdb 389492;
      seerr media row id 47 (tmdbId 113988, tvdbId 389492, status 5 =
      available) already exists, so the scan's insert for the sibling tmdb
      guids fails the UNIQUE index once per full scan. Nothing is broken for
      members - the item is tracked and available - and there is no local
      lever: the guid set comes from Plex's TMDB agent and the insert is
      upstream Jellyseerr code. Anchored to the media.tvdbId column so any
      OTHER Seerr SQLITE_CONSTRAINT (a different column or table would be a
      genuine schema/data fault) still pages - and, same adversarial-review
      finding as the handbrake rule above, excerpt-scoped with a sibling
      negative lookahead so an excerpt that ALSO carries a constraint
      failure on a DIFFERENT column pages instead of being eaten together
      with the benign tvdbId line. Seerr reaches REA only through the vlogs
      source, whose 25-row batch can co-land multiple distinct constraint
      failures from one scan burst.
    added: 2026-08-16

  - id: buildarr-unsupported-plex-notification
    title: buildarr "Unsupported remote notification connection ... PlexServer" daily warning
    rx: '(?i)unsupported remote notification connection\b.{0,60}implementation .?plexserver.?, ignoring'
    field: null
    prompt_clause: 'Unsupported remote notification connection'
    why: >-
      buildarr-radarr logs this at WARNING on every daily 04:30 run (4 lines
      per run - main + anime radarr, two connections) because the plugin
      cannot manage the *arr's Plex-notification connection type
      ("implementation PlexServer") and skips it. Upstream limitation,
      cosmetic by construction: buildarr IGNORES the connection, so radarr's
      own Plex notification config is left exactly as it was and keeps
      working. Continuous in buildarr.err since at least 2026-08-02; surfaced
      as a page 2026-08-16 only because the config_sync collector gained its
      FRESH_CUTOFF filter that same day and the class became the sole fresh
      content of the section (models mislabel WARNING as error - the F3
      severity lesson - so a prompt alone cannot hold this floor). Anchored
      to the PlexServer implementation specifically: the same buildarr
      message naming any OTHER implementation is a new, undiagnosed sync gap
      and still pages.
    added: 2026-08-16

  - id: plex-network-service-shutdown
    title: Plex Network Service advertiser socket cancelled during shutdown
    rx: '(?im)^(?=.*network service)(?=.*advertis)(?=.*(?:operation canceled|abandoning))'
    field: excerpt
    prompt_clause: 'Network Service: Error in advertiser handle read'
    why: >-
      PMS logs this at ERROR while tearing down its GDM/DLNA announce socket on
      the way out. SHUTDOWN IS PROVEN, NOT ASSUMED: it appears exactly ONCE in
      each of the five rotated logs (Plex Media Server.1 through .5) and ZERO
      times in the live one, it is the LAST error line in every file, and in
      every case the next lines are "JobManager: Could not find job for handle",
      "Killing process: Plex EAE Service" and "Network Service: Abandoning
      advertise socket" - the log ends there because the server stopped. errno
      125 is ECANCELED and the line carries socket=-1, so the handle was closed
      locally rather than failing against the network. Scoped to the
      CANCELLATION specifically and to the excerpt field: an advertiser error
      with a different cause (98/EADDRINUSE, a refused connection) carries
      neither token, is not a teardown, and still pages.
    added: 2026-08-18

  - id: bazarr-signalr-reconnect
    title: Bazarr SignalR client dropping and re-establishing its *arr subscription
    rx: '(?i)bazarr signalr client for \w+ connection as been lost'
    field: null
    prompt_clause: 'SignalR client for Sonarr/Radarr connection as been lost'
    why: >-
      Bazarr subscribes to Sonarr/Radarr over SignalR for live library events.
      When the *arr restarts, the subscription drops and Bazarr reconnects by
      itself. SELF-HEALING IS PROVEN, NOT ASSUMED: bazarr2.err carries 38
      "connection as been lost" lines against 55 "is connected" lines, and every
      single loss is followed by a matching connect within 20-35 seconds. The
      losses also CLUSTER - 2026-08-10 13:04-13:12 and 2026-08-17 13:04-13:08
      box-local, which is 11:04-11:12 UTC, inside the Monday maintenance window
      (lib/window.py) - so the cause is our own scheduled *arr restarts and not
      an unexplained network fault. Anchored to Bazarr's verbatim "as been lost"
      (the upstream typo, signalr_client:159 for Sonarr and :226 for Radarr),
      which a model paraphrasing the line into "has been lost" cannot invent, so
      this rule can only fire on raw log text.
      KNOWN BLINDNESS, accepted (council 2026-08-18): with no pairing
      dimension a PERMANENT loss is suppressed identically to a transient
      one - no rule over raw text can see the ABSENCE of a later reconnect
      line, so no carve-out is promised. Bounded: a wedged SignalR client
      only loses LIVE event delivery; Bazarr's scheduled sync/search
      continues, and a genuinely wedged Bazarr surfaces through its own
      non-suppressed errors.
    added: 2026-08-18

  - id: arr-indexer-unavailable-backoff
    title: External indexer unreachable, plus Prowlarr's own 429 backoff for it
    rx: '(?i)(indexer is disabled till .{0,60}due to recent failures|indexer.s server is unavailable\. try again later)'
    field: null
    prompt_clause: 'external indexer unavailability relayed by Prowlarr'
    why: >-
      Two halves of one external event. Prowlarr cannot reach a third-party
      indexer, logs "Indexer's server is unavailable. Try again later", and
      disables it temporarily; Sonarr/Radarr then receive Prowlarr's own 429
      carrying description="Indexer is disabled till <time> due to recent
      failures." for as long as the backoff lasts. Neither half is a fault in
      our stack and neither needs an operator.
      TRANSIENT IS PROVEN, NOT ASSUMED, and that is why this is suppressed
      rather than fixed by deleting the indexer: Tokyo Toshokan (prowlarr id 38)
      has returned Cloudflare 522 intermittently since 2026-05-25 - 2,644
      failure lines against 23,009 total, a ~11.5% rate on scattered days - so
      it works the other ~88% of the time and is a live anime source. Contrast
      tvsubtitles, disabled outright on 2026-08-14 because its domain had gone
      SERVFAIL permanently: dead gets removed, flaky gets suppressed. The
      backoff also clears itself - prowlarr's /api/v1/indexerstatus was already
      EMPTY minutes after the 429s that produced the 2026-08-17 page.
      Anchored to Prowlarr's two verbatim strings. A bare "429.TooManyRequests",
      or a 5xx with no such description, is NOT covered and still pages - which
      keeps a rate-limit against one of OUR OWN services reportable.
    added: 2026-08-18

  - id: prowlarr-cardigann-retry-5xx
    title: Prowlarr Cardigann per-request RETRY after a transient indexer 5xx
    rx: '(?is)\A(?!.*(?:\|\s*(?:Error|Fatal|Critical)\s*\||\[ERROR\]|ERROR\s*[-:]|Traceback \(most recent call last\))).*\|Warn\|[^|\n]{0,40}\|Request for [^\n]{0,120}? failed with status (?:5\d\d|InternalServerError|BadGateway|ServiceUnavailable|GatewayTimeout)\. Retrying in'
    field: excerpt
    prompt_clause: 'Prowlarr Cardigann "Request for <indexer> failed with status 5xx. Retrying in Ns" retry warnings'
    why: >-
      The RETRY half of a transient third-party 5xx, deliberately NOT the
      terminal one. Prowlarr's Cardigann client logs one Warn per attempt -
      "Request for Tokyo Toshokan failed with status 522. Retrying in
      1.8521098s." - and then succeeds. Measured read-only on the box
      2026-08-20: Tokyo Toshokan (prowlarr indexerId 38, enable=1) logged 24-38
      of these PER DAY while serving ~92 SUCCESSFUL queries per day through
      2026-08-20 01:33Z, and the TERMINAL line ("Unable to connect ...
      Indexer's server is unavailable. Try again later.") ran 0-3/day and was
      ZERO on both 2026-08-19 and 2026-08-20. So the retry line carries no
      information about indexer health on its own; only a SUSTAINED terminal
      unavailable rate is actionable, and that is a different string already
      owned by arr-indexer-unavailable-backoff (segment 20). This table has no
      rate dimension, the same accepted limit plex-client-profile-extra
      records.
      ANCHORED TO THE RETRY STRING SO THE TERMINAL ONE CANNOT MATCH. Both
      lines are |Warn| from the same logger and both name the same indexer, so
      a level+logger anchor alone would have eaten the actionable half.
      "Request for <indexer> failed with status <code>. Retrying in" occurs on
      the retry line and nowhere else - verified 2026-08-20 by replaying this
      rx over every |Warn| line in every non-debug prowlarr log (5,829 lines):
      2,016 retry lines matched, and of the 306 terminal "Indexer's server is
      unavailable" lines ZERO matched, because the terminal line instead reads
      "Unable to connect to <indexer> at [<url>]. ... HTTP request failed:
      [522:522] [GET] at [<url>]" and never carries "Retrying in".
      THE STATUS TOKEN IS NOT ALWAYS NUMERIC, which the first version of this
      rx got wrong. Prowlarr renders HttpStatusCode by NAME for the codes .NET
      has an enum member for and only leaves the bare number for the ones it
      does not (Cloudflare's 520/522/523/525 have no enum member). Measured
      read-only 2026-08-20 across all prowlarr logs: 522=2640,
      InternalServerError=194, ServiceUnavailable=172, BadGateway=144,
      525=75, GatewayTimeout=61, 520=9, 523=3 - so `5\d\d` alone was blind to
      571 lines, i.e. 17% of the class walked straight past the rule and could
      page. The four named codes are enumerated explicitly rather than matched
      as a loose \w+ so that a NON-5xx name (Unauthorized, Forbidden,
      NotFound - an indexer whose credentials or definition broke, which IS
      actionable) still pages.
      THE LOGGER NAME IS DROPPED, DELIBERATELY. The first version anchored
      \|Warn\|Cardigann\| and that was live-wrong: prowlarr names the logger
      after the indexer implementation, so definition-driven indexers log
      under Cardigann but natively-implemented ones log under their own class.
      Measured 2026-08-20: 3,168 retry lines under Cardigann and 130 under
      Knaben ("...|Warn|Knaben|Request for Knaben failed with status 522.
      Retrying in ..."), and the Knaben half was 100% unsuppressed. Enumerating
      logger names would just re-open the same hole the next time an indexer
      moves to a native implementation, and recording Knaben as an "accepted
      residual" would be recording a KNOWN page as acceptable. So the rx keeps
      the NLog field SHAPE - \|Warn\|<one pipe-free field>\| - which still pins
      level=Warn and still forbids the message from being prose a model wrote,
      but takes the logger token as a wildcard. The message template carries
      all the specificity: "Request for ... failed with status ... Retrying in"
      appears on no other line in 5,829 |Warn| lines.
      WRITTEN AGAINST WHAT THE MODEL SEES, NOT THE RAW LOG. This class reaches
      REA only through the arr_logs Warn block, which collapses the timestamp
      to a bare date, pipes through norm() and cuts at 200 chars, so the
      delivered text is "<date>|Warn|Cardigann|Request for <indexer> failed
      with status 522. Retrying in 1.85...s." (the collector also prefixes
      "[<path>] " and a uniq -c count, which the leading .* absorbs) - every
      token this rx needs
      survives (measured by replaying that exact pipeline against the live
      file, 2026-08-20). It needs NO url: the message names the indexer, not a
      url, so the norm() url-rewrite that left the first bazarr rule
      structurally dead cannot reach it. The vlogs path never carries this
      line at all - its LogsQL filter wants ERROR/error/fatal/exception and
      the retry line has none of those words.
      Excerpt-scoped with a leading negative lookahead for any error-level
      token, so a model that bundles these Warn lines with a genuine |Error|
      line pages instead of being silenced. Widening that lookahead can only
      ever suppress LESS, so the direction is fail-open by construction.
    added: 2026-08-20

  - id: plex-orphaned-webhook-delivery
    title: Plex notification delivery to an ORPHANED Discord webhook (never 2xx)
    rx: '(?is)\A(?!.*(?:\|\s*(?:Error|Fatal|Critical)\s*\||\[ERROR\]|ERROR\s*[-:]|Traceback \(most recent call last\)))(?!.*webhook: error delivering payload to (?!\S*/1177487639654441000/)\S).*webhook: error delivering payload to \S*/1177487639654441000/'
    field: excerpt
    prompt_clause: 'Plex "Webhook: Error delivering payload" failures against the orphaned Discord webhook'
    why: >-
      A Plex webhook target that no longer belongs to anything. PMS posts every
      library/playback notification to a Discord webhook created in Nov 2023
      and Discord rejects all of them: 214 hits in the audit window, HTTP 400
      on every one, daily and unbroken, and across every rotated PMS log back
      to 2026-07-27 the tally is 746x 400, 42x 429 and ZERO 2xx. It has never
      succeeded once in the recorded history of this box.
      CAUSE IS UPSTREAM AND UNFIXABLE FROM HERE: Plex posts the notification as
      a multipart form field named `payload` and Discord's webhook API accepts
      only `payload_json`, so no setting on this box changes the outcome. The
      target is referenced NOWHERE in the QFlix tree or on the box - QFlix's
      own alerts go through a DIFFERENT hook and notify.log confirms live
      delivery on that one - so nothing depends on this. The fix is to delete
      the webhook at plex.tv, which is an owner action off-box; until then the
      line is pure noise.
      ANCHORED TO THE ORPHANED WEBHOOK ID, not to "webhook" and not to Discord
      generally, so a delivery failure against any OTHER webhook target is a
      real integration break and still pages. Only the routing ID is written
      here - the url also carries a secret token, which is deliberately absent
      from this file and from the rx. When the hook is deleted this class goes
      to zero and the rule goes dead, which is the correct end state.
      WRITTEN AGAINST WHAT THE MODEL SEES, NOT THE RAW LOG. PMS logs this at
      WARN ("<ts> [<thread>] WARN - Webhook: Error delivering payload to
      <url>: 400"), and the plex_errors collector greps " ERROR - " only, so
      that source can never deliver it. The ONLY path is vlogs, whose LogsQL
      term filter catches the bare word "Error" inside "Error delivering
      payload" and returns the raw _msg with the url INTACT - no norm(), no
      cut - at ~140 chars, comfortably inside a model's 300-char excerpt
      budget. Verified read-only against the live vlogs query 2026-08-20.
      Excerpt-scoped with a SIBLING negative lookahead, the same shape as
      tdarr-handbrake-binary-test and seerr-plex-scan-tvdbid-collision: if the
      excerpt also carries a delivery failure for a DIFFERENT webhook target,
      this rule declines and the whole finding pages. A model that paraphrases
      the url away loses the anchor and pages too - fail open, deliberately.
      IT ALSO CARRIES THE ERROR-LEVEL GUARD, added on review 2026-08-20 after
      the first version shipped with the sibling lookahead ONLY. That was a
      hole, not a nitpick: the sibling lookahead asks "is any OTHER webhook
      mentioned", so an excerpt holding this benign WARN line PLUS an
      unrelated real fault - e.g. plex_errors' "<ts> [<tid>] ERROR - Unknown
      system error -122: Disk quota exceeded" - satisfied the rule and the
      WHOLE finding was suppressed. Reproduced in both engines and re-run
      after the fix: bundled excerpt now declines under Python re AND .NET,
      while all 997 orphan-webhook lines on the box still suppress when they
      arrive alone. The guard is verbatim the one prowlarr-cardigann-retry-5xx
      carries; keeping the two byte-identical is deliberate, so a future
      widening is one edit applied to both rather than a drift.
      KNOWN RESIDUAL, measured not assumed: that guard recognises the
      *plex_errors* raw shape (" ERROR - "), the *arr NLog shape (|Error|) and
      a python traceback, but NOT the vlogs row shape, where scripts/mcp/logs.py
      strips the level token out of _msg and ships it as a separate field, so a
      co-quoted vlogs error reads "level":"ERROR" and trips nothing. Left alone
      on purpose: this guard string is shared verbatim with the cardigann rule
      AND mirrored into the ps1 rule table, and the 2026-07-29 / 2026-08-06
      failures were both "one policy surface changed, the others not". Widening
      it belongs in one commit that touches every copy - filed, not smuggled.
    added: 2026-08-20

  - id: arr-cloud-news-fetch-timeout
    title: '*arr ServerSideNotificationService cloud-news poll timeout'
    rx: '(?i)serversidenotificationservice\|?\s*failed to retrieve notifications'
    field: null
    prompt_clause: '*arr ServerSideNotificationService "Failed to retrieve notifications" cloud-news poll timeouts'
    why: >-
      ServerSideNotificationService is the *arr polling ITS VENDOR''S cloud
      (services.sonarr.tv / services.radarr.video / services.prowlarr.com) for
      in-app announcement banners - nothing on this box, nothing a member sees,
      nothing the operator can fix. Verified in the prowlarr debug log
      2026-08-25: the Error is "System.Net.WebException: Http request timed
      out" against that fetch, and prowlarr + radarr both logged it in the
      SAME minute (2026-08-22 03:38) - one upstream network blip, two pages.
      The *arr retries on its own schedule and the banner content is cosmetic
      even when the fetch never succeeds. ANCHORED TO THE LOGGER NAME, not to
      "failed to retrieve" generally, so a real notification-delivery failure
      (a different logger) still pages; a model that paraphrases the logger
      away loses the anchor and pages too - fail open, deliberately.
    added: 2026-08-25

  - id: arr-discord-notify-post-failure
    title: '*arr Discord notifier "Unable to post payload" delivery failure'
    rx: '(?i)(discordproxy\|\s*unable to post payload|unable to post payload\s+nzbdrone\.core\.notifications\.discord|unable to send on[a-z]+ notification to:\s*discord)'
    field: null
    prompt_clause: '*arr Discord notifier "Unable to post payload" delivery failures'
    why: >-
      The *arr in-app Discord notifier (sonarr connection "Discord Webhook",
      radarr "Discord") failing one OnImportComplete/OnGrab post. The target
      webhook is ALIVE - verified 2026-08-25 by GET on the configured url
      (HTTP 200, webhook object returned) minutes after the logged failure -
      so the failure mode is a transient Discord-side 429/400 during an
      import burst, not a broken integration. The import itself SUCCEEDED
      (the notifier fires after the fact); nothing in the pipeline depends on
      this post landing, and QFlix operator alerting rides a DIFFERENT
      webhook via Kuma with its own liveness coverage. DELIBERATE TRADE,
      recorded here: this class also suppresses a webhook that dies
      permanently later. Accepted because a dead notifier manifests to the
      operator directly - the import notices stop appearing in the channel -
      and a cosmetic convenience going quiet is not an audit-page. One
      underlying event produced FOUR of the seven fields in the 2026-08-25
      12:08 alert (four model-invented signature variants of the same line);
      the excerpt-level consensus merge fixes the multiplication, this class
      fixes the paging.
    added: 2026-08-25

  - id: bazarr-subsync-single-file
    title: Bazarr subsync single-file "unable to sync subtitles" failure
    rx: '(?i)unable to sync subtitles'
    field: null
    prompt_clause: 'Bazarr "unable to sync subtitles" single-file subsync failures'
    why: >-
      Bazarr''s post-download subsync step (audio-track alignment) failing on
      ONE file - "BAZARR unable to sync subtitles: <path>.srt". The srt it
      could not re-time is left in place and stays usable; sync is a quality
      polish, not delivery, and Bazarr''s own UI surfaces the per-file result.
      One occurrence in the entire live bazarr.log on 2026-08-25 (Lucky
      Strike 2026). No rate dimension in this table - a box-wide ffmpeg
      breakage would suppress here too - but that is the same accepted limit
      plex-client-profile-extra and prowlarr-cardigann-retry-5xx record, and
      a real ffmpeg breakage pages through the tdarr canaries long before a
      subtitle polish step notices.
      RX WIDENED THE SAME DAY it shipped: the first version anchored on
      "BAZARR unable to sync subtitles" - the raw-log form - and the very
      first live dry-run paged anyway because the model trimmed the leading
      "BAZARR" off the excerpt. The rule is the rule: write the rx against
      what the MODEL emits, not the log line, and prove it with a live run.
    added: 2026-08-25

  - id: prowlarr-flaresolverr-validation-transient
    title: Prowlarr FlareSolverr "Proxy validation failed" one-off
    rx: '(?i)flaresolverr\|?\s*proxy validation failed'
    field: null
    prompt_clause: 'Prowlarr FlareSolverr "Proxy validation failed" one-off validation errors'
    why: >-
      Prowlarr health-checking its FlareSolverr proxy and failing ONCE during
      a network blip. Verified 2026-08-25: the proxy is configured (id 1, tag
      2), the FlareSolverr PROCESS is alive on the box, and the only Error
      hit in the current log is 2026-08-22 03:39:17 - the SAME minute as the
      cloud-news poll timeouts on prowlarr and radarr and the radarr2 update
      check failure, i.e. one upstream blip wearing four log lines. TRADE
      RECORDED: a permanently dead FlareSolverr also matches this rx, and is
      accepted because the indexers behind it then fail with their OWN
      Cloudflare-challenge errors, which are a different string and still
      page. This table has no rate dimension - the same accepted limit the
      other transient classes record.
    added: 2026-08-25

  - id: arr-update-check-failure
    title: '*arr CommandExecutor failure on an external-facing scheduled task'
    rx: '(?i)error occurred while executing task (applicationcheckupdate|applicationupdatecheck|checkhealth)\b'
    field: null
    prompt_clause: '*arr "Error occurred while executing task ApplicationCheckUpdate/ApplicationUpdateCheck/CheckHealth" scheduled-task failures'
    why: >-
      One network blip (2026-08-22 03:38-03:40) made EVERY scheduled *arr
      task that touches the network log exactly one "CommandExecutor|Error
      occurred while executing task <X>" line, and each REA run resampled a
      DIFFERENT task name: radarr2 ApplicationCheckUpdate (run 1), prowlarr
      ApplicationUpdateCheck + radarr CheckHealth (run 2) - the *arrs do not
      even agree on the word order. Classing them one name at a time is
      whack-a-mole, so the class owns the CommandExecutor shape with an
      EXPLICIT allowlist of tasks whose only job is talking to external
      services: the two self-update spellings (structurally unactionable
      here - Ultra.cc installs and updates apps via the provider panel,
      never *arr self-update) and CheckHealth (probes indexers and download
      clients; the task failing to RUN once is not a health finding, and
      real *arr liveness is Kuma-canaried from outside). DELIBERATELY NOT a
      bare "executing task \w+": a failing Backup or RssSync task is local
      and actionable and must still page - extend the allowlist, never
      loosen it to a wildcard.
    added: 2026-08-25

  - id: seerr-plextv-watchlist-5xx
    title: Seerr plex.tv watchlist fetch 5xx
    rx: '(?is)failed to retrieve watchlist items.{0,160}status code 5\d\d'
    field: null
    prompt_clause: 'Seerr "Failed to retrieve watchlist items" plex.tv 5xx responses'
    why: >-
      Seerr syncing member watchlists from the plex.tv METADATA CLOUD and
      getting a 5xx back - Plex.TV having a moment, nothing on this box in
      the path. The sync is scheduled and self-retries; the next pass
      succeeds. ANCHORED TO 5xx ONLY, deliberately: a 401/403 on the same
      fetch is a token/auth break on OUR side and still pages, and so does
      any other watchlist error string. The 160-char window spans the JSON
      errorMessage wrapper the model quotes verbatim.
    added: 2026-08-25

  - id: reaper-success-line-misread
    title: qflix-reaper SUCCESS summary line misread as a failure
    rx: '(?is)\A(?!.*(?:\|\s*(?:Error|Fatal|Critical)\s*\||\[ERROR\]|ERROR\s*[-:]|Traceback \(most recent call last\))).*success\s*[-—]\s*\d+ deleted, [\d.]+ gb reclaimed'
    field: excerpt
    prompt_clause: 'qflix-reaper "SUCCESS - N deleted, N GB reclaimed" summary lines, including N=0'
    why: >-
      The reaper''s own SUCCESS summary line - "SUCCESS - 0 deleted, 0 GB
      reclaimed across 0 libraries" - reported as "qflix-reaper failed to
      delete any items" at severity=error by qwen2.5-coder:7b on 2026-08-25.
      The model inverted a success line: zero deletions means nothing aged
      past retention that day, which is the reaper WORKING. The raw log
      carries an em dash and the model excerpt an ASCII hyphen, so the rx
      accepts both. EXCERPT-SCOPED WITH THE SHARED ERROR-LEVEL GUARD
      (byte-identical to prowlarr-cardigann-retry-5xx and
      plex-orphaned-webhook-delivery, deliberately - widening happens in one
      commit across all copies): an excerpt that carries a real error token
      alongside the SUCCESS line declines the rule and still pages, and the
      reaper''s real failures (Kuma #-monitored, dead-man covered) never
      speak in this string at all.
    added: 2026-08-25

# Every ';'-delimited segment of the prompt's never-report sentence must be
# claimed here by >=1 class, and every class above must be claimed by exactly
# one segment. That two-way check is what would have caught the 2026-07-29 gap:
# a segment with no `classes:` entry means the prompt is asking without
# enforcing.
prompt_segments:
  - index: 0
    marker: 'Plex NAT-PMP / UPnP / port-mapping "not supported by gateway" messages'
    classes: [plex-nat-pmp-upnp]
  - index: 1
    marker: 'nginx error-page HTML returned to an *arr from an EXTERNAL indexer/proxy'
    classes: [external-indexer-5xx-html]
  - index: 2
    marker: 'indexer responses that merely echo a `"severity": "error"` JSON field'
    classes: [indexer-severity-field-echo]
  - index: 3
    marker: 'bare stack-trace CONTINUATION fragments'
    classes: [bare-stack-continuation]
  - index: 4
    marker: 'tdarr unhandled express-route errors'
    classes: [tdarr-express-undefined-includes, tdarr-worker-not-a-function]
  - index: 5
    marker: 'Plex client-abort stream writes'
    classes: [plex-client-abort-stream-write]
  - index: 6
    marker: "WASM out-of-memory failure"
    classes: [tdarr-wasm-oom, mediainfo-failure, tdarr-mediainfo-result-fragment]
  - index: 7
    marker: 'Failed to create parent iterator'
    classes: [plex-post-reap-scan]
  - index: 8
    marker: 'Plex "ClientProfileExtra: missing or invalid type parameter" lines, which PMS logs at ERROR level once or more per transcode-decision request and which never accompany a failed transcode'
    classes: [plex-client-profile-extra]
  - index: 9
    marker: "Plex \"Unable to find metadata agent provider for identifier\" naming the PSEUDO-identifiers 'library' or 'iva', which are Plex resolving its own PlayQueue and Discover scopes"
    classes: [plex-metadata-agent-pseudo-identifier]
  - index: 10
    marker: 'Sonarr/Radarr ParsingService "No matching series"/"No matching movie" Debug lines and the paired DownloadDecisionMaker "[Permanent] Unknown Series/Unknown Movie" rejections'
    classes: [arr-parsing-no-matching-title, arr-release-rejected-unknown-title]
  - index: 11
    marker: 'any finding whose ONLY evidence is *arr Debug-level lines - an excerpt carrying a "|Debug|" NLog level token and no error-level token'
    classes: [arr-debug-only-excerpt]
  - index: 12
    marker: 'Plex CreditsDetectionManager marker-scan chatter'
    classes: [plex-credits-detection-chatter]
  - index: 13
    marker: 'Plex "Unknown metadata type: folder" replies'
    classes: [plex-unknown-metadata-type-folder]
  - index: 14
    marker: 'Bazarr "Error trying to get releases from Github" GitHub API rate-limit failures'
    classes: [bazarr-github-release-check-ratelimit]
  - index: 15
    marker: 'Tdarr node "Binary test N: handbrakePath not working" lines'
    classes: [tdarr-handbrake-binary-test]
  - index: 16
    marker: 'Seerr/Jellyseerr Plex-scan "UNIQUE constraint failed: media.tvdbId" lines'
    classes: [seerr-plex-scan-tvdbid-collision]
  - index: 17
    marker: 'buildarr "Unsupported remote notification connection" warnings naming implementation PlexServer'
    classes: [buildarr-unsupported-plex-notification]
  - index: 18
    marker: 'Network Service: Error in advertiser handle read'
    classes: [plex-network-service-shutdown]
  - index: 19
    marker: 'SignalR client for Sonarr/Radarr connection as been lost'
    classes: [bazarr-signalr-reconnect]
  - index: 20
    marker: 'external indexer unavailability relayed by Prowlarr'
    classes: [arr-indexer-unavailable-backoff]
  - index: 21
    marker: 'Prowlarr Cardigann "Request for <indexer> failed with status 5xx. Retrying in Ns" retry warnings'
    classes: [prowlarr-cardigann-retry-5xx]
  - index: 22
    marker: 'Plex "Webhook: Error delivering payload" failures against the orphaned Discord webhook'
    classes: [plex-orphaned-webhook-delivery]
  - index: 23
    marker: '*arr ServerSideNotificationService "Failed to retrieve notifications" cloud-news poll timeouts'
    classes: [arr-cloud-news-fetch-timeout]
  - index: 24
    marker: '*arr Discord notifier "Unable to post payload" delivery failures'
    classes: [arr-discord-notify-post-failure]
  - index: 25
    marker: 'Bazarr "unable to sync subtitles" single-file subsync failures'
    classes: [bazarr-subsync-single-file]
  - index: 26
    marker: 'Prowlarr FlareSolverr "Proxy validation failed" one-off validation errors'
    classes: [prowlarr-flaresolverr-validation-transient]
  - index: 27
    marker: '*arr "Error occurred while executing task ApplicationCheckUpdate/ApplicationUpdateCheck/CheckHealth" scheduled-task failures'
    classes: [arr-update-check-failure]
  - index: 28
    marker: 'Seerr "Failed to retrieve watchlist items" plex.tv 5xx responses'
    classes: [seerr-plextv-watchlist-5xx]
  - index: 29
    marker: 'qflix-reaper "SUCCESS - N deleted, N GB reclaimed" summary lines, including N=0'
    classes: [reaper-success-line-misread]
  - index: 30
    marker: 'Plex CreditsDetectionManager "Job failed: Video does not exist" lines'
    classes: [plex-credits-job-video-missing]

# Deadman reasons, mirrored from $Script:DeadmanReasons. Kept here so C-09

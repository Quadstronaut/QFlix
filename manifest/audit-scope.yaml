# manifest/audit-scope.yaml — what "audit qflix" MEANS, as data.
#
# Before this file, the scope of the 2026-07-27 audit was declared in PROSE
# inside a commit message ("Audit of everything on the seedbox (except
# content)") — unqueryable, unenforced, and demonstrably false the next day.
# Scope is now a query.
#
# THE PARTITION INVARIANT (meta-check; failure exits 2, REGIME INTEGRITY):
# every git-tracked path matches EXACTLY ONE `repo_areas` entry or EXACTLY ONE
# `out_of_scope` entry. Not zero (a new top-level directory must be enrolled
# before it can be audited), not two (overlapping claims mean the boundary is
# ambiguous, which is precisely the section-1(g) failure).
#
# Patterns are glob-ish: `*` does not cross '/', `**` does. Order is
# irrelevant — the invariant is exactly-one, not first-match, so a new pattern
# cannot silently shadow an old one.

schema: 1

# ---------------------------------------------------------------------------
# THE FIVE SURFACES
# ---------------------------------------------------------------------------
surfaces:

  S1:
    title: repo, git-tracked
    host: repo
    enumerability: offline, 100% enumerable
    note: >-
      Everything `git ls-files` returns. Fully deterministic at a commit SHA.
      This is where all ten offline detectors operate.

  S2:
    title: repo-adjacent, untracked but load-bearing
    host: workstation
    enumerability: offline-PARTIAL
    note: >-
      Files the system depends on that are NOT in git and never will be (public
      repo, operator-local tooling). The FILE BODIES are permanently outside CI.
      Mitigation: extract their POLICY into tracked data and guard the
      extraction (C-07 + C-10). A body edit that does not touch policy is
      invisible to CI — residual R4.
    members:
      - path: scripts/local-llm/qflix-rea.ps1
        owner: operator
        residual: >-
          The 56KB LLM log auditor. Gitignored at .gitignore:55 because it is
          workstation-local tooling and the repo is public. It is the ALERTING
          LAYER — the thing the operator specifically said nothing audits. Its
          noise policy is extracted to manifest/rea-noise-classes.yaml and
          guarded by C-07; its test file is put in CI by C-10. What remains
          unguarded: any change to the script BODY that does not alter the
          extracted policy. BACKUP (fixed 2026-08-03): scripts/local-llm/
          backup-untracked.ps1 reads THIS members list, copies each entry into
          the Backup-Documents mirror hourly, keeps a content-addressed version
          history outside the /MIR purge scope, and SHA256-verifies all three.
          So a bad edit is now recoverable; before that the only backup was the
          daily /MIR, which is a mirror and was measured 22h and two edits stale
          with nothing checking it.
        policy_extract: manifest/rea-noise-classes.yaml
        loader: scripts/local-llm/rea-noise-classes.ps1
        review_cadence_days: 90
        last_reviewed: 2026-07-29
      - path: scripts/manitoba-tunnel.ps1
        owner: operator
        residual: >-
          The SSH tunnel launcher (gitignored at .gitignore:42). Workstation-
          local; carries operator host details. Nothing in the repo depends on
          its internals, but REA's blob collection depends on the tunnel being
          up — which is why REA has a `tunnel_timeout` deadman reason rather
          than a repo-side check. No policy to extract; the failure mode is
          covered live by REA's own dead-man, not offline. Backed up and
          verified by scripts/local-llm/backup-untracked.ps1 since 2026-08-03,
          for free — that script enrols every member of THIS list, so nothing
          here can be the one nobody remembered to cover.
        policy_extract: null
        loader: null
        review_cadence_days: 90
        last_reviewed: 2026-07-29

  S3:
    title: seedbox runtime state
    host: box
    enumerability: LIVE ONLY
    note: >-
      Deployed unit files, live Kuma monitor set, secret existence and modes,
      push tokens, quota, thread ceiling, stale-green pushers. Classes L-01..L-07 in
      manifest/defect-classes.yaml. Offline detectors CANNOT see this and do
      not pretend to.
    live_detector: scripts/maint/qflix-audit-live.py

  S4:
    title: workstation tooling
    host: workstation
    enumerability: MIXED
    note: >-
      REA, its scheduled task \Archangel\QFlix-LLM\, the MCP server, ollama, and
      the frozen B:\QFlix\data snapshot. THIS IS THE SURFACE THE 2026-07-27
      AUDIT DECLARED ITSELF OUT OF, which is why it missed everything REA. The
      tracked half (scripts/local/**, scripts/local-llm/*.ps1 that ARE tracked,
      tests/local-llm/**) is enumerated as S1; the untracked half is S2; the
      scheduled task and the ollama service are live-only and registered as
      residual rows R-WORKSTATION-SCHEDULED-TASKS and R-WORKSTATION-OLLAMA-SERVICE.

  S5:
    title: the alerting layer itself
    host: mixed
    enumerability: MIXED
    note: >-
      Kuma, the pusher, every canary in manifest/apps.yaml, REA, and THIS AUDIT
      REGIME. (The count is deliberately NOT written here. It read "19" while
      apps.yaml declared 22 and then 25 — a hand-maintained number inside the
      manifest whose whole job is enumerating what gets audited, drifting from
      the manifest it describes, and outside C-06's four-file boundary so no
      guard could see it.) The named
      trap. Each must be watched by something that is NOT itself:
      pusher <- "Manitoba Pusher"; REA <- Send-DeadmanAlert (5 reasons, 24h
      per-reason dedup); canaries <- Kuma dead-man; audit regime <- its own Kuma
      monitor ("QFlix Audit Regime") plus the section-3.3 bijection meta-check.
    turtle: >-
      THE IRREDUCIBLE LAST TURTLE, stated so it is never a surprise: the CI job
      itself is unwatched. If GitHub Actions silently stops running, everything
      above stays green and the digest stops changing for the most boring
      possible reason. The mitigation (assert the last successful master run is
      < 7 days old via the GitHub API) is NOT implemented — it needs network
      and a token, and every detector in this regime is offline by construction.
      Registered as residual row R5. It is not permitted to go unmentioned.

# ---------------------------------------------------------------------------
# REPO AREAS — the partition of S1
# ---------------------------------------------------------------------------
repo_areas:

  - id: A-root-docs
    surface: S1
    paths: ["README.md", "inventory.md", "CHANGELOG.md", "WARN.md", "Tuesday.md", "todo-after-claude.md"]
    covered_by: [C-06, C-08]

  - id: A-root-config
    surface: S1
    paths: [".gitignore", ".gitattributes", "versions.env", "Q.png", "renovate.json"]
    covered_by: []
    note: >-
      .gitignore is load-bearing for this regime: it is the file that put the
      alerting layer outside git. C-10's S2 registration is the guard.

      renovate.json is enrolled AHEAD of the file existing. The repo was deleted
      and recreated on 2026-08-01 to purge leaked personal data, which reset
      Renovate's activation state and made it open a fresh onboarding PR. That
      PR could not go green, because the partition invariant rejects any tracked
      path with no scope area — working exactly as designed, and a good
      demonstration that a bot cannot quietly add an unadjudicated file. An
      unmatched pattern is harmless (the invariant runs paths -> areas, not the
      reverse), so enrolling first is the ordering that lets the PR merge.

  - id: A-manifest
    surface: S1
    paths: ["manifest/*"]
    covered_by: [C-01, C-07, C-08]

  - id: A-ci
    surface: S5
    paths: [".github/**"]
    covered_by: [C-10]

  - id: A-claude
    surface: S1
    paths: [".claude/**"]
    covered_by: []
    note: Agent skill + council ledger. Documentation of process, not runtime code.

  - id: A-docs
    surface: S1
    paths: ["docs/*"]
    covered_by: [C-08]

  - id: A-docs-councils
    surface: S1
    paths: ["docs/councils/**"]
    covered_by: []
    note: Immutable transcripts. History surface for C-08.

  - id: A-docs-external
    surface: S1
    paths: ["docs/external/**"]
    covered_by: []

  - id: A-docs-superpowers
    surface: S1
    paths: ["docs/superpowers/**"]
    covered_by: []
    note: Vendored agent-workflow docs; not QFlix runtime.

  - id: A-scripts-root
    surface: S1
    paths: ["scripts/*"]
    covered_by: [C-02, C-03, C-04, C-08]

  - id: A-scripts-canaries
    surface: S5
    paths: ["scripts/canaries/**"]
    covered_by: [C-04, C-08, C-09]

  - id: A-scripts-configure
    surface: S1
    paths: ["scripts/configure/**"]
    covered_by: [C-02, C-03, C-04, C-08]

  - id: A-scripts-data
    surface: S1
    paths: ["scripts/data/**"]
    covered_by: [C-06, C-08]

  - id: A-scripts-install
    surface: S1
    paths: ["scripts/install/**"]
    covered_by: [C-02, C-03, C-08]

  - id: A-scripts-lib
    surface: S1
    paths: ["scripts/lib/*"]
    covered_by: [C-08]

  - id: A-scripts-local
    surface: S4
    paths: ["scripts/local/*", "scripts/local/qflix-mcp/**"]
    covered_by: [C-02, C-03, C-04, C-05]

  - id: A-scripts-local-llm
    surface: S4
    paths: ["scripts/local-llm/*"]
    covered_by: [C-07]
    note: >-
      Only the TRACKED files here (ollama-recover.ps1, .gitkeep, and the
      rea-noise-classes.ps1 loader). qflix-rea.ps1 itself is S2, not S1.

  - id: A-scripts-maint
    surface: S1
    paths: ["scripts/maint/*"]
    covered_by: [C-02, C-03, C-04, C-05, C-08, C-09]

  - id: A-scripts-maint-lib
    surface: S1
    paths: ["scripts/maint/lib/*"]
    covered_by: [C-02, C-03, C-04, C-08]

  - id: A-audit-regime
    surface: S5
    paths: ["scripts/maint/lib/audit/**"]
    covered_by: [C-02, C-03, C-10]
    note: >-
      The regime auditing itself. Its own findings are as enumerable as anyone
      else's — the detectors run over their own source. That is deliberate.

  - id: A-units-maint
    surface: S1
    paths: ["scripts/maint/systemd/**"]
    covered_by: [C-01, C-08]

  - id: A-scripts-mcp
    surface: S1
    paths: ["scripts/mcp/*", "scripts/mcp/lib/**"]
    covered_by: [C-02, C-03, C-04, C-05, C-08]

  - id: A-units-mcp
    surface: S1
    paths: ["scripts/mcp/systemd/**"]
    covered_by: [C-01]

  - id: A-scripts-ops
    surface: S1
    paths: ["scripts/ops/**"]
    covered_by: [C-02, C-03, C-08]

  - id: A-scripts-patches
    surface: S1
    paths: ["scripts/patches/**"]

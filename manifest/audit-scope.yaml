  - id: A-scripts-plex
    surface: S1
    paths: ["scripts/plex/**"]
    covered_by: [C-02, C-03, C-08]

  - id: A-scripts-post-import
    surface: S1
    paths: ["scripts/post-import/**"]
    covered_by: [C-04, C-08]

  - id: A-scripts-qflix-dash
    surface: S1
    paths: ["scripts/qflix-dash/**"]
    covered_by: [C-08]

  - id: A-scripts-newsletter
    surface: S1
    paths: ["scripts/qflix-newsletter/**"]
    covered_by: [C-02, C-03, C-04, C-08, C-10]

  - id: A-scripts-smoke
    surface: S1
    paths: ["scripts/smoke/**"]
    covered_by: [C-08]

  - id: A-apps-dash
    surface: S1
    paths: ["apps/qflix-dash/**"]
    covered_by: []
    note: >-
      SvelteKit source for the public dashboard. No Python detector applies. Its
      own `npm run check` gate is NOT in this repo's CI — registered as residual
      row R-DASH-CI rather than quietly implied to be covered.

  - id: A-apps-heartbeat
    surface: S1
    paths: ["apps/heartbeat-android/**"]
    covered_by: []
    note: Android heartbeat client. Same situation as A-apps-dash.

  - id: A-tests-root
    surface: S1
    paths: ["tests/*"]
    covered_by: [C-10]

  - id: A-tests-unit
    surface: S1
    paths: ["tests/unit/*"]
    covered_by: [C-10]

  - id: A-tests-audit
    surface: S5
    paths: ["tests/unit/audit/**"]
    covered_by: [C-10]

  - id: A-tests-fixtures
    surface: S1
    paths: ["tests/fixtures/**"]
    covered_by: []

  - id: A-tests-local-llm
    surface: S5
    paths: ["tests/local-llm/**"]
    covered_by: [C-10]
    note: >-
      85 Test-Case blocks against the alerting layer, in ZERO CI until Phase 0
      of this regime added the pwsh job.

out_of_scope:
  - id: OOS-media
    paths: []
    reason: >-
      Media content itself (the libraries, the files). Not in the repo and never
      will be. Declared so its omission is a decision, not an accident.
  - id: OOS-upstream
    paths: []
    reason: >-
      Third-party upstream source (Tdarr, the *arr suite, Plex, SABnzbd) and
      Ultra.cc platform internals the operator cannot change. These are residual
      R1 — they will keep producing new findings forever.

# ---------------------------------------------------------------------------
# CI EXECUTION MAP — the data C-10 checks the workflow against
# ---------------------------------------------------------------------------
# Each job must EXIST in the workflow file and one of its steps' `run:` must
# contain `must_contain`. Delete the pwsh job from the workflow and C-10 fails
# (test-not-in-ci for tests/local-llm/test-qflix-rea.ps1) — that is AC-5.
ci_execution:
  workflow: .github/workflows/tests.yml
  jobs:
    - job: pytest
      must_contain: "bash tests/run.sh"
      executes:
        - "tests/unit/**"
        - "tests/conftest.py"
        - "tests/__init__.py"
        - "scripts/qflix-newsletter/tests/**"
    - job: pwsh
      must_contain: "tests/local-llm/test-qflix-rea.ps1"
      executes:
        - "tests/local-llm/**"

# Files matching these are TEST FILES for C-10's purposes.
test_file_patterns:
  - "**/test_*.py"
  - "**/test-*.ps1"

# Roots a `from lib.X import ...` in a test resolves against. Mirrors
# tests/conftest.py's sys.path inserts — if those diverge, C-10 reports
# subject-unresolvable rather than guessing.
python_import_roots:
  - scripts/maint
  - scripts/qflix-newsletter
  - scripts/mcp
  - scripts/local/qflix-mcp

# ---------------------------------------------------------------------------
# RESIDUALS — every un-enumerable surface, with an owner and a review cadence.
# A `residual:` here with no matching row in docs/audit-residual-risk.md, or a
# row past its cadence, is a REGIME INTEGRITY failure (exit 2).
# ---------------------------------------------------------------------------
residuals:
  - id: R1
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-07-29
    residual: Upstream / platform change (Tdarr, *arr, Plex, SAB, Ultra.cc). Unbounded.
  - id: R2
    owner: operator
    review_cadence_days: 30
    last_reviewed: 2026-07-29
    residual: Live box drift between audit runs (L-01..L-07). Bounded only by cadence.
  - id: R3
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-07-29
    residual: >-
      Semantic defects with no syntactic signature — a policy contradiction
      between two config surfaces that share no token, a wrong threshold, wrong
      business logic. This regime does NOT replace an LLM audit; it shrinks the
      LLM's job from "search everything" to "search the residual".
  - id: R4
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-08-03
    residual: >-
      S2 untracked file bodies — only their extracted policy is guarded by CI.
      A body edit that does not touch policy is still invisible to a detector.
      What changed 2026-08-03: it is no longer also unrecoverable. Backup is
      scripts/local-llm/backup-untracked.ps1 (hourly, SHA256-verified, with a
      version history), so a bad edit can be rolled back even though CI cannot
      see it. Reviewing a body change remains a human act.
  - id: R5
    owner: operator
    review_cadence_days: 30
    last_reviewed: 2026-07-29
    residual: >-
      CI itself. The last-successful-run-age assertion is NOT implemented (it
      needs network + a token; this regime is offline by construction).
  - id: R6
    owner: operator
    review_cadence_days: 180
    last_reviewed: 2026-07-29
    residual: >-
      A defect class nobody has thought of yet. The regime does not prevent
      this; it guarantees that once thought of ONCE, it is enumerated
      exhaustively and never re-sampled.
  - id: R-WORKSTATION-SCHEDULED-TASKS
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-08-03
    residual: >-
      The Windows scheduled tasks behind the workstation half of the system.
      Their existence, schedule and enabled-state are live registry state, and a
      disabled task looks exactly like a quiet week. Two of them now:
      \QFlix-LLM\QFlix Random Error Audit (REA) and
      \Archangel\Backups\QFlix-Untracked-Backup (the S2 backup verifier, added
      2026-08-03). NOTE the REA task path is \QFlix-LLM\, at the ROOT — not
      \Archangel\QFlix-LLM\ as this row claimed until 2026-08-03; verified
      against Get-ScheduledTask that day. Partial mitigations, both honest about
      what they cannot do: REA is watched from the BOX by
      scripts/canaries/rea-liveness.sh, whose liveness does not depend on REA;
      the backup task has no such external watcher, but
      `backup-untracked.ps1 -VerifyOnly` fails on a receipt older than 48h, so
      anything that asks — including tests/local-llm/test-backup-untracked.ps1
      on this workstation — sees the staleness.
  - id: R-WORKSTATION-OLLAMA-SERVICE
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-07-29
    residual: >-
      The local ollama service and its model set. Live workstation state; the
      store was relocated to B:\AIModels 2026-07-24 after a deletion killed
      `serve` every boot.
  - id: R-DASH-CI
    owner: operator
    review_cadence_days: 90
    last_reviewed: 2026-07-29
    residual: >-
      apps/qflix-dash has a `svelte-check` gate that is NOT run by this repo's
      CI. 16 errors -> 0 was a manual milestone (8a694da), not an enforced one.

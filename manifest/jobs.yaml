  # -------------------------------------------------------- adjudicated: none
  # Every entry below was reviewed on 2026-07-29 while landing the audit
  # regime. Six of these are the spec's named candidates; the flaresolverr pair
  # was found by the detector itself, which is the point of enumerating the
  # glob instead of a hand-list.

  manitoba-maint-arr-audit:
    timer: scripts/maint/systemd/manitoba-maint-arr-audit.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Weekly (Sun 04:00) *arr configuration audit. It notifies Discord on
      findings but pushes no heartbeat, so a permanently-failing unit is
      indistinguishable from a clean week — the exact silent-failure shape this
      class exists to catch. Not closed in this commit because adding a
      heartbeat means a new Kuma monitor, a new push token, and a live box
      change, which belongs to the Phase 5 box-side work, not to a repo-only
      phase.
    open_gap: true
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-backup-prune:
    timer: scripts/maint/systemd/manitoba-maint-backup-prune.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Weekly (Sun 03:30) app-backup pruning. Its only failure consequence is
      disk growth, and disk growth is already dead-manned by the quota canary
      (every 15 min, Canary Quota) which fires long before a missed prune can
      hurt. Indirect coverage is sufficient here and a second monitor would add
      noise without adding information.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-ucc-detect:
    timer: scripts/maint/systemd/manitoba-maint-ucc-detect.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Detects Ultra.cc platform maintenance and sets the suppression flag other
      jobs read. If it stops, suppression stops being SET — the failure mode is
      extra alerts during UCC maintenance, never missed alerts. It fails
      LOUD-by-omission rather than silent, so a dead-man would guard the safer
      direction only.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-window:
    timer: scripts/maint/systemd/manitoba-maint-window.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Monday 11:00 UTC maintenance-window orchestrator. A missed run is visible
      the same week through the newsletter's "This week's tune-ups" line
      (rendered from last-upgrade.json) and through manitoba-maint-window-
      watchdog at 15:00 UTC, but neither is a Kuma dead-man: if BOTH the window
      and the watchdog fail to start, nothing pages. Known gap, weekly cadence,
      low blast radius; closing it is Phase 5 box-side work.
    open_gap: true
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-window-watchdog:
    timer: scripts/maint/systemd/manitoba-maint-window-watchdog.timer
    kuma_monitor: null
    no_monitor_reason: >-
      The watchdog for the Monday window (15:00 UTC — asserts the lock was
      released). Same shape as manitoba-maint-window: it is itself a watcher
      with no watcher. THIS IS AN INSTANCE OF THE TURTLE PROBLEM stated in
      audit-scope.yaml:S5 — the chain has to end somewhere and it currently ends
      here. Named so it is never a surprise.
    open_gap: true
    adjudicated: 2026-07-29
    owner: operator

  qflix-poster-cache-prune:
    timer: scripts/maint/systemd/qflix-poster-cache-prune.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Nightly newsletter poster-cache prune. Pure disk hygiene for a cache that
      is regenerated on demand; a stopped prune costs bounded disk, which the
      quota canary already watches. No correctness consequence.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-flaresolverr-canary:
    timer: scripts/maint/systemd/manitoba-maint-flaresolverr-canary.timer
    kuma_monitor: null
    no_monitor_reason: >-
      FOUND BY THE DETECTOR, not by the spec's hand-list. This canary is NOT in
      manifest/apps.yaml:canaries, so it has no Kuma monitor and no dead-man —
      it is a second, independent alert path that pages Discord directly and
      honours the push-suppress registry. That means if its timer dies, the ONLY
      signal is the absence of Discord messages nobody was expecting anyway.
      This is exactly the enumeration-boundary bug from the spec: whether an
      audit "sees" this depends on whether it walked scripts/*/systemd/ or
      manifest/apps.yaml. Closing it means enrolling it as a real canary
      (manifest entry + monitor + token) — Phase 5 box-side work.
    open_gap: true
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-flaresolverr-unsuppress:
    timer: scripts/maint/systemd/manitoba-maint-flaresolverr-unsuppress.timer
    kuma_monitor: null
    no_monitor_reason: >-
      A SELF-DESTRUCTING watcher: it polls flaresolverr, lifts the
      push-suppression once healthy, then deletes its own units and script. A
      dead-man is inapplicable by construction — the intended terminal state is
      "this timer no longer exists". If it dies early the suppression simply
      stays, which the operator sees as a permanently [SUPPRESSED] FlareSolverr
      monitor: visible, not silent.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

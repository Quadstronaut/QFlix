# manifest/jobs.yaml — the timer <-> dead-man ledger.
#
# Boundary for defect class C-01 (timer-without-deadman): every tracked
# scripts/*/systemd/*.timer UNION every key below. A timer with no entry, or an
# entry declaring neither `kuma_monitor` nor `no_monitor_reason`, is an ENFORCED
# finding: it means a scheduled job can stop running and nothing will notice.
#
# WHY A SEPARATE FILE (operator design law: compartmentalise for migration):
# manifest/apps.yaml answers "what apps exist and how are they health-checked".
# This answers "what runs on a schedule and what notices when it stops". They
# have different lifecycles — a job can be retimed without touching an app, and
# a future server migration retimes jobs wholesale. Folding this into apps.yaml
# would couple them.
#
# FIELDS
#   timer              repo-relative path to the .timer unit (cross-checked
#                      both ways: a wrong path is a finding, not a silent pass)
#   unit               ALTERNATIVE to `timer`, for an INSTALLER-GENERATED unit:
#                      live on the box, written by a configure-script heredoc,
#                      with no file in git. Bare unit name, e.g.
#                      `upgradinatorr.timer`. Adjudicated to the identical
#                      standard as `timer`, but never cross-checked against the
#                      tracked-file set, because it has no file by construction.
#                      Declaring BOTH, or NEITHER, is a finding.
#
#                      Added 2026-08-06. Before it, `timer` had to resolve to a
#                      repo path, so an installer unit was not merely
#                      unmonitored but INEXPRESSIBLE - declaring one raised
#                      `orphan-job-entry`, i.e. the ledger punished honesty.
#                      Seven were live and invisible to BOTH the offline C-01
#                      detector and timer-liveness.sh (which enumerates from the
#                      same `timer` paths): buildarr, kometa, logrotate,
#                      recyclarr, tdarr-node-pause, tdarr-node-resume,
#                      upgradinatorr. One vocabulary bug, not seven misses.
#   cron               ALTERNATIVE to both, for a CRONTAB line, which has no
#                      unit name AND no file in git. The value is a command
#                      SUBSTRING that uniquely identifies the line in
#                      `crontab -l`; cron-liveness.sh matches on it in both
#                      directions. Adjudicated to the identical standard.
#
#                      Added 2026-08-07, closing the THIRD scheduling plane.
#                      `unit:` closed installer-generated systemd timers on
#                      2026-08-06 but crontab stayed entirely outside the
#                      boundary - 10 lines, one of them kill_stream.sh --max 4,
#                      which is member-facing enforcement of the per-member
#                      concurrent-stream cap. Exactly ONE of timer/unit/cron per
#                      entry: zero leaves nothing to adjudicate, two is
#                      ambiguous about which mechanism actually runs it.
#
#   schedule           cron entries only: the crontab expression. Documentation
#                      for the reader; cron-liveness.sh matches on `cron:` and
#                      never on this, so a drifted comment cannot break the check.
#
#   kuma_monitor       the Kuma monitor that goes RED when this job stops. Must
#                      resolve against manifest/apps.yaml (apps + canaries) or
#                      lib/kuma.py:STANDALONE_SELF_PUSH_MONITORS, else finding.
#   no_monitor_reason  written adjudication for having none. >=40 chars.
#   open_gap           true  = adjudicated as a KNOWN, UNCLOSED gap. Reported as
#                              an ADVISORY finding every run so it cannot fade.
#                      false = genuinely does not need its own dead-man, and the
#                              reason says why.
#   adjudicated/owner  who decided, and when. Both required whenever
#                      no_monitor_reason is set.
#
# `open_gap: true` is deliberately NOT a way to make a finding disappear. It
# moves it from "unknown" to "known, dated, owned, and still reported".

schema: 1

jobs:

  # ---------------------------------------------------------------- monitored
  # Each of these has a Kuma monitor that flips RED if the job stops beating.

  bazarr2-sync:
    timer: scripts/maint/systemd/bazarr2-sync.timer
    kuma_monitor: "Bazarr 2 Sync"

  manitoba-maint-anime-janitor:
    timer: scripts/maint/systemd/manitoba-maint-anime-janitor.timer
    kuma_monitor: "qflix-anime-janitor"

  manitoba-maint-audio-disposition:
    timer: scripts/maint/systemd/manitoba-maint-audio-disposition.timer
    kuma_monitor: "QFlix Audio Disposition"

  manitoba-maint-reaper:
    timer: scripts/maint/systemd/manitoba-maint-reaper.timer
    kuma_monitor: "QFlix Reaper"

  manitoba-maint-torrent-janitor:
    timer: scripts/maint/systemd/manitoba-maint-torrent-janitor.timer
    kuma_monitor: "QFlix Torrent Janitor"

  qflix-collect:
    timer: scripts/maint/systemd/qflix-collect.timer
    kuma_monitor: "QFlix Collect (workstation)"

  qflix-newsletter:
    timer: scripts/maint/systemd/qflix-newsletter.timer
    kuma_monitor: "Qflix Newsletter"

  qflix-vlogs-ingest:
    timer: scripts/maint/systemd/qflix-vlogs-ingest.timer
    kuma_monitor: "Qflix VLogs Ingest"

  qflix-missing-search:
    timer: scripts/mcp/systemd/qflix-missing-search.timer
    kuma_monitor: "Qflix Missing Search"

  qflix-quality-fallback:
    timer: scripts/mcp/systemd/qflix-quality-fallback.timer
    kuma_monitor: "Qflix Quality Fallback"

  qflix-specials-policy:
    timer: scripts/mcp/systemd/qflix-specials-policy.timer
    kuma_monitor: "Qflix Specials Policy"

  manitoba-maint-audit-live:
    timer: scripts/maint/systemd/manitoba-maint-audit-live.timer
    kuma_monitor: "QFlix Audit Live"

  manitoba-maint-entitlement:
    timer: scripts/maint/systemd/manitoba-maint-entitlement.timer
    # Every 15 min (:07/:22/:37/:52 UTC). Self-pushes "QFlix Entitlement Gate",
    # registered in lib/kuma.py STANDALONE_SELF_PUSH_MONITORS with a 1h
    # heartbeat override — the 24h standalone default is correct for a daily
    # janitor and wrong here: a 15-minute job under a 24h dead-man can be dead
    # a full day while its monitor sits green.
    #
    # The dead-man matters more than most: this is the only thing that writes
    # Plex share sections or Seerr permissions, so if it stops, new members are
    # never provisioned AND lapsed ones are never reduced — both silent, because
    # nobody files a ticket saying "I still have access".
    kuma_monitor: "QFlix Entitlement Gate"

  manitoba-maint-audit:
    timer: scripts/maint/systemd/manitoba-maint-audit.timer
    kuma_monitor: "QFlix Audit Regime"

  # ------------------------------------------------------------- the canaries
  # Every canary timer, each pushing its own Kuma monitor. The count is NOT
  # written here on purpose: it was stale at "19" while the block held 22, and a
  # hand-maintained number inside a ledger is the same two-policy-surface defect
  # the ledger exists to prevent. manifest/apps.yaml `canaries:` is the count;
  # tests/unit/test_doc_counts.py enforces every doc that quotes it.

  manitoba-maint-canary-movie:
    timer: scripts/maint/systemd/manitoba-maint-canary-movie.timer
    kuma_monitor: "Canary Movie"
  manitoba-maint-canary-anime:
    timer: scripts/maint/systemd/manitoba-maint-canary-anime.timer
    kuma_monitor: "Canary Anime"
  manitoba-maint-canary-mobile-ux:
    timer: scripts/maint/systemd/manitoba-maint-canary-mobile-ux.timer
    kuma_monitor: "Canary Mobile-UX"
  manitoba-maint-canary-vlogs-stall:
    timer: scripts/maint/systemd/manitoba-maint-canary-vlogs-stall.timer
    kuma_monitor: "Canary VLogs Stall"
  manitoba-maint-canary-qbit-stall:
    timer: scripts/maint/systemd/manitoba-maint-canary-qbit-stall.timer
    kuma_monitor: "Canary qBit Stall"
  manitoba-maint-canary-sab-stall:
    timer: scripts/maint/systemd/manitoba-maint-canary-sab-stall.timer
    kuma_monitor: "Canary SAB Stall"
  manitoba-maint-canary-bazarr-ingest:
    timer: scripts/maint/systemd/manitoba-maint-canary-bazarr-ingest.timer
    kuma_monitor: "Canary Bazarr Ingest"
  manitoba-maint-canary-tdarr-pause-integrity:
    timer: scripts/maint/systemd/manitoba-maint-canary-tdarr-pause-integrity.timer
    kuma_monitor: "Canary Tdarr Pause Integrity"
  manitoba-maint-canary-stream-cap-liveness:
    timer: scripts/maint/systemd/manitoba-maint-canary-stream-cap-liveness.timer
    kuma_monitor: "Canary Stream Cap Liveness"
  manitoba-maint-canary-cron-liveness:
    timer: scripts/maint/systemd/manitoba-maint-canary-cron-liveness.timer
    kuma_monitor: "Canary Cron Liveness"
  manitoba-maint-canary-kometa-libraries:
    timer: scripts/maint/systemd/manitoba-maint-canary-kometa-libraries.timer
    kuma_monitor: "Canary Kometa Libraries"
  manitoba-maint-canary-stale-log-watchdog:
    timer: scripts/maint/systemd/manitoba-maint-canary-stale-log-watchdog.timer
    kuma_monitor: "Canary Stale-Log Watchdog"
  manitoba-maint-canary-kometa-deploy-drift:
    timer: scripts/maint/systemd/manitoba-maint-canary-kometa-deploy-drift.timer
    kuma_monitor: "Canary Kometa Deploy-Drift"
  manitoba-maint-canary-prowlarr-indexer-health:
    timer: scripts/maint/systemd/manitoba-maint-canary-prowlarr-indexer-health.timer
    kuma_monitor: "Canary Prowlarr Indexer Health"
  # Added 2026-08-03. Deliberately a SECOND Prowlarr timer, not a third probe
  # bolted onto the one above: that canary reads logs and Prowlarr's health
  # endpoint, this one reads Prowlarr's and each *arr's CONFIG. Different
  # signal, different cadence (hourly vs every-15min), independently swappable.
  manitoba-maint-canary-prowlarr-app-sync:
    timer: scripts/maint/systemd/manitoba-maint-canary-prowlarr-app-sync.timer
    kuma_monitor: "Canary Prowlarr App Sync"
  manitoba-maint-canary-hardlink-integrity:
    timer: scripts/maint/systemd/manitoba-maint-canary-hardlink-integrity.timer
    kuma_monitor: "Canary Hardlink Integrity"
  manitoba-maint-canary-plex-transcoder:
    timer: scripts/maint/systemd/manitoba-maint-canary-plex-transcoder.timer
    kuma_monitor: "Canary Plex Transcoder"
  manitoba-maint-canary-newsletter-digest:
    timer: scripts/maint/systemd/manitoba-maint-canary-newsletter-digest.timer
    kuma_monitor: "Canary Newsletter Digest"
  manitoba-maint-canary-quota:
    timer: scripts/maint/systemd/manitoba-maint-canary-quota.timer
    kuma_monitor: "Canary Quota"
  manitoba-maint-canary-tautulli-plex-link:
    timer: scripts/maint/systemd/manitoba-maint-canary-tautulli-plex-link.timer
    kuma_monitor: "Canary Tautulli-Plex Link"
  manitoba-maint-canary-thread-ceiling:
    timer: scripts/maint/systemd/manitoba-maint-canary-thread-ceiling.timer
    kuma_monitor: "Canary Thread Ceiling"
  manitoba-maint-canary-tdarr-scanner:
    timer: scripts/maint/systemd/manitoba-maint-canary-tdarr-scanner.timer
    kuma_monitor: "Canary Tdarr Scanner"
  manitoba-maint-canary-tdarr-healthcheck:
    timer: scripts/maint/systemd/manitoba-maint-canary-tdarr-healthcheck.timer
    kuma_monitor: "Canary Tdarr Healthcheck"
  manitoba-maint-canary-ucc-gate-stuck:
    timer: scripts/maint/systemd/manitoba-maint-canary-ucc-gate-stuck.timer
    kuma_monitor: "Canary UCC Gate Stuck"

  # Added 2026-07-30. The C-01 detector caught this the first time the audit ran
  # after the canary shipped: the timer existed with nothing declaring what would
  # notice if it stopped. Fitting, since the canary itself exists because the
  # dashboard served a dead shell for ~22h with every monitor green -- and it then
  # spent its first 25 minutes deployed pushing nothing, because its token was
  # missing and `manitoba-maint canary push` exits 0 when it cannot find one.
  manitoba-maint-canary-timer-liveness:
    timer: scripts/maint/systemd/manitoba-maint-canary-timer-liveness.timer
    kuma_monitor: "Canary Timer Liveness"

  manitoba-maint-canary-dash-asset-integrity:
    timer: scripts/maint/systemd/manitoba-maint-canary-dash-asset-integrity.timer
    kuma_monitor: "Canary Dash Asset Integrity"

  # Watched by its own Kuma monitor, like every other canary. Worth stating what
  # it does NOT cover: it compares ~/scripts against origin/master, so it cannot
  # see a box change made to something outside that tree, and it cannot see the
  # case where git and the box are BOTH wrong. It answers exactly one question --
  # is the code running the code we think we shipped -- which was previously
  # answered by nobody.
  manitoba-maint-canary-deploy-drift:
    timer: scripts/maint/systemd/manitoba-maint-canary-deploy-drift.timer
    kuma_monitor: "Canary Deploy Drift"

  # Added 2026-08-03. Plex episodes stuck on a `local://` guid — no synopsis, no
  # agent artwork, no air date. 30 found live across 2 sections, oldest 527 h,
  # with nothing in the repo previously inspecting Plex match state at all.
  manitoba-maint-canary-plex-unmatched:
    timer: scripts/maint/systemd/manitoba-maint-canary-plex-unmatched.timer
    kuma_monitor: "Canary Plex Unmatched"

  # Added 2026-08-03. The dead-man for the ONE component that does not run on
  # this box: the operator workstation's Random Error Audit. Its own liveness is
  # dead-manned the same way every other canary is — it pushes, so Kuma flips it
  # DOWN on a missed heartbeat, AND timer-liveness sees this ledger entry.
  manitoba-maint-canary-rea-liveness:
    timer: scripts/maint/systemd/manitoba-maint-canary-rea-liveness.timer
    kuma_monitor: "Canary REA Liveness"

  # -------------------------------------------------------- adjudicated: none
  # Every entry below was reviewed on 2026-07-29 while landing the audit
  # regime. Six of these are the spec's named candidates; the flaresolverr pair
  # was found by the detector itself, which is the point of enumerating the
  # glob instead of a hand-list.

  manitoba-maint-arr-audit:
    timer: scripts/maint/systemd/manitoba-maint-arr-audit.timer
    adjudicated: 2026-07-29
    owner: operator
    kuma_monitor: "Canary Timer Liveness"
    no_monitor_reason: >-
      Weekly (Sun 04:00) *arr configuration audit. It notifies Discord on findings
      but pushes no heartbeat, so a permanently-failing unit used to be
      indistinguishable from a clean week. Closed 2026-07-30: timer-liveness
      checks this timer is loaded/active/scheduled AND reports a non-success
      last run, which is precisely the "runs, fails, nobody hears" shape.
    open_gap: false
    adjudicated: 2026-07-30
    owner: operator

  manitoba-maint-backup-prune:
    timer: scripts/maint/systemd/manitoba-maint-backup-prune.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Weekly (Sun 03:30) app-backup pruning. Its only failure consequence is
      disk growth, and disk growth is already dead-manned by the quota canary
      (every 15 min, Canary Quota) which fires long before a missed prune can
      hurt. Indirect coverage is sufficient here and a second monitor would add
      noise without adding information.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-ucc-detect:
    timer: scripts/maint/systemd/manitoba-maint-ucc-detect.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Detects Ultra.cc platform maintenance and sets the suppression flag other
      jobs read. If it stops, suppression stops being SET — the failure mode is
      extra alerts during UCC maintenance, never missed alerts. It fails
      LOUD-by-omission rather than silent, so a dead-man would guard the safer
      direction only.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-window:
    timer: scripts/maint/systemd/manitoba-maint-window.timer
    adjudicated: 2026-07-29
    owner: operator
    kuma_monitor: "Canary Timer Liveness"
    no_monitor_reason: >-
      Monday 11:00 UTC maintenance-window orchestrator. Its dead-man is the
      timer-liveness canary (every 15 min), which fails if this timer stops
      being loaded, active or scheduled. Closed 2026-07-30: the previous gap
      was "if BOTH the window and the watchdog fail to start, nothing pages",
      and a generic liveness check covers exactly that both-fail case.
    open_gap: false
    adjudicated: 2026-07-30
    owner: operator

  manitoba-maint-window-watchdog:
    timer: scripts/maint/systemd/manitoba-maint-window-watchdog.timer
    adjudicated: 2026-07-29
    owner: operator
    kuma_monitor: "Canary Timer Liveness"
    no_monitor_reason: >-
      The watchdog for the Monday window. Was the canonical TURTLE PROBLEM -- a
      watcher with no watcher. Closed 2026-07-30 by the timer-liveness canary,
      which watches this timer like any other and is itself dead-manned by
      Kuma: it PUSHES, so if it stops, Kuma flips it DOWN on a missed
      heartbeat. The chain now terminates at Kuma rather than at this unit.
    open_gap: false
    adjudicated: 2026-07-30
    owner: operator

  qflix-poster-cache-prune:
    timer: scripts/maint/systemd/qflix-poster-cache-prune.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Nightly newsletter poster-cache prune. Pure disk hygiene for a cache that
      is regenerated on demand; a stopped prune costs bounded disk, which the
      quota canary already watches. No correctness consequence.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  manitoba-maint-flaresolverr-canary:
    timer: scripts/maint/systemd/manitoba-maint-flaresolverr-canary.timer
    adjudicated: 2026-07-29
    owner: operator
    kuma_monitor: "Canary Timer Liveness"
    no_monitor_reason: >-
      A second, independent alert path that pages Discord directly and is not in
      manifest/apps.yaml:canaries, so it has no monitor of its own. The gap was
      "if its timer dies, the ONLY signal is the absence of Discord messages
      nobody was expecting anyway". Closed 2026-07-30 by timer-liveness, which
      needs no monitor of its own to notice this timer stopped.
    open_gap: false
    adjudicated: 2026-07-30
    owner: operator

  manitoba-maint-flaresolverr-unsuppress:
    # Exempt from the timer-liveness canary's LOADED predicate. This unit
    # deletes itself on success, so ABSENT is its intended terminal state --
    # the canary correctly reported it missing on its first working run, and
    # that would be a permanent false red. Declared here rather than
    # hardcoded in the canary so the exemption is visible where the job is.
    may_be_absent: true
    timer: scripts/maint/systemd/manitoba-maint-flaresolverr-unsuppress.timer
    kuma_monitor: null
    no_monitor_reason: >-
      A SELF-DESTRUCTING watcher: it polls flaresolverr, lifts the
      push-suppression once healthy, then deletes its own units and script. A
      dead-man is inapplicable by construction — the intended terminal state is
      "this timer no longer exists". If it dies early the suppression simply
      stays, which the operator sees as a permanently [SUPPRESSED] FlareSolverr
      monitor: visible, not silent.
    open_gap: false
    adjudicated: 2026-07-29
    owner: operator

  # ------------------------------------------- installer-generated (`unit:`)
  # Live on the box, written by configure-script heredocs, no file in git.
  # Enumerated 2026-08-06 by diffing `systemctl --user list-timers` (53 live)
  # against this ledger (47 declared) - the diff nobody had run. Every one of
  # these was outside BOTH the offline detector and timer-liveness.sh.

  buildarr:
    unit: buildarr.timer
    kuma_monitor: "Buildarr"

  kometa:
    unit: kometa.timer
    kuma_monitor: "Kometa"

  recyclarr:
    unit: recyclarr.timer
    kuma_monitor: "Recyclarr"

  upgradinatorr:
    unit: upgradinatorr.timer
    kuma_monitor: "Upgradinatorr"

  logrotate:
    unit: logrotate.timer
    kuma_monitor: null
    no_monitor_reason: >-
      Ultra.cc panel-managed log rotation for the slot. If it stops, logs grow
      until the quota canary (80% warn / 90% critical) fires - a real,
      already-monitored downstream signal with days of headroom, not a silent
      failure. A dedicated dead-man would duplicate the quota canary's concern
      without adding a distinct signal.
    open_gap: false
    adjudicated: 2026-08-06
    owner: operator

  tdarr-node-pause:
    unit: tdarr-node-pause.timer
    # Dead-manned by EFFECT rather than by liveness, which is the right test
    # here: what matters is not that this timer fired, but that the node is
    # actually stopped during quiet hours. canary-tdarr-pause-integrity asserts
    # exactly that and goes red if the node is ACTIVE inside the window.
    #
    # Declared open_gap: true earlier the same day, before that canary existed.
    # The gap was real: pusher.py pushes "Tdarr Node" UP and SKIPS the probe
    # inside the window (correctly - otherwise it auto-healed the node 2min into
    # every pause), and tdarr-healthcheck.sh holds its stall threshold above the
    # 5h pause. Every surface was blinded during exactly the interval that
    # mattered, so a disabled or rebuilt-away timer let the node transcode
    # through the streaming peak with everything green.
    kuma_monitor: "Canary Tdarr Pause Integrity"

  tdarr-node-resume:
    unit: tdarr-node-resume.timer
    # The RESUME half genuinely is dead-manned: if it fails to fire the node
    # stays paused, and once the window closes the pusher stops suppressing the
    # probe, so "Tdarr Node" goes red. Asymmetric with the pause half by nature
    # - a stuck-PAUSED node becomes visible, a stuck-RUNNING one does not.
    kuma_monitor: "Tdarr Node"

  # ------------------------------------------------------- crontab (`cron:`)
  # The THIRD scheduling plane, enumerated 2026-08-07 from `crontab -l` (10
  # lines) and previously outside the boundary entirely. Live presence is
  # checked by cron-liveness.sh in BOTH directions; this file is the source of
  # truth for what SHOULD be there and what notices when it stops.

  cron-kill-stream:
    cron: "scripts/plex/kill_stream.sh --max 4"
    schedule: "* * * * *"
    # Member-facing ENFORCEMENT of the per-member concurrent-stream cap. Dead-
    # manned by effect: canary-stream-cap-liveness reads the writer-stamped ts
    # in kill-history.json, which kill_stream.py appends on every run.
    kuma_monitor: "Canary Stream Cap Liveness"

  cron-stream-stats:
    cron: "scripts/plex/stream_stats.sh"
    schedule: "* * * * *"
    # Same canary, second predicate (state.json's ts). Declared separately
    # because they are two independent crontab lines: one can be dropped
    # without the other, and the canary names which.
    kuma_monitor: "Canary Stream Cap Liveness"

  cron-heartbeat-listmonk:
    cron: "scripts/ops/heartbeat-listmonk.sh"
    schedule: "*/5 * * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      A RESTART helper, not a producer: it curls listmonk /health and restarts
      the unit only if dead. If this cron stops, nothing silently degrades - the
      "Listmonk" app monitor still reds on the underlying outage, exactly as it
      would if the helper had never existed. What is lost is automatic recovery,
      which turns a self-healing outage into a visible one. That is a
      degradation of convenience, not of observability, so it needs no separate
      dead-man of its own.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

  cron-heartbeat-tdarr-server:
    cron: "scripts/ops/heartbeat-tdarr-server.sh"
    schedule: "*/5 * * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Restart helper for tdarr-server, same shape as heartbeat-listmonk: the
      "Tdarr" app monitor still reds on the real outage if this stops. Losing it
      costs auto-recovery, not visibility.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

  cron-heartbeat-tdarr-node:
    cron: "scripts/ops/heartbeat-tdarr-node.sh"
    schedule: "*/5 * * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Restart helper for tdarr-node. Same reasoning as the other two heartbeats,
      with one extra: it carries its own quiet-hours guard so it does not fight
      tdarr-node-pause.timer, and that interaction is now separately watched by
      canary-tdarr-pause-integrity.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

  cron-heartbeat-maint-webhook:
    cron: "scripts/ops/heartbeat-maint-webhook.sh"
    schedule: "*/5 * * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Restart helper for the manitoba-maint webhook receiver. If it stops, the
      "Manitoba Pusher" self-heartbeat and the webhook's own app monitor still
      red on a genuine receiver outage. Auto-recovery lost, observability intact.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

  cron-listmonk-sync:
    cron: "scripts/ops/listmonk-sync.py"
    schedule: "0 4 * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Nightly reconcile of Plex shares into Listmonk subscribers. A silent stop
      means new members stop being onboarded to the newsletter - member-visible
      but slow, low-severity, and self-announcing (the operator notices a new
      member is not receiving the weekly send). Writes to
      ~/.apps/listmonk/logs/sync.log, so stale-log-watchdog is the natural home
      for a freshness check if this is ever worth escalating. UNCLOSED by
      choice, not by oversight - recorded so the next audit inherits the
      decision rather than rediscovering the gap.
    open_gap: true
    adjudicated: 2026-08-07
    owner: operator

  cron-prune-text-libraries:
    cron: "scripts/post-import/prune-text-libraries.sh"
    schedule: "0 4 * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Nightly cleanup of text/ebook leftovers after import. Failure mode is
      pure accretion: files that should have been removed stay on disk. The
      quota canary (80% warn / 90% critical) is the real downstream signal and
      has weeks of headroom at this job's volume, so a dedicated dead-man would
      duplicate its concern without adding a distinct one.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

  cron-arr-housekeeping-missing:
    cron: "arr-housekeeping.py --missing"
    schedule: "0 4 * * 0,2,3,4,5,6"
    kuma_monitor: null
    no_monitor_reason: >-
      Nightly missing-episode search sweep (six days a week; Monday is skipped
      for the maintenance window). If it stops, nothing breaks - wanted items
      simply stop being re-searched, which surfaces as members reporting
      long-missing episodes rather than as any red. NOTE: qflix-missing-search
      .timer also exists as a systemd unit; whether these two overlap or divide
      the work was NOT established during this audit and is worth a look.
      Tracked as an open gap for that reason, not because the sweep itself is
      unmonitorable.
    open_gap: true
    adjudicated: 2026-08-07
    owner: operator

  cron-arr-housekeeping-unstick:
    cron: "arr-housekeeping.py --unstick"
    schedule: "15 * * * *"
    kuma_monitor: null
    no_monitor_reason: >-
      Hourly autonomous unstick of wedged *arr queue items. A silent stop means
      stuck downloads stop being cleared automatically; they then accumulate
      and become visible through the qBit/SAB stall canaries and through members
      reporting a request that never completes. Degrades recovery, not
      visibility. Writes ~/.opt/maint/arr-unstick.log, so stale-log-watchdog is
      the escalation path if this ever warrants one.
    open_gap: false
    adjudicated: 2026-08-07
    owner: operator

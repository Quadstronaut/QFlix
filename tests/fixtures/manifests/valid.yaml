defaults:
  health_timeout_s: 5
  recovery_attempts: 3
  recovery_backoff_s: [10, 30, 60]
  lifecycle_timeout_s: 60
  kuma_recheck_delay_s: 90

apps:
  sonarr:
    class: ucc
    ucc_slug: sonarr
    kuma_monitor: "Sonarr"
    health:
      kind: http_api
      path_template: "/{urlbase}/api/v3/system/status"
      auth_header: "X-Api-Key"
      auth_secret: sonarr.key
      port_secret: sonarr.port
      urlbase_secret: sonarr.urlbase
      expect_status: 200

  listmonk:
    class: systemd
    unit: listmonk.service
    kuma_monitor: "Listmonk"
    health:
      kind: http_root
      port_secret: listmonk.port
      expect_status: 200

  recyclarr:
    class: cron
    unit: recyclarr.timer
    kuma_monitor: null
    health:
      kind: systemd_only
      expect: active
